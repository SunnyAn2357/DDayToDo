                  <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; border-top:1px dashed #e2e8f0; padding-top:6px;">
                    <label class="options-chip"><input type="checkbox" class="rem-hour-check" value="120" ${has2h ? 'checked' : ''}> 2시간 전</label>
                    <label class="options-chip"><input type="checkbox" class="rem-hour-check" value="60" ${has1h ? 'checked' : ''}> 1시간 전</label>
                    <label class="options-chip"><input type="checkbox" id="modalCustomHourRemCheck" ${customHourRemVal ? 'checked' : ''}> 기타</label>
                    <input type="text" id="modalCustomHourRem" class="control inline-input" placeholder="시간 입력(예: 30분, 3시간)" value="${esc(customHourRemVal)}">
                  </div>
                </div>
              </div>

              <!-- 8. 반복 주기 -->
              <div class="field" id="fieldRecurrence" style="margin-bottom:6px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; gap:8px;">
                  <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                    <label style="margin-bottom:0;">반복 주기</label>
                    <span id="periodRecNotice" style="display:none; font-size:11.5px; color:#e11d48; font-weight:500;">※ 기간 일정(2일 이상)은 반복 주기를 설정할 수 없습니다.</span>
                  </div>
                  <span id="modalLunarDateDisplay" style="font-size:12px; color:#2563eb; font-weight:600; display:none;"></span>
                </div>
                <div class="options-card">
                  <label class="options-chip"><input type="checkbox" class="rec-check" value="weekly" ${isWeekly ? 'checked' : ''}> 매주</label>
                  <label class="options-chip"><input type="checkbox" class="rec-check" value="monthly" ${isMonthly ? 'checked' : ''}> 매월</label>
                  <label class="options-chip"><input type="checkbox" class="rec-check" value="yearly" ${isYearly ? 'checked' : ''}> 매년</label>
                  <label class="options-chip"><input type="checkbox" class="rec-check" id="modalCustomRecCheck" value="custom" ${isCustomRec ? 'checked' : ''}> 기타</label>
                  <input type="text" id="modalCustomRec" class="control inline-input" placeholder="일 수(예: 15)" value="${esc(customRecVal)}">
                  <label class="label-addon-btn" style="cursor:pointer; margin-left:auto;">
                    <input type="checkbox" id="modalIsLunar" ${editTarget.isLunar ? 'checked' : ''} style="margin:0; width:14px; height:14px; accent-color:#4f46e5;"> 음력
                  </label>
                </div>
              </div>

              <!-- 9. 완료 처리 (수정 모드 전용) -->
              ${editing ? `
              <div class="completion-box" id="fieldCompletion" style="margin-bottom:6px;">
                <label class="options-chip"><input type="checkbox" id="modalCompleted" ${editTarget.completed ? 'checked' : ''}> 완료 처리</label>
                <input type="date" id="modalCompletedDate" class="control" min="1900-01-01" max="2099-12-31" style="width:130px; margin-left:auto;" value="${editTarget.completedDate || today()}">
              </div>` : ''}
            </div>
            <div class="modal-foot" style="padding:10px 16px; box-sizing:border-box;">
              ${editing ? `<button type="button" class="btn" data-action="deleteTask" data-id="${editTarget.id}" style="height:32px; padding:0 14px; color:#e11d48; border:1px solid #fecdd3; border-radius:10px; background:#ffffff; cursor:pointer;">삭제</button>` : '<div></div>'}
              <div class="actions">
                <button type="button" class="btn" data-action="closeEditor" title="닫기 (단축키: Esc)" style="height:32px; padding:0 16px; border:1px solid #cbd5e1; border-radius:10px; color:#475569; background:#ffffff; cursor:pointer;">취소</button>
                <button type="button" id="modalSaveTaskBtn" class="btn primary" style="background:#4f46e5 !important; color:#ffffff !important; border:1px solid #4338ca !important; border-radius:10px !important; font-weight:700 !important; padding:0 22px !important; height:32px !important; box-shadow:0 2px 6px rgba(79,70,229,0.28) !important; cursor:pointer;" title="저장 (일반 필드: Enter, 메모: Shift+Enter)">저장</button>
              </div>
            </div>
          </form>`;

        function syncHolidayUI() {
          const h = $('modalHoliday').checked;
          const btn = $('modalHolidayWorkBtn');
          if (btn) {
            btn.style.display = h ? 'inline-flex' : 'none';
            if (holidayHasTask) {
              btn.classList.remove('primary');
              btn.style.background = '#e2e8f0';
              btn.style.color = '#334155';
              btn.style.borderColor = '#cbd5e1';
              btn.textContent = '- 일정취소';
              btn.title = '클릭하면 순수 공휴일(일정 없음)로 전환합니다';
            } else {
              btn.classList.remove('primary');
              btn.style.background = '';
              btn.style.color = '';
              btn.style.borderColor = '';
              btn.textContent = '+ 일정추가';
              btn.title = '공휴일 당일 업무 일정도 함께 등록합니다';
            }
          }

          const isPureHoliday = h && !holidayHasTask;
          ['modalStartDate', 'modalDueDate', 'modalTags', 'modalPriority', 'modalCustomRem', 'modalCustomRec', 'modalCompleted', 'modalCompletedDate', 'modalIsLunar'].forEach(id => {
            const el = $(id);
            if (el) el.disabled = isPureHoliday;
          });
          const memoDiv = $('modalMemo');
          if (memoDiv) {
            memoDiv.contentEditable = !isPureHoliday;
          }
          document.querySelectorAll('#editor input[name="modalDdayMode"]').forEach(el => el.disabled = isPureHoliday);
          document.querySelectorAll('#editor .rem-check').forEach(el => el.disabled = isPureHoliday);
          document.querySelectorAll('#editor .rec-check').forEach(el => el.disabled = isPureHoliday);

          ['fieldMemo', 'memoMdToolbar', 'fieldTags', 'fieldPriority', 'fieldDdayMode', 'fieldDateRange', 'fieldReminders', 'fieldRecurrence', 'fieldCompletion'].forEach(id => {
            const el = $(id);
            if (el) {
              el.style.opacity = isPureHoliday ? '0.4' : '1';
              el.style.pointerEvents = isPureHoliday ? 'none' : 'auto';
            }
          });
          if (!isPureHoliday) syncPeriodRecurrenceUI();
        }

        function syncPeriodRecurrenceUI() {
          if ($('modalHoliday')?.checked && !holidayHasTask) return;
          const sVal = $('modalStartDate')?.value;
          const dVal = $('modalDueDate')?.value;
          const isPeriod = sVal && dVal && sVal !== dVal;
          const recField = $('fieldRecurrence');
          const notice = $('periodRecNotice');
          if (recField) {
            const recInputs = recField.querySelectorAll('.rec-check, #modalCustomRec');
            recInputs.forEach(el => el.disabled = isPeriod);
            const optRow = recField.querySelector('.options-card, .reminder-options');
            if (optRow) {
              optRow.style.opacity = isPeriod ? '0.45' : '1';
              optRow.style.pointerEvents = isPeriod ? 'none' : 'auto';
            }
            if (isPeriod) {
              recInputs.forEach(el => {
                if (el.type === 'checkbox') el.checked = false;
                else if (el.type === 'text') el.value = '';
              });
              if (notice) notice.style.display = 'inline-block';
            } else {
              if (notice) notice.style.display = 'none';
            }
          }
          updateModalLunarDisplay();
        }

        function updateModalLunarDisplay() {
          const isL = $('modalIsLunar')?.checked;
          const disp = $('modalLunarDateDisplay');
          const sVal = $('modalStartDate')?.value;
          if (!disp) return;
          if (isL && sVal && lunarConverter) {
            try {
              const dObj = parseDate(sVal);
              lunarConverter.setSolarDate(dObj.getFullYear(), dObj.getMonth() + 1, dObj.getDate());
              const lc = lunarConverter.getLunarCalendar();
              disp.textContent = `(음력 ${lc.month}. ${lc.day}${lc.intercalation ? ' 윤달' : ''})`;
              disp.style.display = 'inline';
            } catch (e) {
              disp.style.display = 'none';
            }
          } else {
            disp.style.display = 'none';
          }
        }

        // [V1.3.3] 알림 기타 체크박스 <-> 입력창 자동 연동
        const customRem = $('modalCustomRem');
        const customRemCheck = $('modalCustomRemCheck');
        if (customRem && customRemCheck) {
          customRem.addEventListener('input', () => {
            customRemCheck.checked = customRem.value.trim().length > 0;
          });
          customRemCheck.addEventListener('change', () => {
            if (customRemCheck.checked) {
              customRem.focus();
            } else {
              customRem.value = '';
            }
          });
        }

        // [V1.6.0] 시간별 알림 기타 체크박스 <-> 입력창 자동 연동
        const customHourRem = $('modalCustomHourRem');
        const customHourRemCheck = $('modalCustomHourRemCheck');
        if (customHourRem && customHourRemCheck) {
          customHourRem.addEventListener('input', () => {
            customHourRemCheck.checked = customHourRem.value.trim().length > 0;
          });
          customHourRemCheck.addEventListener('change', () => {
            if (customHourRemCheck.checked) {
              customHourRem.focus();
            } else {
              customHourRem.value = '';
            }
          });
        }

        // [V1.3.3] 반복 주기 기타 체크박스 <-> 입력창 자동 연동 및 상호배제
        const recChecks = document.querySelectorAll('#editor .rec-check');
        const customRec = $('modalCustomRec');
        const customRecCheck = $('modalCustomRecCheck');
        recChecks.forEach(cb => {
          cb.addEventListener('change', () => {
            if (cb.checked) {
              recChecks.forEach(other => { if (other !== cb) other.checked = false; });
              if (cb === customRecCheck) {
                if (customRec) customRec.focus();
              } else {
                if (customRec) customRec.value = '';
              }
            } else {
              if (cb === customRecCheck && customRec) {
                customRec.value = '';
              }
            }
          });
        });
        if (customRec) {
          customRec.addEventListener('input', () => {
            const v = customRec.value.trim();
            if (v && v !== '0') {
              recChecks.forEach(cb => { if (cb !== customRecCheck) cb.checked = false; });
              if (customRecCheck) customRecCheck.checked = true;
            } else {
              if (customRecCheck) customRecCheck.checked = false;
            }
          });
        }

        $('modalIsLunar')?.addEventListener('change', updateModalLunarDisplay);

        $('modalStartDate').addEventListener('input', () => {
          const sVal = $('modalStartDate').value;
          const dVal = $('modalDueDate').value;
          if (sVal && sVal.length === 10 && (!dVal || dVal < sVal)) {
            $('modalDueDate').value = sVal;
          }
          syncPeriodRecurrenceUI();
        });
        $('modalDueDate').addEventListener('input', syncPeriodRecurrenceUI);

        $('modalHoliday').addEventListener('change', () => {
          holidayHasTask = false;
          syncHolidayUI();
        });

        $('modalHolidayWorkBtn').addEventListener('click', () => {
          holidayHasTask = !holidayHasTask;
          syncHolidayUI();
        });

        ['modalStartDate', 'modalDueDate', 'modalCompletedDate'].forEach(id => attachDate4Digits($(id)));

        syncHolidayUI();
        syncPeriodRecurrenceUI();
        updateModalLunarDisplay();

        // [V1.5.1] 스마트 시간 입력: 1030 입력 시 자동으로 10:30 표출 및 4자리 완료 시 제목으로 커서 자동 이동
        const timeInp = $('modalTime');
        if (timeInp) {
          timeInp.addEventListener('input', (e) => {
            let v = timeInp.value.replace(/[^0-9]/g, '');
            if (v.length > 4) v = v.slice(0, 4);
            if (v.length >= 3) {
              timeInp.value = v.slice(0, 2) + ':' + v.slice(2);
            } else if (v.length === 2 && e.inputType !== 'deleteContentBackward') {
              timeInp.value = v + ':';
            } else {
              timeInp.value = v;
            }
            const cleanDigits = timeInp.value.replace(/[^0-9]/g, '');
            if (cleanDigits.length === 4) {
              $('modalTitle')?.focus();
            }
          });
        }

        // [V1.5.1] 일정 저장 핵심 함수 (버튼 클릭 및 Enter 키 공통 호출)
        function doSaveTask() {
          const title = ($('modalTitle')?.value || '').trim();
          if (!title) {
            alert('일정 제목을 입력하세요.');
            $('modalTitle')?.focus();
            return;
          }

          const startDate = $('modalStartDate')?.value || editTarget.startDate || editTarget.dueDate || today();
          const dueDate = $('modalDueDate')?.value || editTarget.dueDate || editTarget.startDate || today();
          if (dueDate < startDate) {
            alert('마감일은 시작일 이후여야 합니다.');
            return;
          }

          editTarget.title = title;
          editTarget.time = ($('modalTime')?.value || '').trim();
          editTarget.location = ($('modalLocation')?.value || '').trim();
          editTarget.startDate = startDate;
          editTarget.dueDate = dueDate;
          editTarget.isHoliday = $('modalHoliday')?.checked || false;
          editTarget.holidayHasTask = editTarget.isHoliday && holidayHasTask;

          if (editTarget.isHoliday && !editTarget.holidayHasTask) {
            editTarget.memo = '';
            editTarget.tags = [];
            editTarget.dueTime = '';
            editTarget.reminders = [];
            editTarget.priority = 'normal';
            editTarget.recurrence = 'none';
            editTarget.isLunar = false;
            editTarget.ddayMode = 'workday';
            editTarget.completed = false;
            editTarget.completedDate = '';
          } else {
            editTarget.memo = convertHTMLToMarkdown($('modalMemo')?.innerHTML || '');
            editTarget.tags = ($('modalTags')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
            editTarget.priority = $('modalPriority')?.value || 'normal';
            const checkedDday = document.querySelector('input[name="modalDdayMode"]:checked');
            editTarget.ddayMode = checkedDday ? checkedDday.value : 'workday';
            editTarget.isLunar = $('modalIsLunar') ? $('modalIsLunar').checked : false;

            // Recurrence calculation (기간 일정은 반복 불가)
            const isPeriod = startDate !== dueDate;
            let rec = 'none';
            if (!isPeriod) {
              const checkedRec = document.querySelector('#editor .rec-check:checked');
              if (checkedRec && checkedRec.value !== 'custom') {
                rec = checkedRec.value;
              } else if (customRec && customRec.value.trim() && !isNaN(Number(customRec.value)) && Number(customRec.value) > 0) {
                rec = String(Math.floor(Number(customRec.value.trim())));
              }
            }
            editTarget.recurrence = rec;

            // [V1.3.3] 알림 주기 계산 (기타 체크박스 활성화 시에만 커스텀 일수 반영)
            let rems = [...document.querySelectorAll('#editor .rem-check:checked')].map(x => +x.value);
            let c = (customRemCheck && customRemCheck.checked && customRem)
              ? customRem.value.split(',').map(x => x.trim()).filter(Boolean).map(Number)
              : [];
            editTarget.reminders = [...new Set([0, ...rems, ...c])].filter(n => !isNaN(n) && n >= 0).sort((a, b) => a - b);

            // [V1.6.0] 시간별 당일 알림 주기 수집
            let hourRems = [...document.querySelectorAll('#editor .rem-hour-check:checked')].map(x => +x.value);
            let ch = (customHourRemCheck && customHourRemCheck.checked && customHourRem)
              ? customHourRem.value.split(',').map(x => x.trim()).filter(Boolean).map(val => {
                  if (val.endsWith('시간')) return parseFloat(val) * 60;
                  if (val.endsWith('분')) return parseFloat(val);
                  const num = Number(val);
                  return !isNaN(num) ? num : null;
                }).filter(n => n !== null && n > 0)
              : [];
            editTarget.hourReminders = [...new Set([...hourRems, ...ch])].sort((a, b) => b - a);

            if (editing) {
              editTarget.completed = $('modalCompleted') ? $('modalCompleted').checked : false;
              editTarget.completedDate = editTarget.completed ? ($('modalCompletedDate').value || today()) : '';
            }
          }

          const rec = editTarget.recurrence;
          const next = clone(data);

          if (rec !== 'none') {
            let rule = null;
            if (editTarget.recurringId) {
              rule = (next.recurrings || []).find(r => r.id === editTarget.recurringId);
            }
            if (!rule) {
              rule = {
                id: uid(),
                title: editTarget.title,
                memo: editTarget.memo,
                tags: [...editTarget.tags],
                startDate: editTarget.startDate,
                endDate: '',
                dueDate: editTarget.startDate,
                dueTime: '',
                ddayMode: editTarget.ddayMode,
                priority: editTarget.priority,
                recurrence: rec,
                isLunar: !!editTarget.isLunar,
                reminders: [...editTarget.reminders],
                isHoliday: !!editTarget.isHoliday,
                holidayHasTask: !!editTarget.holidayHasTask,
                deletedDates: [],
                createdAt: iso(),
                updatedAt: iso()
              };
              next.recurrings = next.recurrings || [];
              next.recurrings.push(rule);
            } else {
              rule.title = editTarget.title;
              rule.memo = editTarget.memo;
              rule.tags = [...editTarget.tags];
              rule.startDate = editTarget.startDate;
              rule.dueDate = editTarget.startDate;
              rule.ddayMode = editTarget.ddayMode;
              rule.priority = editTarget.priority;
              rule.recurrence = rec;
              rule.isLunar = !!editTarget.isLunar;
              rule.reminders = [...editTarget.reminders];
              rule.isHoliday = !!editTarget.isHoliday;
              rule.holidayHasTask = !!editTarget.holidayHasTask;
              rule.updatedAt = iso();
            }

            editTarget.recurringId = rule.id;
            editTarget.recurrenceType = rec;
            editTarget.recurrence = 'none';

            if (editing) {
              const idx = next.tasks.findIndex(t => t.id === editTarget.id);
              if (idx > -1) next.tasks[idx] = editTarget;
            } else {
              next.tasks.push(editTarget);
            }
          } else {
            // 반복 취소/해제 또는 일반 일정
            editTarget.recurrence = 'none';
            editTarget.recurrenceType = null;
            if (editTarget.recurringId) {
              const rule = (next.recurrings || []).find(r => r.id === editTarget.recurringId);
              if (rule) {
                rule.deletedDates = rule.deletedDates || [];
                const instDate = editTarget.startDate || editTarget.dueDate;
                if (!rule.deletedDates.includes(instDate)) {
                  rule.deletedDates.push(instDate);
                }
              }
              editTarget.recurringId = null;
            }
            if (editing) {
              const idx = next.tasks.findIndex(t => t.id === editTarget.id);
              if (idx > -1) next.tasks[idx] = editTarget;
            } else {
              next.tasks.push(editTarget);
            }
          }

          if (commit(next)) {
            $('editor').close();
            safeHistoryBack('editor');
            const targetDateStr = editTarget.startDate || editTarget.dueDate;
            if (targetDateStr) {
              ui.selected = targetDateStr;
              const d = parseDate(targetDateStr);
              if (d && !isNaN(d.getTime())) {
                ui.year = d.getFullYear();
                ui.month = d.getMonth();
              }
            }
            if (ui.view === 'list') ui.listSelectedTask = editTarget.id;
            render();
            toast('저장되었습니다.');
          }
        }

        // 저장 버튼 및 Form 제출 바인딩
        window.__doSaveTask = doSaveTask;
        const saveBtn = $('modalSaveTaskBtn');
        if (saveBtn) {
          saveBtn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            doSaveTask();
          };
        }

        $('taskForm').onsubmit = (e) => {
          e.preventDefault();
          doSaveTask();
        };

        // [V1.5.3] 탭 이동 체인(시간 -> 제목 -> 장소 -> 내용 -> 태그) 및 Enter/Shift+Enter 키보드 제어
        $('modalLocation')?.addEventListener('keydown', (e) => {
          if (e.key === 'Tab' && !e.shiftKey) {
            e.preventDefault();
            e.stopPropagation();
            $('modalMemo')?.focus();
          }
        });
        $('modalTags')?.addEventListener('keydown', (e) => {
          if (e.key === 'Tab' && e.shiftKey) {
            e.preventDefault();
            e.stopPropagation();
            $('modalMemo')?.focus();
          }
        });

        // [V1.5.3] Enter 키 즉시 저장 처리
        // - "내용"란에서는 Enter = 줄바꿈, Shift+Enter = 바로 저장
        // - "내용"란을 제외한 모든 입력란에서는 Enter = 바로 저장
        $('taskForm').addEventListener('keydown', (e) => {
          if (e.isComposing) return;
          const inMemo = e.target && e.target.closest && e.target.closest('#modalMemo');
          if (inMemo) {
            if (e.key === 'Enter' && e.shiftKey) {
              e.preventDefault();
              e.stopPropagation();
              doSaveTask();
            }
            return;
          }
          if (e.key === 'Enter' && !e.shiftKey) {
            const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
            if (tag !== 'BUTTON') {
              e.preventDefault();
              e.stopPropagation();
              doSaveTask();
            }
          }
        });

        // [V1.3.9] 위지윅 내용 입력창 초기화 및 자동 높이 확장
        const memoEl = $('modalMemo');
        if (memoEl) {
          memoEl.innerHTML = parseMemoForEditor(editTarget.memo || '');
          lastActiveTextarea = memoEl;
          memoEl.onfocus = () => { lastActiveTextarea = memoEl; };
          const autoExpand = () => {
            memoEl.style.height = 'auto';
            memoEl.style.height = Math.max(48, memoEl.scrollHeight + 2) + 'px';
          };
          memoEl.addEventListener('input', autoExpand);
        }

        // [V1.1.0] 내용 하단 라인 전체 리사이즈 핸들 연결
        setupTextareaDragResizer($('memoResizeHandle'), memoEl);

        // [V1.3.8 / V1.3.9] 위지윅 마크다운 툴바 초기화
        setupMemoMarkdownToolbar('', memoEl);

        // [V1.5.4] 모달 헤더 인쇄 버튼 바인딩 (단일 통합 printDetailReport 호출)
        const printBtn = $('modalPrintMemoBtn');
        if (printBtn) {
          printBtn.onclick = (e) => {
            e.preventDefault();
            printDetailReport({
              title: ($('modalTitle')?.value || '').trim() || editTarget.title || '일정 보고서',
              time: ($('modalTime')?.value || '').trim(),
              location: ($('modalLocation')?.value || '').trim(),
              startDate: $('modalStartDate')?.value || editTarget.startDate || today(),
              dueDate: $('modalDueDate')?.value || editTarget.dueDate || today(),
              tags: ($('modalTags')?.value || '').split(',').map(s => s.trim()).filter(Boolean),
              memoHtml: ($('modalMemo')?.innerHTML || '').trim()
            });
          };
        }

        // [V1.1.0] 기간리셋 버튼 바인딩
        const resetBtn = $('modalResetPeriodBtn');
        if (resetBtn) {
          resetBtn.onclick = () => {
            const td = today();
            $('modalStartDate').value = td;

        // [V1.7.0] 스마트 화살표 입력란 네비게이션 (시간 ↔ 제목 ↔ 장소 → 내용)
        const timeInput = $('modalTime');
        // titleInput already declared
        // $('modalTitle');
        const locInput = $('modalLocation');
        const memoArea = $('modalMemo');

        const moveCursorToEnd = (el) => {
          if (!el) return;
          el.focus();
          const len = (el.value || '').length;
          try { el.setSelectionRange(len, len); } catch(e) {}
        };
        const moveCursorToStart = (el) => {
          if (!el) return;
          el.focus();
          try { el.setSelectionRange(0, 0); } catch(e) {}
        };
        const focusToMemo = (el) => {
          if (!el) return;
          el.focus();
          try {
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(el);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
          } catch(e) {}
        };

        if (timeInput) {
          timeInput.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
              const isAtEnd = timeInput.selectionStart === (timeInput.value || '').length && timeInput.selectionEnd === (timeInput.value || '').length;
              if (isAtEnd || !timeInput.value) {
                e.preventDefault();
                moveCursorToStart(titleInput);
              }
            } else if (e.key === 'ArrowDown') {
              e.preventDefault();
              focusToMemo(memoArea);
            }
          });
        }

              if (isAtStart || !titleInput.value) {

                moveCursorToEnd(timeInput);

            } else if (e.key === 'ArrowRight') {

              focusToMemo(memoArea);

            } else if (e.key === 'ArrowDown') {

              focusToMemo(memoArea);
            }

        const timeEl = $('modalTime');
          if (timeEl && !timeEl.disabled) {

       *  1. 당일 일정 아침 브리핑 모달 (openDailyBriefingModal)
       *  2. 개별 일정 시간 임박 알림 모달 (openUrgentAlertModal)
       *  3. D-Day 사전 예고 알림 모달 (openDdayAlertModal)
       *  4. Web Audio 맑은 2음 차임벨 (playChimeSound)
       *  5. C# 데스크톱 창 깨우기 (wakeUpDesktopWindow)
       * ===================================================================== */

      function playChimeSound() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const now = ctx.currentTime;

          // 1음 (A5 880Hz, 맑은 어택)
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(880, now);
          gain1.gain.setValueAtTime(0.25, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.45);

          // 2음 (E6 1318.5Hz, 은은한 딩-동 울림)
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(1318.51, now + 0.16);
          gain2.gain.setValueAtTime(0.28, now + 0.16);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.16);
          osc2.stop(now + 0.85);
        } catch (e) {}
      }

        } catch (e) {}
      }

  },
  {
    "text": "시간이란 내가 그 안에서 낚시질을 하는 개울물에 불과하다.",
    "author": "헨리 데이비드 소로"
  },
  {
    "text": "우리가 진정으로 두려워해야 할 것은 실패가 아니라, 가치 없는 것에 성공하는 일이다.",
    "author": "헨리 데이비드 소로"
  },
  {
    "text": "부유함이란 사람이 버려도 아쉽지 않은 것들의 수에 비례한다.",
    "author": "헨리 데이비드 소로"
  },
  {
    "text": "마음의 눈을 뜨면, 사소한 모든 일상이 경이로운 기적으로 다가온다.",
    "author": "헨리 데이비드 소로"
  },
  {
    "text": "자연의 숲속에 머물 때, 비로소 나는 진정한 나 자신과 마주한다.",
    "author": "헨리 데이비드 소로"
  },
  {
    "text": "오늘 하루를 신중하고 깊이 있게 살아가라. 그것이 인생에 대한 가장 큰 예의다.",
    "author": "헨리 데이비드 소로"
  },
  {
    "text": "아무리 짙은 어둠이라도 결코 작은 촛불 하나를 이길 수는 없다.",
    "author": "성 프란치스코"
  },
  {
    "text": "바람이 불지 않을 때 바람개비를 돌리는 유일한 방법은 내가 앞으로 달려가는 것이다.",
    "author": "데일 카네기"
  },
  {
    "text": "길이 끝나는 곳에서도 길이 되는 사람이 있고, 스스로 봄길이 되어 끝없이 걸어가는 사람이 있다.",
    "author": "정호승"
  },
  {
    "text": "흔들리지 않고 피는 꽃이 어디 있으랴. 이 세상 그 어떤 아름다운 꽃들도 다 흔들리며 피었나니.",
    "author": "도종환"
  },
  {
    "text": "내려갈 때 보았네, 올라갈 때 보지 못한 그 꽃.",
    "author": "고은"
  },
  {
    "text": "자세히 보아야 예쁘다. 오래 보아야 사랑스럽다. 너도 그렇다.",
    "author": "나태주"
  },
  {
    "text": "겨울이 오면 봄 또한 멀지 않으리.",
    "author": "셸리"
  },
  {
    "text": "행복한 삶을 살고 싶다면 사람이나 사물이 아닌 목표에 집중하라.",
    "author": "알버트 아인슈타인"
  },
  {
    "text": "인생은 속도가 아니라 방향이다.",
    "author": "괴테"
  },
  {
    "text": "실패는 성공으로 가는 길목에 놓인 디딤돌에 불과하다.",
    "author": "토머스 에디슨"
  },
  {
    "text": "가장 어두운 밤도 언젠가는 끝나고 해는 다시 떠오른다.",
    "author": "빅토르 위고"
  },
  {
    "text": "희망이란 본래 있다고도 할 수 없고 없다고도 할 수 없다. 그것은 땅 위의 길과 같다.",
    "author": "루쉰"
  },
  {
    "text": "당신이 할 수 있다고 믿든 할 수 없다고 믿든, 믿는 대로 될 것이다.",
    "author": "헨리 포드"
  },
  {
    "text": "시작이 반이다.",
    "author": "아리스토텔레스"
  },
  {
    "text": "지혜로운 사람은 당황하지 않고, 어진 사람은 근심하지 않으며, 용기 있는 사람은 두려워하지 않는다.",
    "author": "공자"
  },
  {
    "text": "천 리 길도 한 걸음부터 시작된다.",
    "author": "노자"
  },
  {
    "text": "물처럼 유연하게 흘러라. 가장 부드러운 것이 가장 단단한 바위를 뚫는다.",
    "author": "노자"
  },
  {
    "text": "나를 죽이지 못하는 고통은 나를 더욱 강하게 만든다.",
    "author": "프리드리히 니체"
  },
  {
    "text": "살아야 할 이유가 있는 사람은 어떠한 어려움도 견뎌낼 수 있다.",
    "author": "프리드리히 니체"
  },
  {
    "text": "가장 용감한 행동은 스스로 생각하고 그것을 소리 내어 말하는 것이다.",
    "author": "코코 샤넬"
  },
  {
    "text": "끝없이 비관하는 사람은 기회 속에서도 위기를 보고, 낙관하는 사람은 위기 속에서도 기회를 본다.",
    "author": "윈스턴 처칠"
  },
  {
    "text": "지옥을 지나고 있다면 멈추지 말고 계속 걸어가라.",
    "author": "윈스턴 처칠"
  },
  {
    "text": "오늘 걷지 않으면 내일은 뛰어야 한다.",
    "author": "카를레스 푸욜"
  },
  {
    "text": "미래를 예측하는 가장 좋은 방법은 스스로 미래를 만들어내는 것이다.",
    "author": "피터 드러커"
  },
  {
    "text": "우리가 두려워해야 할 유일한 것은 두려움 그 자체다.",
    "author": "프랭클린 루스벨트"
  },
  {
    "text": "남의 시선에 얽매여 자신의 삶을 낭비하지 마라.",
    "author": "스티브 잡스"
  },
  {
    "text": "늘 갈망하고, 우직하게 나아가라. (Stay hungry, stay foolish)",
    "author": "스티브 잡스"
  },
  {
    "text": "작은 일에 충실한 것이 위대한 성취를 이루는 바탕이다.",
    "author": "마더 테레사"
  },
  {
    "text": "우리가 할 수 있는 가장 아름다운 일은 서로를 돕고 보듬는 것이다.",
    "author": "마더 테레사"
  },
  {
    "text": "어제의 나와 경쟁하라. 어제보다 조금이라도 나아졌다면 당신은 성장한 것이다.",
    "author": "조던 피터슨"
  },
  {
    "text": "마음이 모든 것이다. 당신이 생각하는 대로 당신은 그렇게 된다.",
    "author": "석가모니"
  },
  {
    "text": "과거에 얽매이지 말고, 미래를 두려워하지 마라. 오직 현재에 집중하라.",
    "author": "석가모니"
  },
  {
    "text": "비우면 비울수록 마음은 더욱 풍요로워진다.",
    "author": "법정 스님"
  },
  {
    "text": "침묵 속에서 영혼은 가장 맑은 노래를 부른다.",
    "author": "법정 스님"
  },
  {
    "text": "인연을 소중히 여겨라. 스치는 옷깃 하나에도 수많은 시간이 깃들어 있다.",
    "author": "법정 스님"
  },
  {
    "text": "모든 것은 지나간다. 이 또한 지나가리라.",
    "author": "솔로몬"
  },
  {
    "text": "내일 지구의 종말이 올지라도 나는 오늘 한 그루의 사과나무를 심겠다.",
    "author": "스피노자"
  },
  {
    "text": "행복의 문 하나가 닫히면 다른 문이 열린다. 그러나 우리는 닫힌 문만 바라보느라 열린 문을 보지 못한다.",
    "author": "헬렌 켈러"
  },
  {
    "text": "세상은 고통으로 가득하지만, 그것을 극복하는 일로도 가득 차 있다.",
    "author": "헬렌 켈러"
  },
  {
    "text": "최선을 다했다면 결과에 연연하지 마라. 최선을 다한 과정 자체가 이미 당신의 승리다.",
    "author": "이순신"
  },
  {
    "text": "나의 죽음을 적에게 알리지 마라. 담대하고 의연하게 나아가라.",
    "author": "이순신"
  },
  {
    "text": "백성을 사랑하는 마음이 모든 정치의 시작이다.",
    "author": "세종대왕"
  },
  {
    "text": "배움이란 바다와 같아서 끝이 없다. 겸손하게 배우는 자가 크게 이룬다.",
    "author": "율곡 이이"
  },
  {
    "text": "마음을 다스리는 자가 천하를 다스린다.",
    "author": "퇴계 이황"
  },
  {
    "text": "행동 없는 비전은 백일몽이고, 비전 없는 행동은 악몽이다.",
    "author": "일본 속담"
  },
  {
    "text": "인생에서 가장 큰 영광은 넘어지지 않는 것이 아니라, 넘어질 때마다 다시 일어서는 데 있다.",
    "author": "넬슨 만델라"
  },
  {
    "text": "용기란 두려움이 없는 것이 아니라, 두려움보다 더 중요한 무언가가 있음을 아는 것이다.",
    "author": "넬슨 만델라"
  },
  {
    "text": "교육은 세상을 바꿀 수 있는 가장 강력한 무기다.",
    "author": "넬슨 만델라"
  },
  {
    "text": "당신이 세상에서 보고 싶은 변화가 바로 당신 자신이 되어야 한다.",
    "author": "마하트마 간디"
  },
  {
    "text": "내일 죽을 것처럼 살고, 영원히 살 것처럼 배워라.",
    "author": "마하트마 간디"
  },
  {
    "text": "분노를 품고 있는 것은 다른 사람에게 던지려고 뜨거운 숯을 손에 쥐고 있는 것과 같다.",
    "author": "석가모니"
  },
  {
    "text": "평화는 미소에서 시작된다.",
    "author": "마더 테레사"
  },
  {
    "text": "누군가를 용서하는 것은 그 사람을 위해서가 아니라, 내 영혼의 자유를 위해서다.",
    "author": "데스몬드 투투"
  },
  {
    "text": "가장 현명한 사람은 자신이 아무것도 모른다는 것을 아는 사람이다.",
    "author": "소크라테스"
  },
  {
    "text": "너 자신을 알라.",
    "author": "소크라테스"
  },
  {
    "text": "모든 인간은 배움을 갈망한다.",
    "author": "아리스토텔레스"
  },
  {
    "text": "탁월함은 행동이 아니라 습관이다.",
    "author": "아리스토텔레스"
  },
  {
    "text": "친구란 두 몸에 깃든 하나의 영혼이다.",
    "author": "아리스토텔레스"
  },
  {
    "text": "기쁨을 나누면 두 배가 되고, 슬픔을 나누면 반이 된다.",
    "author": "스웨덴 속담"
  },
  {
    "text": "고난은 사람을 성숙하게 만드는 훌륭한 스승이다.",
    "author": "발자크"
  },
  {
    "text": "인생은 자전거를 타는 것과 같다. 균형을 잡으려면 계속 움직여야 한다.",
    "author": "알버트 아인슈타인"
  },
  {
    "text": "상상력은 지식보다 중요하다. 지식은 한계가 있지만 상상력은 온 세상을 감싼다.",
    "author": "알버트 아인슈타인"
  },
  {
    "text": "단순함이 궁극의 정교함이다.",
    "author": "레오나르도 다빈치"
  },
  {
    "text": "아는 것만으로는 부족하다. 적용해야 한다. 의지만으로는 부족하다. 실천해야 한다.",
    "author": "괴테"
  },
  {
    "text": "고난의 시기야말로 인격을 시험하는 진정한 무대다.",
    "author": "존 록"
  },
  {
    "text": "자유는 책임을 동반한다. 그래서 많은 이들이 자유를 두려워한다.",
    "author": "조지 버나드 쇼"
  },
  {
    "text": "젊음은 젊은이에게 주기에는 너무 아깝다.",
    "author": "조지 버나드 쇼"
  },
  {
    "text": "인생은 자기 자신을 찾는 것이 아니라, 자기 자신을 창조하는 과정이다.",
    "author": "조지 버나드 쇼"
  },
  {
    "text": "웃음은 두 사람 사이의 가장 가까운 거리다.",
    "author": "빅토르 보르게"
  },
  {
    "text": "감사하는 마음은 모든 덕목의 어머니이자 가장 위대한 덕목이다.",
    "author": "키케로"
  },
  {
    "text": "삶이 있는 한 희망은 있다.",
    "author": "키케로"
  },
  {
    "text": "어제의 비는 오늘의 옷을 적실 수 없다.",
    "author": "한국 격언"
  },
  {
    "text": "말 한마디로 천 냥 빚을 갚는다.",
    "author": "한국 속담"
  },
  {
    "text": "깊은 강물은 소리 없이 흐른다.",
    "author": "셰익스피어"
  },
  {
    "text": "우리가 무엇인지 알지만, 우리가 무엇이 될 수 있는지는 모른다.",
    "author": "셰익스피어"
  },
  {
    "text": "겁쟁이는 죽기 전에 수없이 죽지만, 용감한 자는 오직 한 번 죽을 뿐이다.",
    "author": "셰익스피어"
  },
  {
    "text": "생각이 마음을 지옥으로 만들 수도, 천국으로 만들 수도 있다.",
    "author": "존 밀턴"
  },
  {
    "text": "작은 구멍 하나가 큰 배를 가라앉힐 수 있다.",
    "author": "벤자민 프랭클린"
  },
  {
    "text": "시간을 낭비하지 마라. 항상 유용한 무언가를 하라.",
    "author": "벤자민 프랭클린"
  },
  {
    "text": "오늘 할 수 있는 일을 내일로 미루지 마라.",
    "author": "벤자민 프랭클린"
  },
  {
    "text": "준비에 실패하는 것은 실패를 준비하는 것이다.",
    "author": "벤자민 프랭클린"
  },
  {
    "text": "경험은 엄격한 스승이다. 시험을 먼저 치르고 교훈을 나중에 주기 때문이다.",
    "author": "버넌 로"
  },
  {
    "text": "실패는 다시 시작할 수 있는 기회다. 이번에는 더 현명하게.",
    "author": "헨리 포드"
  },
  {
    "text": "장애물이란 목표에서 눈을 돌렸을 때 나타나는 무서운 것들이다.",
    "author": "헨리 포드"
  },
  {
    "text": "당신이 세상을 바꿀 수 없다고 말하는 사람은 두 종류다. 시도하기를 두려워하는 사람과 당신의 성공을 두려워하는 사람.",
    "author": "레이 고포스"
  },
  {
    "text": "성공이란 열정을 잃지 않고 실패에서 실패로 걸어가는 능력이다.",
    "author": "윈스턴 처칠"
  },
  {
    "text": "포기하지 않는 자를 이길 수 있는 사람은 아무도 없다.",
    "author": "베이브 루스"
  },
  {
    "text": "모든 삼진은 다음 홈런에 한 걸음 더 다가가는 것이다.",
    "author": "베이브 루스"
  },
  {
    "text": "스스로를 한계 짓지 마라. 마음이 도달할 수 있는 곳이라면 어디든 갈 수 있다.",
    "author": "메리 케이 애시"
  },
  {
    "text": "비난은 아무런 영양가가 없다. 칭찬 한마디가 영혼을 살찌운다.",
    "author": "마크 트웨인"
  },
  {
    "text": "지금으로부터 20년 뒤, 당신은 한 일보다 하지 않은 일 때문에 더 후회할 것이다.",
    "author": "마크 트웨인"
  },
  {
    "text": "닻줄을 풀고 안전한 항구를 떠나라. 무역풍을 타고 항해하며 탐험하고, 꿈꾸고, 발견하라.",
    "author": "마크 트웨인"
  },
  {

      /* =====================================================================
       * [V1.0.1] 다중 일정표 전체 통합 데이터 수집 헬퍼 (초경량 순회)
       * - 현재 활성화된 data 객체(메모리) 우선 조회
       * - 다른 비활성화된 일정표들은 로컬 저장소에서 안전하게 읽어와 tasks/recurrings 합산
       * - 브리핑, D-Day 사전 예고, 임박 알림 등에 다중 일정표 전체 일정 지원
       * ===================================================================== */
      function getAllStoresTasks() {
        const activeId = (typeof getActiveStoreId === 'function') ? getActiveStoreId() : 'default';
        const allTasks = [];
        const allRecurrings = [];
        const seenTaskIds = new Set();
        const seenRecIds = new Set();

        // 1. 현재 활성 스토어는 메모리의 최신 data 객체 우선 수집
        if (typeof data !== 'undefined' && data) {
          if (Array.isArray(data.tasks)) {
            data.tasks.forEach(t => {
              if (t && t.id && !seenTaskIds.has(String(t.id))) {
                seenTaskIds.add(String(t.id));
                allTasks.push(t);
              }
            });
          }
          if (Array.isArray(data.recurrings)) {
            data.recurrings.forEach(r => {
              if (r && r.id && !seenRecIds.has(String(r.id))) {
                seenRecIds.add(String(r.id));
                allRecurrings.push(r);
              }
            });
          }
        }

        // 2. 다른 비활성 스토어들은 로컬 저장소에서 안전하게 조회
        try {
          const list = (typeof getStoreList === 'function') ? getStoreList() : [];
          list.forEach(store => {
            if (String(store.id) === String(activeId)) return;
            try {
              const key = (typeof getStoreKey === 'function') ? getStoreKey(store.id) : `todoCalendar.work.v1_${store.id}`;
              const raw = storageGet(key);
              if (raw) {
                const storeData = (typeof normalize === 'function') ? normalize(JSON.parse(raw)) : JSON.parse(raw);
                if (storeData && Array.isArray(storeData.tasks)) {
                  storeData.tasks.forEach(t => {
                    if (t && t.id && !seenTaskIds.has(String(t.id))) {
                      seenTaskIds.add(String(t.id));
                      allTasks.push(t);
                    }
                  });
                }
                if (storeData && Array.isArray(storeData.recurrings)) {
                  storeData.recurrings.forEach(r => {
                    if (r && r.id && !seenRecIds.has(String(r.id))) {
                      seenRecIds.add(String(r.id));
                      allRecurrings.push(r);
                    }
                  });
                }
              }
            } catch (e) {}
          });
        } catch (e) {}

        return { tasks: allTasks, recurrings: allRecurrings };
      }

      function getTodayScheduleItems() {
        const todayStr = today();
        const items = [];
        const { tasks: allTasks, recurrings: allRecurrings } = getAllStoresTasks();

        (allTasks || []).forEach(t => {
          if (t.completed) return;
          const s = t.startDate || t.dueDate;
          const e = t.dueDate || t.startDate;
          if (s <= todayStr && e >= todayStr) {
            items.push(t);
          }
        });

        (allRecurrings || []).forEach(r => {
          const dates = getDatesForRule(r, todayStr, todayStr);
          if (dates.includes(todayStr)) {
            const hasTask = (allTasks || []).some(t => t.recurringId === r.id && (t.startDate === todayStr || t.dueDate === todayStr));
            if (!hasTask) {
              items.push({
                id: r.id,
                title: r.title,
                time: r.time || '',
                location: r.location || '',
                memo: r.memo || '',
                tags: r.tags || [],
                startDate: todayStr,
                dueDate: todayStr,
                priority: r.priority || 'normal',
                hourReminders: Array.isArray(r.hourReminders) ? r.hourReminders : [120, 60],
                isHoliday: !!r.isHoliday,
                holidayHasTask: !!r.holidayHasTask,
                isRecurring: true
              });
            }
          }
        });

        items.sort((a, b) => {
          if (a.time && b.time) return a.time.localeCompare(b.time);
          if (a.time && !b.time) return -1;
          if (!a.time && b.time) return 1;
          return a.title.localeCompare(b.title);
        });

        return items;
      }

      
      /* =====================================================================
       * [V2.1.8] 대한민국 기상청(KMA) 공식 API & 순수 로컬 격자 변환(LCC) 연동
       * - 해외 서버(BigDataCloud, Open-Meteo) 0건 완전 제거 유지
       * - 순수 로컬 수학 공식(기상청 표준 LCC 투영)으로 외부 통신 없이 위경도 -> (nx, ny) 변환
       * - 이동 중(모바일/노트북) 현재 위치 기반 기상청 날씨 실시간 연동
       * - 기상청 버튼 클릭 시 해당 위치의 기상청 공식 예보 페이지로 직접 연결
       * ===================================================================== */
      const KMA_CONFIG = {
        defaultName: '밀양시청',
        defaultNx: 92,
        defaultNy: 83,
        defaultLat: 35.503828,
        defaultLon: 128.746608,
        defaultUrl: 'https://www.weather.go.kr/w/index.do#dong/4827055000/35.503828/128.746608/%EA%B2%BD%EC%83%81%EB%82%A8%EB%8F%84%20%EB%B0%80%EC%96%91%EC%8B%9C%20%EA%B5%90%EB%8F%99/SEL/%EB%B0%80%EC%96%91%EC%8B%9C%EC%B2%AD'
      };

      const currentKmaState = {
        lat: KMA_CONFIG.defaultLat,
        lon: KMA_CONFIG.defaultLon,
        nx: KMA_CONFIG.defaultNx,
        ny: KMA_CONFIG.defaultNy,
        isGeo: false,
        locName: KMA_CONFIG.defaultName
      };

      // 기상청 표준 위경도 -> 격자(nx, ny) 변환 함수 (순수 로컬 수학 연산, 외부 통신 0)
      function dfs_xy_conv(lat, lon) {
        const RE = 6371.00877;
        const GRID = 5.0;
        const SLAT1 = 30.0;
        const SLAT2 = 60.0;
        const OLON = 126.0;
        const OLAT = 38.0;
        const XO = 43;
        const YO = 136;

        const DEGRAD = Math.PI / 180.0;
        const re = RE / GRID;
        const slat1 = SLAT1 * DEGRAD;
        const slat2 = SLAT2 * DEGRAD;
        const olon = OLON * DEGRAD;
        const olat = OLAT * DEGRAD;

        let sn = Math.tan(Math.PI * 0.25 + slat2 * 0.5) / Math.tan(Math.PI * 0.25 + slat1 * 0.5);
        sn = Math.log(Math.cos(slat1) / Math.cos(slat2)) / Math.log(sn);
        let sf = Math.tan(Math.PI * 0.25 + slat1 * 0.5);
        sf = Math.pow(sf, sn) * Math.cos(slat1) / sn;
        let ro = Math.tan(Math.PI * 0.25 + olat * 0.5);
        ro = re * sf / Math.pow(ro, sn);

        let ra = Math.tan(Math.PI * 0.25 + lat * DEGRAD * 0.5);
        ra = re * sf / Math.pow(ra, sn);
        let theta = lon * DEGRAD - olon;
        if (theta > Math.PI) theta -= 2.0 * Math.PI;
        if (theta < -Math.PI) theta += 2.0 * Math.PI;
        theta *= sn;

        const nx = Math.floor(ra * Math.sin(theta) + XO + 0.5);
        const ny = Math.floor(ro - ra * Math.cos(theta) + YO + 0.5);
        return { nx, ny };
      }

      function requestKmaWeatherQuery(nx, ny, locName) {
        const targetNx = nx || currentKmaState.nx;
        const targetNy = ny || currentKmaState.ny;
        const targetName = locName || currentKmaState.locName;

        // 데스크톱 앱(WebView2) 환경: C# 백엔드에 안전 요청
        if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === 'function') {
          try {
            window.chrome.webview.postMessage(JSON.stringify({
              type: 'requestKmaWeather',
              nx: targetNx,
              ny: targetNy,
              locName: targetName
            }));
            return;
          } catch(e) {}
        }

        // 브라우저 및 PWA 환경: 기상청 API 직접 호출
        try {
          const now = new Date();
          let baseDate = now;
          if (now.getMinutes() < 45) {
            baseDate = new Date(now.getTime() - 60 * 60 * 1000);
          }
          const y = baseDate.getFullYear();
          const m = String(baseDate.getMonth() + 1).padStart(2, '0');
          const d = String(baseDate.getDate()).padStart(2, '0');
          const hh = String(baseDate.getHours()).padStart(2, '0');
          const dateStr = `${y}${m}${d}`;
          const timeStr = `${hh}30`;

          const serviceKey = 'c728739b1ccef50f344581789f3e12513f4af17db97276f8dbf9fb9ccb204bd3';
          const apiUrl = `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtFcst?serviceKey=${serviceKey}&numOfRows=60&pageNo=1&dataType=JSON&base_date=${dateStr}&base_time=${timeStr}&nx=${targetNx}&ny=${targetNy}`;

          const ctrl = new AbortController();
          const tId = setTimeout(() => ctrl.abort(), 4000);
          fetch(apiUrl, { signal: ctrl.signal })
            .then(res => {
              clearTimeout(tId);
              if (!res.ok) throw new Error('Network error');
              return res.json();
            })
            .then(data => {
              if (data && data.response && data.response.body && data.response.body.items && data.response.body.items.item) {
                const items = data.response.body.items.item;
                let minTarget = null;
                for (const it of items) {
                  const target = it.fcstDate + it.fcstTime;
                  if (!minTarget || target < minTarget) minTarget = target;
                }
                let t1h = '', sky = '1', pty = '0';
                for (const it of items) {
                  if ((it.fcstDate + it.fcstTime) === minTarget) {
                    if (it.category === 'T1H') t1h = it.fcstValue;
                    if (it.category === 'SKY') sky = it.fcstValue;
                    if (it.category === 'PTY') pty = it.fcstValue;
                  }
                }
                let icon = '☀️';
                let text = '맑음';
                const ptyNum = parseInt(pty, 10);
                const skyNum = parseInt(sky, 10);
                if (ptyNum === 1 || ptyNum === 5) { icon = '🌧️'; text = '비'; }
                else if (ptyNum === 2 || ptyNum === 6) { icon = '🌨️'; text = '비/눈'; }
                else if (ptyNum === 3 || ptyNum === 7) { icon = '❄️'; text = '눈'; }
                else {
                  if (skyNum === 3) { icon = '⛅'; text = '구름많음'; }
                  else if (skyNum === 4) { icon = '☁️'; text = '흐림'; }
                  else { icon = '☀️'; text = '맑음'; }
                }
                const tempStr = t1h ? `${Math.round(parseFloat(t1h))}°C` : '';
                window._applyKmaWeather(icon, text, tempStr, targetName);
              }
            })
            .catch(() => {
              const cachedStr = localStorage.getItem('briefing_weather_cache');
              if (!cachedStr) setWeatherOfflineUI(targetName);
            });
        } catch(e) {
          const cachedStr = localStorage.getItem('briefing_weather_cache');
          if (!cachedStr) setWeatherOfflineUI(targetName);
        }
      }

      function fetchBriefingWeather() {
        // 1. 로컬 캐시 확인 (30분 유효)
        let hasValidCache = false;
        try {
          const cachedStr = localStorage.getItem('briefing_weather_cache');
          if (cachedStr) {
            const cachedObj = JSON.parse(cachedStr);
            if (cachedObj && (Date.now() - cachedObj.ts < 1800000)) {
              if (cachedObj.isGeo && cachedObj.lat && cachedObj.lon) {
                currentKmaState.lat = cachedObj.lat;
                currentKmaState.lon = cachedObj.lon;
                currentKmaState.nx = cachedObj.nx || currentKmaState.nx;
                currentKmaState.ny = cachedObj.ny || currentKmaState.ny;
                currentKmaState.isGeo = true;
                currentKmaState.locName = cachedObj.locName || '현재 위치';
              }
              updateWeatherUI(cachedObj.icon || '☀️', cachedObj.text || '맑음', cachedObj.temp || '', currentKmaState.locName);
              hasValidCache = true;
            }
          }
        } catch(e) {}

        if (!hasValidCache) {
          setWeatherOfflineUI(currentKmaState.locName);
        }

        // 2. 먼저 디폴트(또는 직전 확인 좌표)로 기상청 즉시 조회
        requestKmaWeatherQuery(currentKmaState.nx, currentKmaState.ny, currentKmaState.locName);

                // 3. 브라우저/스마트폰/노트북 위치 확인 시도 (순수 로컬 수학 공식으로 nx, ny 변환 -> 기상청만 호출)
        if (typeof navigator !== 'undefined' && navigator.geolocation && typeof navigator.geolocation.getCurrentPosition === 'function') {
          try {
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                if (pos && pos.coords && typeof pos.coords.latitude === 'number' && typeof pos.coords.longitude === 'number') {
                  const gLat = Number(pos.coords.latitude.toFixed(6));
                  const gLon = Number(pos.coords.longitude.toFixed(6));
                  const grid = dfs_xy_conv(gLat, gLon);
                  currentKmaState.lat = gLat;
                  currentKmaState.lon = gLon;
                  currentKmaState.nx = grid.nx;
                  currentKmaState.ny = grid.ny;

                  // 밀양시청 부근(0.02도 이내)이면 '밀양시청', 그 외 타지역이면 '현재 위치'
                  const dLat = Math.abs(gLat - KMA_CONFIG.defaultLat);
                  const dLon = Math.abs(gLon - KMA_CONFIG.defaultLon);
                  const isNearMiryang = (dLat < 0.02 && dLon < 0.02);
                  currentKmaState.isGeo = !isNearMiryang;
                  currentKmaState.locName = isNearMiryang ? KMA_CONFIG.defaultName : '현재 위치';

                  // 변경된 지역 격자로 기상청 재조회 (해외 서버 0건!)
                  requestKmaWeatherQuery(currentKmaState.nx, currentKmaState.ny, currentKmaState.locName);
                }
              },
              () => {
                // 실패 또는 위치 거부 시 기본값(밀양시청) 유지
              },
              { enableHighAccuracy: false, timeout: 4500, maximumAge: 600000 }
            );
          } catch(e) {}
        }
      }

      /* =====================================================================
       * [V1.10.0] 데스크톱 위젯 모드 & 단독 최상단 알림 팝업 제어
       * ===================================================================== */

        const pct = Math.max(0, Math.min(100, isNaN(sliderVal) ? 100 : Math.round(sliderVal)));

          const rect = modal.getBoundingClientRect();
          modal.style.margin = '0';
          modal.style.left = rect.left + 'px';
          modal.style.top = rect.top + 'px';
          modal.style.position = 'fixed';

          const startX = e.clientX;
          const startY = e.clientY;
          const initLeft = rect.left;
          const initTop = rect.top;

          function onMouseMove(moveEv) {
            const dx = moveEv.clientX - startX;
            const dy = moveEv.clientY - startY;
            modal.style.left = (initLeft + dx) + 'px';
            modal.style.top = (initTop + dy) + 'px';

          function onMouseUp() {
            document.removeEventListener('mousemove', onMouseMove);

      const triggeredAlertsInSession = new Set();

      function collectUpcomingDdayAlerts(todayStr, allTasks, allRecurrings) {
        const ddayAlerts = [];
        const seenKeys = new Set();

        (allTasks || []).forEach(t => {
          if (!t || t.completed || !isWork(t)) return;
          const due = t.dueDate || t.startDate;
          if (!due || due <= todayStr) return;
          const workDiff = taskWorkdays(t, todayStr);
          const calDiff = daysBetween(todayStr, due);

          // 1) 화면 표기 기준(근무일/달력일 설정 반영) D-3 이내(D-3, D-2, D-1) 이거나
          // 2) 사용자가 알림 주기(reminders)에 체크한 사전 일수에 도달한 일정
          const isWithinDday3 = (workDiff >= 1 && workDiff <= 3);
          const isCustomReminderMatch = Array.isArray(t.reminders) && t.reminders.some(r =>
            r > 0 && (r === workDiff || r === calDiff || reminderDate(due, r) === todayStr)
          );

          if (isWithinDday3 || isCustomReminderMatch) {
            const key = String(t.id);
            if (!seenKeys.has(key)) {
              seenKeys.add(key);
              ddayAlerts.push({ task: t, daysLeft: workDiff > 0 ? workDiff : calDiff });
            }
          }
        });

        // 아직 개별 task로 생성되지 않은 반복 일정 마스터(recurrings) 중 D-3 이내 도래분도 포함
        const lookAheadEnd = addDays(todayStr, 14);
        (allRecurrings || []).forEach(r => {
          if (!r || !isWork(r)) return;
          const dates = getDatesForRule(r, addDays(todayStr, 1), lookAheadEnd);
          const deleted = new Set(r.deletedDates || []);
          const span = Math.max(0, dayDistance(r.startDate || r.dueDate, r.dueDate || r.startDate));
          dates.forEach(dStr => {
            if (deleted.has(dStr)) return;
            const targetDue = span > 0 ? addDays(dStr, span) : dStr;
            if (targetDue <= todayStr) return;
            const hasMaterialized = (allTasks || []).some(t => t.recurringId === r.id && (t.dueDate === targetDue || t.startDate === dStr));
            if (hasMaterialized) return;

            const virtualTask = {
              id: r.id,
              title: r.title,
              time: r.time || '',
              location: r.location || '',
              memo: r.memo || '',
              tags: r.tags || [],
              startDate: dStr,
              dueDate: targetDue,
              ddayMode: r.ddayMode || 'workday',
              priority: r.priority || 'normal',
              reminders: Array.isArray(r.reminders) ? r.reminders : [0, 3],
              isHoliday: !!r.isHoliday,
              holidayHasTask: !!r.holidayHasTask,
              isRecurring: true
            };
            const workDiff = taskWorkdays(virtualTask, todayStr);
            const calDiff = daysBetween(todayStr, targetDue);
            const isWithinDday3 = (workDiff >= 1 && workDiff <= 3);
            const isCustomReminderMatch = Array.isArray(virtualTask.reminders) && virtualTask.reminders.some(rem =>
              rem > 0 && (rem === workDiff || rem === calDiff || reminderDate(targetDue, rem) === todayStr)
            );
            if (isWithinDday3 || isCustomReminderMatch) {
              const key = `${r.id}_${targetDue}`;
              if (!seenKeys.has(key)) {
                seenKeys.add(key);
                ddayAlerts.push({ task: virtualTask, daysLeft: workDiff > 0 ? workDiff : calDiff });
              }
            }
          });
        });

        return ddayAlerts;
      }

      function checkSmartAlerts() {
        const now = new Date();
        const todayStr = today();
        const currentHours = now.getHours();
        const currentMinutes = now.getMinutes();
        const currentTimeMinutes = currentHours * 60 + currentMinutes;

        // [V1.0.1] 다중 일정표 전체 통합 일정 데이터 로드 (초경량 합산)
        const { tasks: allTasks, recurrings: allRecurrings } = (typeof getAllStoresTasks === 'function')
          ? getAllStoresTasks()
          : { tasks: (data && data.tasks) || [], recurrings: (data && data.recurrings) || [] };

        // 당일 전체 미완료 일정 (단일·기간·반복 일정 통합)
        const todayActiveItems = getTodayScheduleItems().filter(t => isWork(t));

        // [1] [V1.0.6] 업무 시간대 정기 일일브리핑 재표출 (하루 4회: 11:00, 13:00, 15:00, 17:00)
        // 컴퓨터 켜자마자 최초 1회 브리핑 이후, 당일 미완료 일정이 남아 있는 경우에만 4개 주요 시각에 재안내
        let didOpenBriefingNow = false;
        const briefingTargetHours = [11, 13, 15, 17];
        if (currentMinutes >= 0 && currentMinutes <= 5 && briefingTargetHours.includes(currentHours)) {
          const scheduledBriefingKey = `scheduledBriefingDone_${todayStr}_${currentHours}`;
          if (localStorage.getItem(scheduledBriefingKey) !== 'true') {
            localStorage.setItem(scheduledBriefingKey, 'true');
            if (todayActiveItems.length > 0) {
              openDailyBriefingModal(true);
              didOpenBriefingNow = true;
            }
          }
        }

        // [2] [V1.0.6] D-Day 3일 남은 일정 정기 팝업 (다중 일정표 전체 대상):
        // 조건: 1) 오전 9시 (09:00~11:59 중 당일 1회) 및 2) 오후 1시 (13:00~14:59 중 당일 1회)
        const is9amDdayCheck = (currentHours >= 9 && currentHours < 12 && localStorage.getItem('dday9amAlertDone_' + todayStr) !== 'true');
        const is1pmDdayCheck = (currentHours >= 13 && currentHours < 15 && localStorage.getItem('dday1pmAlertDone_' + todayStr) !== 'true');

        if (is9amDdayCheck || is1pmDdayCheck) {
          if (is9amDdayCheck) {
            localStorage.setItem('dday9amAlertDone_' + todayStr, 'true');
          }
          if (is1pmDdayCheck) {
            localStorage.setItem('dday1pmAlertDone_' + todayStr, 'true');
          }

          const ddayAlerts = collectUpcomingDdayAlerts(todayStr, allTasks, allRecurrings);
          if (ddayAlerts.length > 0) {
            if (didOpenBriefingNow) {
              // 13시 정각 등 일일브리핑과 동시에 뜰 때는 브리핑 창 오픈 직후 계단식(Cascade)으로 전면에 함께 표출
              setTimeout(() => {
                openDdayAlertModal(ddayAlerts);
              }, 550);
            } else {
              openDdayAlertModal(ddayAlerts);
            }
          }
        }

        // [3] [V1.0.6] 당일 일정 중 지정 시간 임박 알림 (사용자가 체크하거나 기록한 시간만 엄격 적용)
        const todayTimedTasks = todayActiveItems.filter(t => !!t.time);
        todayTimedTasks.forEach(t => {
          const timeParts = t.time.split(':');
          if (timeParts.length < 2) return;
          const tH = parseInt(timeParts[0], 10);
          const tM = parseInt(timeParts[1], 10);
          if (isNaN(tH) || isNaN(tM)) return;

          const targetTimeMinutes = tH * 60 + tM;
          const diffMin = targetTimeMinutes - currentTimeMinutes;

          if (diffMin < 0 || diffMin > 360) return;

          // 사용자가 등록/수정 시 체크하거나 기록한 알림 시간(분 단위 배열)만 엄격 적용
          // (체크를 모두 해제하여 빈 배열인 경우 임박 알림 0건)
          const hourRems = Array.isArray(t.hourReminders) ? t.hourReminders : (t.hourReminders === undefined ? [120, 60] : []);
          if (!hourRems || hourRems.length === 0) return;

          hourRems.forEach(m => {
            const key = `urgent_${t.id}_${m}_${todayStr}`;
            const snoozeUntil = snoozedAlerts[key] || 0;
            if (Date.now() < snoozeUntil) return;

            if (Math.abs(diffMin - m) <= 1 && !triggeredAlertsInSession.has(key)) {
              triggeredAlertsInSession.add(key);
              openUrgentAlertModal(t, m);
            }
          });
        });

        // [4] [V1.0.1] 인사랑 초과근무 팝업:
        // - 평일(월~금, 공휴일 제외): 18:00 ~ 익일 09:00
        // - 토요일, 일요일, 법정·대체공휴일, 일정 공휴일 체크일: 해당일 24시간 내내 (00:00 ~ 23:59)
        // 각 시간대별 20분~40분 사이 랜덤 1회 초과근무 팝업
        const isRestDay = isRestDayToday();
        const isOvertimeHours = isRestDay ? true : (currentHours >= 18 || currentHours < 9);

        if (isOvertimeHours) {
          const overtimeHourKey = `overtimeTargetMin_${todayStr}_${currentHours}`;
          let targetMin = localStorage.getItem(overtimeHourKey);
          if (!targetMin) {
            // 20 ~ 40분 사이 랜덤 결정
            targetMin = Math.floor(Math.random() * 21) + 20;
            localStorage.setItem(overtimeHourKey, String(targetMin));
          } else {
            targetMin = parseInt(targetMin, 10);
          }

          const overtimeAlertedKey = `overtimeAlertDone_${todayStr}_${currentHours}`;
          const alreadyAlerted = localStorage.getItem(overtimeAlertedKey) === 'true';

          if (!alreadyAlerted && currentMinutes >= targetMin) {
            localStorage.setItem(overtimeAlertedKey, 'true');
            openOvertimeAlertModal(isRestDay);
          }
        }
      }

      function processImportFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const content = e.target.result;
            const parsed = JSON.parse(content);
            executeImportMerge(parsed, file.name);
          } catch (err) {
            alert('유효한 .dday 또는 JSON 파일이 아닙니다.');
          }
        };
        reader.readAsText(file);
      }

      async function executeImportMerge(parsed, fileName = '') {
        const tasksToMerge = Array.isArray(parsed.tasks) ? parsed.tasks : (Array.isArray(parsed) ? parsed : []);
        if (!tasksToMerge.length) {
          return toast('가져올 일정이 파일에 존재하지 않습니다.');
        }

        const count = tasksToMerge.length;
        const confirmMsg = `
          <div style="font-weight:700; color:#1e293b; margin-bottom:8px; font-size:14px; word-break:break-all;">[${esc(fileName || '선택한 파일')}]에서</div>
          <div style="color:#475569; font-size:13.5px; line-height:1.5;">총 <b style="color:#4f46e5; font-size:15px;">${count}건</b>의 일정을 현재 일정표에 추가하시겠습니까?</div>
        `;

        const ok = await appConfirm({
          title: 'MY 일정관리',
          message: confirmMsg,
          confirmText: '추가',
          cancelText: '취소'
        });
        if (!ok) return;

        const next = clone(data);
        next.tasks = next.tasks || [];
        let addedCount = 0;

        tasksToMerge.forEach(incoming => {
          if (!incoming.title || !incoming.dueDate) return;
          const newTask = Object.assign(makeTask(incoming.dueDate), incoming);
          newTask.id = uid();
          next.tasks.push(newTask);
          addedCount++;
        });

        if (commit(next)) {
          if ($('settings') && $('settings').open) $('settings').close();
          
          // [V1.7.0] 추가된 일정의 날짜로 캘린더 및 선택일 자동 이동
          const firstTask = tasksToMerge.find(t => t.startDate || t.dueDate);
          const targetDate = firstTask ? (firstTask.startDate || firstTask.dueDate) : null;
          if (targetDate) {
            ui.selected = targetDate;
            const d = parseDate(targetDate);
            if (d && !isNaN(d.getTime())) {
              ui.year = d.getFullYear();
              ui.month = d.getMonth();
            }
          }
          render();
          toast(`${addedCount}건의 일정이 성공적으로 추가되었습니다.${targetDate ? ` (${targetDate}로 이동)` : ''}`);
        }
      }

      function setupDragAndDrop() {
        let dragCounter = 0;
        let overlay = $('dropOverlay');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'dropOverlay';
          overlay.style.position = 'fixed';
          overlay.style.inset = '0';
          overlay.style.background = 'transparent';
          overlay.style.backdropFilter = 'none';
          overlay.style.zIndex = '9999';
          overlay.style.display = 'none';
          overlay.style.alignItems = 'center';
          overlay.style.justifyContent = 'center';
          overlay.style.pointerEvents = 'none';
          overlay.innerHTML = `
            <div style="padding:16px 28px; background:#ffffff; border:2px dashed #6366f1; border-radius:12px; box-shadow:0 12px 32px rgba(15,23,42,0.12); display:flex; align-items:center; gap:10px; color:#1e293b; font-size:14px; font-weight:600;">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#6366f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span>.dday 일정 파일을 여기에 놓으시면 즉시 추가됩니다</span>
            </div>`;
          document.body.appendChild(overlay);
        }

        const isOsFileDrag = (e) => {
          if (window._isInternalDragging) return false;
          const dt = e.dataTransfer;
          if (!dt || !dt.types) return false;
          return Array.from(dt.types).includes('Files');
        };

        window.addEventListener('dragenter', (e) => {
          if (!isOsFileDrag(e)) return;
          e.preventDefault();
          dragCounter++;
          overlay.style.display = 'flex';
        });

        window.addEventListener('dragleave', (e) => {
          if (!isOsFileDrag(e)) return;
          e.preventDefault();
          dragCounter--;
          if (dragCounter <= 0) {
            dragCounter = 0;
            overlay.style.display = 'none';
          }
        });

        window.addEventListener('dragover', (e) => {
          if (!isOsFileDrag(e)) return;
          e.preventDefault();
        });

        window.addEventListener('drop', (e) => {
          if (window._isInternalDragging) return;
          e.preventDefault();
          dragCounter = 0;
          overlay.style.display = 'none';
          const files = e.dataTransfer && e.dataTransfer.files;
          if (files && files.length > 0) {
            processImportFile(files[0]);
          }
        });
      }

      function hasAnyLocalTasks() {
        try {
          const list = getStoreList();
          for (const s of list) {
            const raw = storageGet(getStoreKey(s.id));

              const parsed = JSON.parse(raw);
              if ((parsed.tasks && parsed.tasks.length > 0) || (parsed.recurrings && parsed.recurrings.length > 0)) {
                return true;
              }
            }
          }
        } catch (e) { }
        return (data && ((data.tasks && data.tasks.length > 0) || (data.recurrings && data.recurrings.length > 0)));

      function buildMultiStoreSnapshot() {
        const storeList = getStoreList();
        const activeStoreId = getActiveStoreId();
        const stores = {};
        for (const s of storeList) {
          const k = getStoreKey(s.id);
          if (String(s.id) === String(activeStoreId) && data) {
            stores[s.id] = JSON.stringify(data);
          } else {
            stores[s.id] = storageGet(k) || JSON.stringify(blank());
          }
        }
        return {
          storeList,
          activeStoreId,
          stores,
          quickConnect: storageGet('todoCalendar.quickConnect') || null
        };
      }

      function markLocalCloudModified() {
        if (isApplyingCloudSnapshot) return;

        pushToCloud(false);
      }

      function initFirebase() {
        if (typeof firebase === 'undefined') {
          syncStatus = 'offline';
          return;
        }
        try {
          if (!firebase.apps || !firebase.apps.length) {
            firebaseApp = firebase.initializeApp(firebaseConfig);
          } else {
            firebaseApp = firebase.app();
          }
          firebaseAuth = firebase.auth();
          firestoreDb = firebase.firestore();

          firebaseAuth.onAuthStateChanged(user => {
            currentUser = user;
            if (silentRefreshTimer) {
              clearInterval(silentRefreshTimer);
              silentRefreshTimer = null;
            }
            if (user) {
              syncStatus = 'synced';
              startCloudListener(user.uid);
              // 1시간 토큰 만료 대비 45분 주기 백그라운드 조용한 갱신 (Silent Refresh)
              silentRefreshTimer = setInterval(() => {
                if (currentUser && typeof currentUser.getIdToken === 'function') {
                  currentUser.getIdToken(true).catch(() => {
                    syncStatus = 'unauthenticated';
                  });
                }
              }, 45 * 60 * 1000);
            } else {
              if (cloudUnsubscribe) {
                cloudUnsubscribe();
                cloudUnsubscribe = null;
              }
              syncStatus = 'unauthenticated';
            }
          });
        } catch (err) {
          console.warn('Firebase 초기화 오류:', err);
          syncStatus = 'error';
        }
      }

      function startCloudListener(uid) {
        if (!firestoreDb) return;
        if (cloudUnsubscribe) {
          cloudUnsubscribe();
          cloudUnsubscribe = null;
        }
        try {
          const docRef = firestoreDb.collection('users').doc(uid);
          cloudUnsubscribe = docRef.onSnapshot(doc => {
            if (!doc.exists) {
              if (hasAnyLocalTasks()) pushToCloud(true);
              return;
            }
            if (doc.metadata && doc.metadata.hasPendingWrites) {
              return;
            }
            const remote = doc.data();
            if (!remote) return;

            try {
              if (remote.multiStorePayload) {
                const remoteMs = JSON.parse(remote.multiStorePayload);
                const localMs = buildMultiStoreSnapshot();
                const isSameStores = JSON.stringify(remoteMs.stores) === JSON.stringify(localMs.stores) &&
                                     JSON.stringify(remoteMs.storeList) === JSON.stringify(localMs.storeList);
                if (isSameStores) {
                  syncStatus = 'synced';
                  return;
                }

                const localUpdatedAt = storageGet('todoCalendar.cloudUpdatedAt') || '';
                const remoteUpdatedAt = remote.updatedAt || '';

                if (!hasAnyLocalTasks() || !localUpdatedAt || !remoteUpdatedAt || remoteUpdatedAt >= localUpdatedAt) {
                  isApplyingCloudSnapshot = true;
                  if (Array.isArray(remoteMs.storeList) && remoteMs.storeList.length > 0) {
                    storageSet(STORE_LIST_KEY, JSON.stringify(remoteMs.storeList));
                  }
                  if (remoteMs.stores && typeof remoteMs.stores === 'object') {
                    Object.entries(remoteMs.stores).forEach(([sId, sVal]) => {
                      try {
                        const rawStr = typeof sVal === 'string' ? sVal : JSON.stringify(sVal);
                        const normObj = normalize(JSON.parse(rawStr));
                        storageSet(getStoreKey(sId), JSON.stringify(normObj));
                      } catch (e) { }
                    });
                  }
                  if (remoteMs.quickConnect) {
                    storageSet('todoCalendar.quickConnect', remoteMs.quickConnect);
                  }
                  const updatedList = getStoreList();
                  if (!updatedList.some(s => String(s.id) === String(getActiveStoreId()))) {
                    setActiveStoreId(remoteMs.activeStoreId || updatedList[0].id);
                  }
                  if (remoteUpdatedAt) {
                    storageSet('todoCalendar.cloudUpdatedAt', remoteUpdatedAt);
                  }
                  loadCurrentStoreData();
                  renderStoreTabs();
                  ui.listSelectedTask = null;
                  render();
                  isApplyingCloudSnapshot = false;
                  syncStatus = 'synced';
                } else {
                  pushToCloud(true);
                }
              } else if (remote.payload) {
                const cloudObj = normalize(JSON.parse(remote.payload));
                const localDefaultRaw = storageGet(getStoreKey('default'));
                if (remote.payload !== localDefaultRaw) {
                  isApplyingCloudSnapshot = true;
                  storageSet(getStoreKey('default'), JSON.stringify(cloudObj));
                  if (cloudObj.updatedAt) {
                    storageSet('todoCalendar.cloudUpdatedAt', cloudObj.updatedAt);
                  }
                  loadCurrentStoreData();
                  renderStoreTabs();
                  render();
                  isApplyingCloudSnapshot = false;
                  syncStatus = 'synced';
                  pushToCloud(true);
                }
              }
            } catch (err) {
              isApplyingCloudSnapshot = false;
              console.error('클라우드 데이터 반영 오류:', err);
            }
          }, err => {
            console.error('클라우드 리스너 오류:', err);
            syncStatus = 'error';
          });
        } catch (e) {
          console.error('startCloudListener 오류:', e);
        }
      }

      function pushToCloud(immediate = false) {
        if (!currentUser || !firestoreDb || isApplyingCloudSnapshot) return;
        if (pushDebounceTimer) clearTimeout(pushDebounceTimer);

        const doPush = async () => {
          try {
            syncStatus = 'syncing';
            const ms = buildMultiStoreSnapshot();
            const cloudUpdatedAt = storageGet('todoCalendar.cloudUpdatedAt') || data.updatedAt || iso();
            const docRef = firestoreDb.collection('users').doc(currentUser.uid);
            await docRef.set({
              payload: ms.stores['default'] || JSON.stringify(data),
              multiStorePayload: JSON.stringify(ms),
              updatedAt: cloudUpdatedAt,
              email: currentUser.email || '',
              savedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            syncStatus = 'synced';
          } catch (err) {
            console.error('클라우드 업로드 오류:', err);
            syncStatus = 'error';
          }
        };

        if (immediate) {
          doPush();
        } else {
          pushDebounceTimer = setTimeout(doPush, 1000);
        }
      }

        if (typeof firebase === 'undefined' || !firebaseAuth) {
          alert('클라우드 모듈을 불러오지 못했습니다. 네트워크 연결 상태를 확인해 주세요.');

          console.error('로그인 오류:', err);
          if (err.code === 'auth/popup-blocked') {
            alert('브라우저의 팝업 차단을 해제한 후 다시 시도해 주세요.');
          } else if (err.code === 'auth/unauthorized-domain') {
            alert('현재 접속 도메인이 Firebase 콘솔 승인된 도메인에 등록되지 않았습니다.');
          } else if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
            alert('로그인 실패: ' + err.message);
          }
        }
      }

          if (!isEditable) {
            if (document.activeElement && document.activeElement !== document.body && !e.target.closest('button, select, [data-action]')) {
              document.activeElement.blur();
            }
            const sel = window.getSelection();

        document.addEventListener('click', (e) => {
          const link = e.target.closest('a[href]');
          if (!link) return;
          const rawHref = link.getAttribute('data-raw-href') || link.getAttribute('href') || '';
          if (!rawHref || rawHref.startsWith('#') || rawHref.startsWith('javascript:')) return;
          if (link.closest('[contenteditable="true"]') && !e.ctrlKey && !e.metaKey) return;
          if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === 'function') {
            e.preventDefault();
            e.stopPropagation();
            window.chrome.webview.postMessage(JSON.stringify({ type: 'openExternal', url: rawHref }));
          }
        }, true);

        // [V2.1.2] 데스크톱 WebView2 양방향 통신 수신 리스너
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.addEventListener('message', (ev) => {
            try {
              const data = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data;
              if (!data) return;
              if (data.type === 'windowStateUpdate') {
                if (typeof data.isWidgetMode === 'boolean') {
                  desktopWidgetState.isWidgetMode = data.isWidgetMode;
                }
                if (typeof data.opacity === 'number' && localStorage.getItem('app_screen_brightness_v210') !== null) {
                  desktopWidgetState.opacity = data.opacity;
                }
                updateWidgetControlsUI();
              } else if (data.type === 'snoozeTask') {
                const taskId = data.id;
                const minutes = parseInt(data.min || '10', 10);
                if (taskId) {
                  const key = 'urgent_' + taskId + '_' + minutes + '_' + today();
