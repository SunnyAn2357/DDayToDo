                window._isAutoStartupEnabled = !!data.enabled;
                localStorage.setItem('auto_startup', data.enabled ? 'true' : 'false');
                const autoCb = $('autoStartupCheckbox');
                const autoTxt = $('autoStartupStatusText');
                if (autoCb) {
                  autoCb.checked = !!data.enabled;
                  localStorage.setItem('auto_startup', data.enabled ? 'true' : 'false');
                  if (autoTxt) {
                    autoTxt.textContent = data.enabled ? '자동 실행 켜짐' : '자동 실행 꺼짐';
                    autoTxt.style.color = data.enabled ? '#2563eb' : '#64748b';
                  }
                  const btnStartup = $('btnRegisterStartupApp');
                  if (btnStartup) {
                    if (data.enabled) {
                      btnStartup.textContent = '시작앱에 등록됨';
                      btnStartup.style.color = '#2563eb';
                      btnStartup.style.borderColor = '#bfdbfe';
                      btnStartup.style.background = '#eff6ff';
                    } else {
                      btnStartup.textContent = '시작앱에 등록';
                      btnStartup.style.color = '#475569';
                      btnStartup.style.borderColor = '#cbd5e1';
                      btnStartup.style.background = '#f1f5f9';
                    }
                  }
                }
              } else if (data.type === 'openDetailFromBriefing') {
                if (data.id) {
                  openDetailReport(data.id);
                }
              }
            } catch(e) {}
          });
        }

        document.addEventListener('click', handleAction);

        /* [V1.3.3] 모바일 뒤로가기(popstate) 및 히스토리 방어 */
        window.addEventListener('popstate', e => {
          if (isProgrammaticHistoryBack) {
            isProgrammaticHistoryBack = false;
            return;
          }
          if ($('urgentAlertModal') && $('urgentAlertModal').open) {
            $('urgentAlertModal').close();
            return;
          }
          if ($('dailyBriefingModal') && $('dailyBriefingModal').open) {
            $('dailyBriefingModal').close();
            return;
          }
          if ($('ddayAlertModal') && $('ddayAlertModal').open) {
            $('ddayAlertModal').close();
            return;
          }
          if ($('specialCharModal') && $('specialCharModal').open) {
            $('specialCharModal').close();
            const target = lastActiveTextarea || $('modalMemo') || $('recModalMemo');
            if (target) target.focus();
            return;
          }
          if ($('editor') && $('editor').open) {
            const titleVal = ($('modalTitle') ? $('modalTitle').value.trim() : '') || ($('recModalTitle') ? $('recModalTitle').value.trim() : '');
            const memoVal = ($('modalMemo') ? ($('modalMemo').textContent || $('modalMemo').innerText || '').trim() : '') ||
                            ($('recModalMemo') ? ($('recModalMemo').textContent || $('recModalMemo').innerText || '').trim() : '');
            if (titleVal || memoVal) {
              if (!confirm('입력 중인 내용이 있습니다. 정말 닫으시겠습니까?')) {
                safePushModalState('editor');
                return;
              }
            }
            $('editor').close();
            return;
          }
          if ($('storeModal') && $('storeModal').open) {
            $('storeModal').close();
            return;
          }
          if ($('reportModal') && $('reportModal').open) {
            $('reportModal').close();
            return;
          }
          if ($('detail') && $('detail').open) {
            $('detail').close();
            return;
          }
          if ($('settings') && $('settings').open) {
            $('settings').close();
            return;
          }
        });

        // [V1.3.3] HTML5 dialog native cancel (ESC) 이벤트 방어
        $('specialCharModal')?.addEventListener('cancel', e => {
          e.stopPropagation();
          safeHistoryBack('specialCharModal');
          const target = lastActiveTextarea || $('modalMemo') || $('recModalMemo');
          if (target) {
            setTimeout(() => target.focus(), 10);
          }
        });

        $('editor')?.addEventListener('cancel', e => {
          if ($('linkInputModal') && $('linkInputModal').open) {
            e.preventDefault();
            $('linkInputModal').close();
            return;
          }
          if ($('specialCharModal') && $('specialCharModal').open) {
            e.preventDefault();
            $('specialCharModal').close();
            safeHistoryBack('specialCharModal');
            return;
          }
          const titleVal = ($('modalTitle') ? $('modalTitle').value.trim() : '') || ($('recModalTitle') ? $('recModalTitle').value.trim() : '');
          const memoVal = ($('modalMemo') ? ($('modalMemo').textContent || $('modalMemo').innerText || '').trim() : '') ||
                          ($('recModalMemo') ? ($('recModalMemo').textContent || $('recModalMemo').innerText || '').trim() : '');
          if (titleVal || memoVal) {
            if (!confirm('입력 중인 내용이 있습니다. 정말 닫으시겠습니까?')) {
              e.preventDefault();
              return;
            }
          }
          safeHistoryBack('editor');
        });

        $('detail')?.addEventListener('cancel', () => { safeHistoryBack('detail'); });
        $('settings')?.addEventListener('cancel', () => { safeHistoryBack('settings'); });
        $('reportModal')?.addEventListener('cancel', () => { safeHistoryBack('reportModal'); });
        $('storeModal')?.addEventListener('cancel', () => { safeHistoryBack('storeModal'); });
        $('dailyBriefingModal')?.addEventListener('cancel', () => {});
        $('urgentAlertModal')?.addEventListener('cancel', () => {});
        $('ddayAlertModal')?.addEventListener('cancel', () => {});

        /* [V1.3.3] 키보드 단축키 지원 및 계층형 ESC 방어 */
        document.addEventListener('keydown', e => {
          if (e.key === 'Escape') {
            const isLinkModalOpen = $('linkInputModal') && $('linkInputModal').open;
            if (isLinkModalOpen) {
              e.preventDefault();
              e.stopPropagation();
              $('linkInputModal').close();
              return;
            }
            const isSpecialCharOpen = $('specialCharModal') && $('specialCharModal').open;
            const isUrgentOpen = $('urgentAlertModal') && $('urgentAlertModal').open;
            const isBriefingOpen = $('dailyBriefingModal') && $('dailyBriefingModal').open;
            const isDdayAlertOpen = $('ddayAlertModal') && $('ddayAlertModal').open;
            const isStoreModalOpen = $('storeModal') && $('storeModal').open;
            const isReportModalOpen = $('reportModal') && $('reportModal').open;
            const isEditorOpen = $('editor') && $('editor').open;
            const isDetailOpen = $('detail') && $('detail').open;
            const isSettingsOpen = $('settings') && $('settings').open;

            // [V1.6.2] ESC 키 계층 정비: 위에 뜬 모달부터 먼저 닫히고, 브리핑 창은 마지막에 닫힘
            // 1순위: 특수문자 팝업 닫기 (입력 중인 일정 창 절대 닫히지 않음)
            if (isSpecialCharOpen) {
              e.preventDefault();
              e.stopPropagation();
              $('specialCharModal').close();
              safeHistoryBack('specialCharModal');
              const target = lastActiveTextarea || $('modalMemo') || $('recModalMemo');
              if (target) target.focus();
              return;
            }

            // 2순위: 상세 보고서 모달 (브리핑에서 눌렀을 때도 상세 창만 먼저 닫히고 브리핑 창 유지)
            if (isReportModalOpen) {
              e.preventDefault();
              $('reportModal').close();
              safeHistoryBack('reportModal');
              return;
            }

            if (isStoreModalOpen) {
              e.preventDefault();
              $('storeModal').close();
              safeHistoryBack('storeModal');
              return;
            }

            if (isUrgentOpen) {
              e.preventDefault();
              $('urgentAlertModal').close();
              return;
            }
            if (isBriefingOpen) {
              e.preventDefault();
              $('dailyBriefingModal').close();
              return;
            }
            if (isDdayAlertOpen) {
              e.preventDefault();
              $('ddayAlertModal').close();
              return;
            }

            // 2순위: 일정 입력/수정 창 닫기 (내용 작성 중이면 사용자 확인)
            if (isEditorOpen) {
              e.preventDefault();
              const titleVal = ($('modalTitle') ? $('modalTitle').value.trim() : '') || ($('recModalTitle') ? $('recModalTitle').value.trim() : '');
              const memoVal = ($('modalMemo') ? ($('modalMemo').textContent || $('modalMemo').innerText || '').trim() : '') ||
                              ($('recModalMemo') ? ($('recModalMemo').textContent || $('recModalMemo').innerText || '').trim() : '');
              if (titleVal || memoVal) {
                if (!confirm('입력 중인 내용이 있습니다. 정말 닫으시겠습니까?')) {
                  return;
                }
              }
              $('editor').close();
              safeHistoryBack('editor');
              return;
            }

            // 3순위: 알림 센터 모달 닫기
            if (isDetailOpen) {
              e.preventDefault();
              $('detail').close();
              safeHistoryBack('detail');
              return;
            }

            // 4순위: 설정 모달 닫기
            if (isSettingsOpen) {
              e.preventDefault();
              $('settings').close();
              safeHistoryBack('settings');
              return;
            }
            return;
          }

          const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
          if (tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable)) return;

          const anyModalOpen = ($('specialCharModal') && $('specialCharModal').open) ||
                               ($('urgentAlertModal') && $('urgentAlertModal').open) ||
                               ($('dailyBriefingModal') && $('dailyBriefingModal').open) ||
                               ($('ddayAlertModal') && $('ddayAlertModal').open) ||
                               ($('storeModal') && $('storeModal').open) ||
                               ($('reportModal') && $('reportModal').open) ||
                               ($('editor') && $('editor').open) ||
                               ($('detail') && $('detail').open) ||
                               ($('settings') && $('settings').open);
          if (anyModalOpen) return;

          // [V1.7.0] 월 및 연도 이동 단축키 (Ctrl + 화살표) - 캘린더/목록 모두 적용
          if (e.ctrlKey || e.metaKey) {
            if (e.key === 'ArrowLeft') {
              e.preventDefault();
              navMonth(-1);
              return;
            }
            if (e.key === 'ArrowRight') {
              e.preventDefault();
              navMonth(1);
              return;
            }
            if (e.key === 'ArrowUp') {
              e.preventDefault();
              navYear(-1);
              return;
            }
            if (e.key === 'ArrowDown') {
              e.preventDefault();
              navYear(1);
              return;
            }
          }

          // 캘린더 모드 단독 화살표 이동 (1일, 7일)
          if (ui.view === 'calendar' && !e.ctrlKey && !e.altKey && !e.metaKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
            e.preventDefault();
            const curD = parseDate(ui.selected);
            const delta = (e.key === 'ArrowLeft') ? -1 : (e.key === 'ArrowRight') ? 1 : (e.key === 'ArrowUp') ? -7 : 7;
            curD.setDate(curD.getDate() + delta);
            const newDateStr = dateStr(curD);
            ui.selected = newDateStr;
            if (curD.getFullYear() !== ui.year || curD.getMonth() !== ui.month) {
              ui.year = curD.getFullYear();
              ui.month = curD.getMonth();
            }
            render();
            return;
          }

          // [V1.7.0] H: 홈 / 빠른연결 (밀양시 BI 클릭과 동일)
          if ((e.key === 'h' || e.key === 'H') && !e.ctrlKey && !e.altKey && !e.metaKey) {
            e.preventDefault();
            triggerQuickConnect();
            return;
          }

          // [V1.7.0] B: 오늘 일정 브리핑 열기
          if ((e.key === 'b' || e.key === 'B') && !e.ctrlKey && !e.altKey && !e.metaKey) {
            e.preventDefault();
            openDailyBriefingModal(true);
            return;
          }

          // [V1.7.0] M: 캘린더와 목록 모드 변환 (모드 토글)
          if ((e.key === 'm' || e.key === 'M') && !e.ctrlKey && !e.altKey && !e.metaKey) {
            e.preventDefault();
            setView(ui.view === 'calendar' ? 'list' : 'calendar');
            return;
          }

          // T: 오늘 날짜로 이동
          if ((e.key === 't' || e.key === 'T') && !e.ctrlKey && !e.altKey && !e.metaKey) {
            e.preventDefault();
            const t = today();
            const d = parseDate(t);
            ui.year = d.getFullYear();
            ui.month = d.getMonth();
            ui.selected = t;
            if (ui.view !== 'calendar') {
              setView('calendar');
            } else {
              render();
            }
            return;
          }

          // [V1.7.0] N: 새 일정 등록 (목록 탭에서는 디폴트로 오늘 날짜에 새 일정 등록)
          if ((e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.altKey && !e.metaKey) {
            e.preventDefault();
            if (ui.view === 'list') {
              openEditor(null, today());
            } else {
              openEditor();
            }
            return;
          }
        });

        /* 다른 탭/창에서 저장이 일어나면 즉시 반영 (오래된 화면이 최신 데이터를 덮어쓰는 것 방지) */
        window.addEventListener('resize', alignStoreTabs);
        window.addEventListener('storage', e => {
          if (e.key !== getCurrentKey() || storageBlocked) return;
          try {
            data = e.newValue ? normalize(JSON.parse(e.newValue)) : blank();
            rebuildHolidays();
            render();
          } catch (err) { console.warn(err); }
        });

        $('yearSelect').addEventListener('change', e => {
          ui.year = +e.target.value;
          const curSel = parseDate(ui.selected);
          if (curSel.getFullYear() !== ui.year || curSel.getMonth() !== ui.month) {
            ui.selected = `${ui.year}-${pad(ui.month + 1)}-01`;
            renderSide();
          }
          renderCalendar();
        });
        $('monthSelect').addEventListener('change', e => {
          ui.month = +e.target.value;
          const curSel = parseDate(ui.selected);
          if (curSel.getFullYear() !== ui.year || curSel.getMonth() !== ui.month) {
            ui.selected = `${ui.year}-${pad(ui.month + 1)}-01`;
            renderSide();
          }
          renderCalendar();
        });

        $('searchInput').addEventListener('input', e => { ui.search = e.target.value; renderList(); });
        $('priorityFilter').addEventListener('change', e => { ui.priority = e.target.value; renderList(); });
        $('listYearFilter').addEventListener('change', e => { ui.filterYear = e.target.value; renderList(); });
        $('listMonthFilter').addEventListener('change', e => { ui.filterMonth = e.target.value; renderList(); });

        setInterval(updateClock, 1000);
        updateClock();
        scanNotifications();
        setView('calendar');
        initDesktopWidgetControls();

        // [V1.0.6] 스마트 알림 스케줄러: 컴퓨터 부팅/앱 기동 시 즉시 브리핑 & 1분 주기 알림 검사
        setTimeout(() => {
          if (sessionStorage.getItem('startupBriefingShown_session') !== 'true') {
            sessionStorage.setItem('startupBriefingShown_session', 'true');
            openDailyBriefingModal(true);
          } else {
            openDailyBriefingModal(false);
          }
          setTimeout(() => {
            checkSmartAlerts();
          }, 600);
        }, 1200);
        setInterval(checkSmartAlerts, 60000);
      }

      init();
    })();
  </script>


  <!-- [V2.0.4] 원-보디 프레임 제어 (데스크톱 앱 전용, 브라우저에서는 아무 동작 안 함) -->
  <script>
    (function () {
      var wv = window.chrome && window.chrome.webview;
      if (!wv || typeof wv.postMessage !== 'function') return;

      var root = document.documentElement;
      root.classList.add('is-desktop-app');

      var SVG_MAX = '<svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>';
      var SVG_RESTORE = '<svg viewBox="0 0 12 12"><rect x="2" y="4" width="6" height="6" rx="1" /><path d="M4 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H8" /></svg>';
      var state = { widget: false, max: false };

      function post(o) { try { wv.postMessage(JSON.stringify(o)); } catch (e) { } }

      function sync() {
        root.classList.toggle('is-widget-mode', state.widget);
        var cap = document.getElementById('winCaption');
        if (cap) cap.hidden = state.widget;
        var mb = document.getElementById('winMaxBtn');
        if (mb) {
          mb.innerHTML = state.max ? SVG_RESTORE : SVG_MAX;
          mb.title = state.max ? '이전 크기로 복원' : '최대화';
          mb.setAttribute('aria-label', mb.title);
        }
      }

      function init() {
        var cap = document.getElementById('winCaption');
        if (cap) {
          cap.addEventListener('click', function (e) {
            var b = e.target.closest('[data-win]');
            if (!b) return;
            e.stopPropagation();
            var w = b.getAttribute('data-win');
            if (w === 'min') post({ type: 'windowMinimize' });
            else if (w === 'max') post({ type: 'windowMaximizeToggle' });
            else if (w === 'close') post({ type: 'windowClose' });
          });
        }

        // 헤더 빈 공간 드래그 = 창 이동, 빠른 두 번 클릭 = 최대화/복원 (창 모드에서만)
        var topbar = document.querySelector('.topbar');
        var INTERACTIVE = 'button, a, input, select, textarea, label, [data-action], [data-win], [contenteditable="true"]';
        var lastDown = 0, lastX = 0, lastY = 0;
        if (topbar) {
          topbar.addEventListener('mousedown', function (e) {
            if (e.button !== 0 || state.widget) return;
            if (e.target.closest(INTERACTIVE)) return;
            var now = Date.now();
            var isDouble = (now - lastDown) < 380 && Math.abs(e.clientX - lastX) < 6 && Math.abs(e.clientY - lastY) < 6;
            lastDown = now; lastX = e.clientX; lastY = e.clientY;
            e.preventDefault();
            if (isDouble) { lastDown = 0; post({ type: 'windowMaximizeToggle' }); }
            else { post({ type: 'windowDrag' }); }
          });
        }
        sync();
      }

      wv.addEventListener('message', function (ev) {
        try {
          var d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data;
          if (!d || d.type !== 'windowStateUpdate') return;
          if (typeof d.isWidgetMode === 'boolean') state.widget = d.isWidgetMode;
          if (typeof d.isMaximized === 'boolean') state.max = d.isMaximized;
          sync();
        } catch (e) { }
      });

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>

  <!-- Service Worker Registration & Silent Auto Update for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      let isRefreshing = false;

      // 1. 새 서비스 워커가 활성화되어 페이지 제어를 인계받았을 때 자동 새로고침
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (isRefreshing) return;
        isRefreshing = true;
        try {
          if (typeof toast === 'function') {
            toast('최신 버전으로 자동 갱신되었습니다.');
          }
        } catch (e) {}
        setTimeout(() => {
          window.location.reload();
        }, 400);
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('PWA ServiceWorker 등록 완료:', reg.scope);

          // 2. 이미 대기 중인 새 버전이 있으면 즉시 활성화 트리거
          if (reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }

          // 3. 새 버전이 설치 중인 것을 감지했을 때
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // 기존 버전이 실행 중인데 새 버전이 설치 완료됨 -> 즉시 활성화 요청
                newWorker.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });

          // 4. 모바일 화면 전환 또는 브라우저 복귀 시(PWA 앱 켤 때) 백그라운드 자동 업데이트 체크
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
              reg.update().catch(() => {});
            }
          });
          window.addEventListener('focus', () => {
            reg.update().catch(() => {});
          });

          // 5. 1시간마다 주기적으로 백그라운드 업데이트 자동 확인
          setInterval(() => {
            reg.update().catch(() => {});
          }, 60 * 60 * 1000);
        }).catch(err => console.warn('PWA ServiceWorker 등록 실패:', err));
      });
    }
  </script>
