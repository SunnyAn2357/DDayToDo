      function taskRow(t, base = today(), inList = false) {
        const g = group(t, base);
        const dText = ddayBadgeText(t, base);
        const isHol = !isWork(t);
        const priClass = isHol ? 'pri-holiday' : `pri-${t.priority || 'normal'}`;
        const isSelected = inList && ui.listSelectedTask === t.id;
        const priShort = { high: 'High', normal: 'Normal', low: 'Low' }[t.priority] || 'Normal';
        const isMulti = t.startDate && t.dueDate && t.startDate < t.dueDate;
        const dateRangeStr = isMulti ? `${t.startDate.slice(5)}~${t.dueDate.slice(5)}` : '';
        const prefixTags = renderTaskPrefixTags(t);
        return `<div class="task-row ${g}" ${inList ? `data-action="selectListTask" data-id="${t.id}" style="cursor:pointer; background:${isSelected ? '#f1f5f9' : 'transparent'};"` : ''}>
          ${!isWork(t) ? '' : `<button type="button" class="check-small ${t.completed ? 'checked' : ''}" data-action="toggle" data-id="${t.id}" data-date="${t.dueDate}" aria-label="완료 토글">${t.completed ? icon('check') : ''}</button>`}
          <div class="task-open" ${!inList ? `data-action="edit" data-id="${t.id}"` : ''}>
            <div class="task-name ${priClass} ${t.completed ? 'done' : ''}">${prefixTags}${esc(t.title)}</div>
            <div class="task-meta">
              <span class="dday-badge ${g}">${dText}</span>
              ${!isWork(t) ? '' : `${dateRangeStr ? `<span>${dateRangeStr}</span>` : ''}<span>${priShort}</span>`}
            </div>
          </div>
        </div>`;
      }

      function recurringRuleRow(rule, inList = true) {
        const isSelected = inList && ui.listSelectedTask === rule.id;
        const recurText = `${rule.isLunar ? '음력 ' : ''}${RECURRENCE[rule.recurrence] || (rule.recurrence + '일 마다')}`;
        const priClass = `pri-${rule.priority || 'normal'}`;
        const priHighTag = rule.priority === 'high' ? '<span class="tag-high">[H]</span>' : '';
        return `<div class="task-row rest" data-action="selectListTask" data-id="${rule.id}" style="cursor:pointer; background:${isSelected ? '#f1f5f9' : 'transparent'};">
          <div class="task-open" ${!inList ? `data-action="editRecurringRule" data-id="${rule.id}"` : ''}>
            <div class="task-name ${priClass}">${priHighTag}<span class="tag-recurring">[${recurText}]</span>${esc(rule.title)}</div>
            <div class="task-meta">
              <span class="dday-badge rest">${recurText}</span>
              <span>시작일 ${rule.startDate || rule.dueDate}</span>
              <span>${PRIORITY[rule.priority] || 'Normal'}</span>
            </div>
          </div>
        </div>`;
      }

      function renderList() {
        const curY = new Date().getFullYear();
        const yearsSet = new Set([curY, initial.getFullYear()]);
        (data.tasks || []).forEach(t => {
          if (t && t.dueDate) {
            const y = parseInt(t.dueDate.slice(0, 4), 10);
            if (!isNaN(y)) yearsSet.add(y);
          }
        });
        for (let y = curY - 3; y <= curY + 3; y++) yearsSet.add(y);
        const years = [...yearsSet].sort((a, b) => b - a);

        if (!ui.filterYear) ui.filterYear = String(curY);
        if (ui.filterMonth === undefined || ui.filterMonth === null || ui.filterMonth === '') {
          ui.filterMonth = String(new Date().getMonth());
        }

        $('listYearFilter').innerHTML = '<option value="all">전체 연도</option>' + years.map(y => `<option value="${y}" ${String(y) === String(ui.filterYear) ? 'selected' : ''}>${y}년</option>`).join('');
        $('listYearFilter').value = ui.filterYear;
        $('listMonthFilter').value = ui.filterMonth;
        $('priorityFilter').value = ui.priority;

        document.querySelectorAll('.dday-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.value === ui.ddayFilter);
        });

        const query = ui.search.trim().toLowerCase();

        /* 반복 관리 뷰: 마스터 반복 규칙 목록 표시 */
        if (ui.priority === 'recurring') {
          const list = (data.recurrings || []).filter(rule => {
            if (query && query.length >= 2) {
              const text = [rule.title, rule.memo, ...(rule.tags || [])].join(' ').toLowerCase();
              if (!text.includes(query)) return false;
            }
            return true;
          });
          if (!list.some(r => r.id === ui.listSelectedTask)) {
            ui.listSelectedTask = list.length ? list[0].id : null;
          }
          $('listContent').innerHTML = list.length ? list.map(r => recurringRuleRow(r, true)).join('') : `<div class="empty">등록된 반복 일정이 없습니다</div>`;
          $('notificationCount').textContent = data.notifications.filter(n => !n.read).length;
          renderSide();
          return;
        }

        let list = data.tasks.filter(t => {
          /* Pure holidays are never displayed in the todo list view */
          if (!isWork(t)) return false;

          if (query && query.length >= 2) {
            const text = [t.title, t.memo, ...t.tags].join(' ').toLowerCase();
            if (!text.includes(query)) return false;
          }

          if (ui.priority !== 'all' && t.priority !== ui.priority) return false;
          const startStr = t.startDate || t.dueDate;
          const dueStr = t.dueDate;
          if (ui.filterYear !== 'all') {
            if (ui.filterYear < startStr.slice(0, 4) || ui.filterYear > dueStr.slice(0, 4)) return false;
          }
          if (ui.filterMonth !== 'all') {
            const targetM = pad(parseInt(ui.filterMonth, 10) + 1);
            const targetYM = ui.filterYear !== 'all' ? `${ui.filterYear}-${targetM}` : null;
            if (targetYM) {
              if (targetYM < startStr.slice(0, 7) || targetYM > dueStr.slice(0, 7)) return false;
            } else {
              const sm = parseInt(startStr.split('-')[1], 10) - 1;
              const dm = parseInt(dueStr.split('-')[1], 10) - 1;
              const fm = parseInt(ui.filterMonth, 10);
              if (fm < sm || fm > dm) return false;
            }
          }

          /* SINGLE-SELECT D-DAY FILTER */
          if (ui.ddayFilter !== 'all') {
            if (group(t) !== ui.ddayFilter) return false;
          }

          return true;
        }).sort(listTaskSort);

        if (!list.some(t => t.id === ui.listSelectedTask)) {
          ui.listSelectedTask = list.length ? list[0].id : null;
        }

        $('listContent').innerHTML = list.length ? list.map(t => taskRow(t, today(), true)).join('') : `<div class="empty">조건에 맞는 일정이 없습니다</div>`;
        $('notificationCount').textContent = data.notifications.filter(n => !n.read).length;
        renderSide();
      }

        $('sideList').hidden = view !== 'list';

        render();

            parts[0] = parts[0].slice(0, 4);

              <div class="field" id="fieldReminders">

                <div class="reminder-options">
                  <label class="inline-check"><input type="checkbox" class="rem-check" value="3" ${(editTarget.reminders || []).includes(3) ? 'checked' : ''}> 3일 전</label>
                  <label class="inline-check"><input type="checkbox" class="rem-check" value="5" ${(editTarget.reminders || []).includes(5) ? 'checked' : ''}> 5일 전</label>
                  <input type="text" id="modalCustomRem" class="control inline-input" placeholder="추가 알림(예: 10, 20)" value="${esc(customRemVal)}">
                </div>
              </div>

              <!-- 8. 반복 주기 -->
              <div class="field" id="fieldRecurrence">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <label>반복 주기</label>
                  <div style="display:inline-flex; align-items:center; gap:6px;">
                    <span id="modalLunarDateDisplay" style="font-size:12px; color:#2563eb; font-weight:600; display:none;"></span>
                    <label class="inline-check" style="font-size:12px; color:var(--text-sub);">
                      <input type="checkbox" id="modalIsLunar" ${editTarget.isLunar ? 'checked' : ''}> 음력
                    </label>
                  </div>
                </div>
                <div class="reminder-options">
                  <label class="inline-check"><input type="checkbox" class="rec-check" value="weekly" ${isWeekly ? 'checked' : ''}> 매주</label>
                  <label class="inline-check"><input type="checkbox" class="rec-check" value="monthly" ${isMonthly ? 'checked' : ''}> 매월</label>
                  <label class="inline-check"><input type="checkbox" class="rec-check" value="yearly" ${isYearly ? 'checked' : ''}> 매년</label>
                  <input type="text" id="modalCustomRec" class="control inline-input" placeholder="추가 반복(일 수: 숫자 입력)" value="${esc(customRecVal)}">
                </div>
                <div id="periodRecNotice" style="display:none; font-size:11.5px; color:#64748b; margin-top:4px;">※ 기간 일정(2일 이상)은 반복 주기를 설정할 수 없습니다.</div>
              </div>

              <!-- 9. 완료 처리 (수정 모드 전용) -->
              ${editing ? `
              <div class="completion-box" id="fieldCompletion">
                <label class="inline-check"><input type="checkbox" id="modalCompleted" ${editTarget.completed ? 'checked' : ''}> 완료 처리</label>
                <input type="date" id="modalCompletedDate" class="control" min="1900-01-01" max="2099-12-31" style="width:140px; margin-left:auto;" value="${editTarget.completedDate || today()}">
              </div>` : ''}
            </div>
            <div class="modal-foot">
              ${editing ? `<button type="button" class="btn danger" data-action="deleteTask" data-id="${editTarget.id}">삭제</button>` : '<div></div>'}
              <div class="actions">
                <button type="button" class="btn" data-action="closeEditor">취소</button>
                <button type="submit" class="btn primary">저장</button>
              </div>
            </div>
          </form>`;

        function syncHolidayUI() {
          const h = $('modalHoliday').checked;
          const btn = $('modalHolidayWorkBtn');
          if (btn) {
            btn.style.display = h ? 'inline-flex' : 'none';
            if (holidayHasTask) {
              btn.classList.remove('primary');
              btn.style.background = '#e2e8f0';
              btn.style.color = '#334155';
              btn.style.borderColor = '#cbd5e1';
              btn.textContent = '- 일정취소';
              btn.title = '클릭하면 순수 공휴일(일정 없음)로 전환합니다';
            } else {
              btn.classList.remove('primary');
              btn.style.background = '';
              btn.style.color = '';
              btn.style.borderColor = '';
              btn.textContent = '+ 일정추가';
              btn.title = '공휴일 당일 업무 일정도 함께 등록합니다';
            }
          }

          const isPureHoliday = h && !holidayHasTask;
          ['modalStartDate', 'modalDueDate', 'modalMemo', 'modalTags', 'modalPriority', 'modalCustomRem', 'modalCustomRec', 'modalCompleted', 'modalCompletedDate', 'modalIsLunar'].forEach(id => {
            const el = $(id);
            if (el) el.disabled = isPureHoliday;
          });
          document.querySelectorAll('#editor input[name="modalDdayMode"]').forEach(el => el.disabled = isPureHoliday);
          document.querySelectorAll('#editor .rem-check').forEach(el => el.disabled = isPureHoliday);
          document.querySelectorAll('#editor .rec-check').forEach(el => el.disabled = isPureHoliday);

          ['fieldMemo', 'fieldTags', 'fieldPriority', 'fieldDdayMode', 'fieldDateRange', 'fieldReminders', 'fieldRecurrence', 'fieldCompletion'].forEach(id => {
            const el = $(id);
            if (el) {
              el.style.opacity = isPureHoliday ? '0.4' : '1';
              el.style.pointerEvents = isPureHoliday ? 'none' : 'auto';
            }
          });
          if (!isPureHoliday) syncPeriodRecurrenceUI();
        }

        function syncPeriodRecurrenceUI() {
          if ($('modalHoliday')?.checked && !holidayHasTask) return;
          const sVal = $('modalStartDate')?.value;
          const dVal = $('modalDueDate')?.value;
          const isPeriod = sVal && dVal && sVal !== dVal;
          const recField = $('fieldRecurrence');
          const notice = $('periodRecNotice');
          if (recField) {
            const recInputs = recField.querySelectorAll('.rec-check, #modalCustomRec');
            recInputs.forEach(el => el.disabled = isPeriod);
            const optRow = recField.querySelector('.reminder-options');
            if (optRow) {
              optRow.style.opacity = isPeriod ? '0.45' : '1';
              optRow.style.pointerEvents = isPeriod ? 'none' : 'auto';
            }
            if (isPeriod) {
              recInputs.forEach(el => {
                if (el.type === 'checkbox') el.checked = false;
                else if (el.type === 'text') el.value = '';
              });
              if (notice) notice.style.display = 'block';
            } else {
              if (notice) notice.style.display = 'none';
            }
          }
          updateModalLunarDisplay();
        }

        function updateModalLunarDisplay() {
          const isL = $('modalIsLunar')?.checked;
          const disp = $('modalLunarDateDisplay');
          const sVal = $('modalStartDate')?.value;
          if (!disp) return;
          if (isL && sVal && lunarConverter) {
            try {
              const dObj = parseDate(sVal);
              lunarConverter.setSolarDate(dObj.getFullYear(), dObj.getMonth() + 1, dObj.getDate());
              const lc = lunarConverter.getLunarCalendar();
              disp.textContent = `(음력 ${lc.month}. ${lc.day}${lc.intercalation ? ' 윤달' : ''})`;
              disp.style.display = 'inline';
            } catch (e) {
              disp.style.display = 'none';
            }
          } else {
            disp.style.display = 'none';
          }
        }

        const recChecks = document.querySelectorAll('#editor .rec-check');
        const customRec = $('modalCustomRec');
        recChecks.forEach(cb => {
          cb.addEventListener('change', () => {
            if (cb.checked) {
              recChecks.forEach(other => { if (other !== cb) other.checked = false; });
              if (customRec) customRec.value = '';
            }
          });
        });
        if (customRec) {
          customRec.addEventListener('input', () => {
            const v = customRec.value.trim();
            if (v && v !== '0') {
              recChecks.forEach(cb => cb.checked = false);
            }
          });
        }

        $('modalIsLunar')?.addEventListener('change', updateModalLunarDisplay);

        $('modalStartDate').addEventListener('input', () => {
          const sVal = $('modalStartDate').value;
          const dVal = $('modalDueDate').value;
          if (sVal && sVal.length === 10 && (!dVal || dVal < sVal)) {
            $('modalDueDate').value = sVal;
          }
          syncPeriodRecurrenceUI();
          updateModalLunarDisplay();
        });
        $('modalStartDate').addEventListener('change', () => {
          const sVal = $('modalStartDate').value;
          const dVal = $('modalDueDate').value;
          if (!dVal || dVal < sVal) {
            $('modalDueDate').value = sVal;
          }
          syncPeriodRecurrenceUI();
          updateModalLunarDisplay();
        });

        $('modalDueDate').addEventListener('input', () => {
          const sVal = $('modalStartDate').value;
          const dVal = $('modalDueDate').value;
          if (dVal && dVal.length === 10 && sVal && dVal < sVal) {
            $('modalStartDate').value = dVal;
          }
          syncPeriodRecurrenceUI();
          updateModalLunarDisplay();
        });
        $('modalDueDate').addEventListener('change', () => {
          const sVal = $('modalStartDate').value;
          const dVal = $('modalDueDate').value;
          if (sVal && dVal && dVal < sVal) {
            $('modalStartDate').value = dVal;
          }
          syncPeriodRecurrenceUI();
          updateModalLunarDisplay();
        });

        $('modalHoliday').addEventListener('change', () => {
          if (!$('modalHoliday').checked) holidayHasTask = false;
          syncHolidayUI();
        });

        $('modalHolidayWorkBtn').addEventListener('click', () => {
          holidayHasTask = !holidayHasTask;
          syncHolidayUI();
        });

        ['modalStartDate', 'modalDueDate', 'modalCompletedDate'].forEach(id => attachDate4Digits($(id)));

        syncHolidayUI();
        syncPeriodRecurrenceUI();
        updateModalLunarDisplay();

        $('taskForm').onsubmit = e => {
          e.preventDefault();
          const title = $('modalTitle').value.trim();
          if (!title) return alert('제목을 입력하세요.');

          const startDate = $('modalStartDate').value;
          const dueDate = $('modalDueDate').value;
          if (!startDate) return alert('시작일을 입력하세요.');
          if (!dueDate) return alert('마감일을 입력하세요.');
          if (dueDate < startDate) return alert('마감일은 시작일 이후여야 합니다.');

          editTarget.title = title;
          editTarget.startDate = startDate;
          editTarget.dueDate = dueDate;
          editTarget.isHoliday = $('modalHoliday').checked;
          editTarget.holidayHasTask = editTarget.isHoliday && holidayHasTask;

          if (editTarget.isHoliday && !editTarget.holidayHasTask) {
            editTarget.memo = '';
            editTarget.tags = [];
            editTarget.dueTime = '';
            editTarget.reminders = [];
            editTarget.priority = 'normal';
            editTarget.recurrence = 'none';
            editTarget.isLunar = false;
            editTarget.ddayMode = 'workday';
            editTarget.completed = false;
            editTarget.completedDate = '';
          } else {
            editTarget.memo = $('modalMemo').value;
            editTarget.tags = $('modalTags').value.split(',').map(s => s.trim()).filter(Boolean);
            editTarget.priority = $('modalPriority').value;
            const checkedDday = document.querySelector('input[name="modalDdayMode"]:checked');
            editTarget.ddayMode = checkedDday ? checkedDday.value : 'workday';
            editTarget.isLunar = $('modalIsLunar').checked;

            // Recurrence calculation (기간 일정은 반복 불가)
            const isPeriod = startDate !== dueDate;
            let rec = 'none';
            if (!isPeriod) {
              const checkedRec = document.querySelector('#editor .rec-check:checked');
              if (checkedRec) {
                rec = checkedRec.value;
              } else if (customRec && customRec.value.trim() && !isNaN(Number(customRec.value)) && Number(customRec.value) > 0) {
                rec = String(Math.floor(Number(customRec.value.trim())));
              }
            }
            editTarget.recurrence = rec;

            // Reminders calculation: always include 0 (day of event)
            let rems = [...document.querySelectorAll('#editor .rem-check:checked')].map(x => +x.value);
            let c = $('modalCustomRem').value.split(',').map(x => x.trim()).filter(Boolean).map(Number);
            editTarget.reminders = [...new Set([0, ...rems, ...c])].filter(n => !isNaN(n) && n >= 0).sort((a, b) => a - b);

            if (editing) {
              editTarget.completed = $('modalCompleted') ? $('modalCompleted').checked : false;
              editTarget.completedDate = editTarget.completed ? ($('modalCompletedDate').value || today()) : '';
            }
          }

          const rec = editTarget.recurrence;
          const next = clone(data);

          if (rec !== 'none') {
            let rule = null;
            if (editTarget.recurringId) {
              rule = (next.recurrings || []).find(r => r.id === editTarget.recurringId);
            }
            if (!rule) {
              rule = {
                id: uid(),
                title: editTarget.title,
                memo: editTarget.memo,
                tags: [...editTarget.tags],
                startDate: editTarget.startDate,
                endDate: '',
                dueDate: editTarget.startDate,
                dueTime: '',
                ddayMode: editTarget.ddayMode,
                priority: editTarget.priority,
                recurrence: rec,
                isLunar: !!editTarget.isLunar,
                reminders: [...editTarget.reminders],
                isHoliday: !!editTarget.isHoliday,
                holidayHasTask: !!editTarget.holidayHasTask,
                deletedDates: [],
                createdAt: iso(),
                updatedAt: iso()
              };
              next.recurrings = next.recurrings || [];
              next.recurrings.push(rule);
            } else {
              rule.title = editTarget.title;
              rule.memo = editTarget.memo;
              rule.tags = [...editTarget.tags];
              rule.startDate = editTarget.startDate;
              rule.dueDate = editTarget.startDate;
              rule.ddayMode = editTarget.ddayMode;
              rule.priority = editTarget.priority;
              rule.recurrence = rec;
              rule.isLunar = !!editTarget.isLunar;
              rule.reminders = [...editTarget.reminders];
              rule.isHoliday = !!editTarget.isHoliday;
              rule.holidayHasTask = !!editTarget.holidayHasTask;
              rule.updatedAt = iso();
            }

            editTarget.recurringId = rule.id;
            editTarget.recurrenceType = rec;
            editTarget.recurrence = 'none';

            if (editing) {
              const idx = next.tasks.findIndex(t => t.id === editTarget.id);
              if (idx > -1) next.tasks[idx] = editTarget;
            } else {
              next.tasks.push(editTarget);
            }
          } else {
            // 반복 취소/해제 또는 일반 일정
            editTarget.recurrence = 'none';
            editTarget.recurrenceType = null;
            if (editTarget.recurringId) {
              const rule = (next.recurrings || []).find(r => r.id === editTarget.recurringId);
              if (rule) {
                rule.deletedDates = rule.deletedDates || [];
                const instDate = editTarget.startDate || editTarget.dueDate;
                if (!rule.deletedDates.includes(instDate)) {
                  rule.deletedDates.push(instDate);
                }
              }
              editTarget.recurringId = null;
            }
            if (editing) {
              const idx = next.tasks.findIndex(t => t.id === editTarget.id);
              if (idx > -1) next.tasks[idx] = editTarget;
            } else {
              next.tasks.push(editTarget);
            }
          }

          if (commit(next)) {
            $('editor').close();
            if (ui.view === 'list') ui.listSelectedTask = editTarget.id;
            render();
            toast('저장되었습니다.');
          }
        };

        $('editor').showModal();
        if (!editing) {
          setTimeout(() => $('modalTitle').focus(), 50);
        }
      }

      function openRecurringEditor(rule) {
        const editingRule = clone(rule);
        const curRec = editingRule.recurrence || 'weekly';
        const isWeekly = curRec === 'weekly';
        const isMonthly = curRec === 'monthly';
        const isYearly = curRec === 'yearly';
        const isCustomRec = !['none', 'weekly', 'monthly', 'yearly', ''].includes(String(curRec)) && !isNaN(Number(curRec)) && Number(curRec) > 0;
        const customRecVal = isCustomRec ? String(curRec) : '';
        const customRemVal = (editingRule.reminders || []).filter(x => ![0, 3, 5].includes(x)).join(', ');

        $('editor').innerHTML = `
          <form id="recurringForm" class="modal-frame">

              </div>

                    <input type="radio" name="recModalDdayMode" value="workday" ${editingRule.ddayMode !== 'calendar' ? 'checked' : ''}> 근무일 기준(주말·공휴일 제외)
                  </label>
                  <label class="inline-check" style="cursor:pointer;">
                    <input type="radio" name="recModalDdayMode" value="calendar" ${editingRule.ddayMode === 'calendar' ? 'checked' : ''}> 달력일 기준(실제 날짜)
                  </label>

                <label>기간 <span class="req">*</span></label>
                <div style="display:flex; align-items:center; gap:8px;">
                  <input type="date" id="recModalStartDate" class="control" min="1900-01-01" max="2099-12-31" value="${editingRule.startDate || editingRule.dueDate}" required style="flex:1;">
                  <span style="color:var(--text-sub); font-weight:700;">~</span>
                  <input type="date" id="recModalEndDate" class="control" min="1900-01-01" max="2099-12-31" value="${editingRule.endDate || ''}" placeholder="종료일(선택)" style="flex:1;">
                </div>
              </div>

              <!-- 7. 알림 주기 -->
              <div class="field">
                <label>알림 주기</label>
                <div class="reminder-options">
                  <label class="inline-check"><input type="checkbox" class="rem-check" value="3" ${(editingRule.reminders || []).includes(3) ? 'checked' : ''}> 3일 전</label>
                  <label class="inline-check"><input type="checkbox" class="rem-check" value="5" ${(editingRule.reminders || []).includes(5) ? 'checked' : ''}> 5일 전</label>
                  <input type="text" id="recModalCustomRem" class="control inline-input" placeholder="추가 알림(숫자 쉼표 구분: 예 10, 20)" value="${esc(customRemVal)}">
                </div>
              </div>

              <!-- 8. 반복 주기 -->
              <div class="field">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <label>반복 주기 <span class="req">*</span></label>
                  <div style="display:inline-flex; align-items:center; gap:6px;">
                    <span id="recModalLunarDateDisplay" style="font-size:12px; color:#2563eb; font-weight:600; display:none;"></span>
                    <label class="inline-check" style="font-size:12px; color:var(--text-sub);">
                      <input type="checkbox" id="recModalIsLunar" ${editingRule.isLunar ? 'checked' : ''}> 음력
                    </label>
                  </div>
                </div>
                <div class="reminder-options">
                  <label class="inline-check"><input type="checkbox" class="rec-check" value="weekly" ${isWeekly ? 'checked' : ''}> 매주</label>
                  <label class="inline-check"><input type="checkbox" class="rec-check" value="monthly" ${isMonthly ? 'checked' : ''}> 매월</label>
                  <label class="inline-check"><input type="checkbox" class="rec-check" value="yearly" ${isYearly ? 'checked' : ''}> 매년</label>
                  <input type="text" id="recModalCustomRec" class="control inline-input" placeholder="추가 반복(일 수: 숫자 입력)" value="${esc(customRecVal)}">
                </div>
              </div>
            </div>
            <div class="modal-foot">
              <button type="button" class="btn danger" data-action="deleteRecurringRule" data-id="${editingRule.id}">반복 삭제</button>
              <div class="actions">
                <button type="button" class="btn" data-action="closeEditor">취소</button>
                <button type="submit" class="btn primary">저장</button>
              </div>
            </div>
          </form>`;

        const recChecks = document.querySelectorAll('#editor .rec-check');
        const customRec = $('recModalCustomRec');
        recChecks.forEach(cb => {
          cb.addEventListener('change', () => {
            if (cb.checked) {
              recChecks.forEach(other => { if (other !== cb) other.checked = false; });
              if (customRec) customRec.value = '';
            }
          });
        });
        if (customRec) {
          customRec.addEventListener('input', () => {
            if (customRec.value.trim()) {
              recChecks.forEach(cb => cb.checked = false);
            }
          });
        }

        function updateRecModalLunarDisplay() {

          const disp = $('recModalLunarDateDisplay');

          if (!disp) return;

              disp.textContent = `(음력 ${lc.month}. ${lc.day}${lc.intercalation ? ' 윤달' : ''})`;

        $('recModalStartDate')?.addEventListener('input', updateRecModalLunarDisplay);

          const checkedRec = document.querySelector('#editor .rec-check:checked');

          const next = clone(data);
          if (rec === 'none') {
            if (confirm('반복 주기가 선택되지 않았습니다.\n반복 일정을 해제하시겠습니까?\n\n- 확인: 앞으로 새 반복 일정이 생성되지 않으며, 이미 달력에 있는 일정들은 일반 일정으로 전환됩니다.\n- 취소: 반복 주기를 다시 선택합니다.')) {
              if (next.recurrings) {
                next.recurrings = next.recurrings.filter(x => x.id !== editingRule.id);
              }
              next.tasks.forEach(t => {
                if (t.recurringId === editingRule.id) {
                  t.recurringId = null;
                  t.recurrenceType = null;
                }
              });
              if (commit(next)) {
                $('editor').close();
                render();
                toast('반복 일정이 해제되었습니다.');
              }
            }
            return;
          }
          const r = (next.recurrings || []).find(x => x.id === editingRule.id);
          if (r) {
            r.title = title;
            r.memo = $('recModalMemo').value;
            r.tags = $('recModalTags').value.split(',').map(s => s.trim()).filter(Boolean);
            r.startDate = startDate;
            r.endDate = endDate || '';
            r.dueDate = startDate;
            r.priority = $('recModalPriority').value;
            const checkedDday = document.querySelector('input[name="recModalDdayMode"]:checked');
            r.ddayMode = checkedDday ? checkedDday.value : 'workday';
            r.recurrence = rec;
            r.isLunar = $('recModalIsLunar').checked;
            let rems = [...document.querySelectorAll('#editor .rem-check:checked')].map(x => +x.value);
            let c = $('recModalCustomRem').value.split(',').map(x => x.trim()).filter(Boolean).map(Number);
            r.reminders = [...new Set([0, ...rems, ...c])].filter(n => !isNaN(n) && n >= 0).sort((a, b) => a - b);
            r.updatedAt = iso();
          }

          if (commit(next)) {
            $('editor').close();
            render();
            toast('반복 일정이 수정되었습니다.');
          }
        };

        $('editor').showModal();
      }

      async function toggleDesktop() {
        if (data.settings.desktopNotifications) {
          const next = clone(data);
          next.settings.desktopNotifications = false;
          if (commit(next)) {
            openSettings();
            toast('시스템 알림을 껐습니다.');
          }
          return;
        }

        if (!('Notification' in window)) {
          alert('현재 브라우저는 웹 시스템 알림(Notification API)을 지원하지 않습니다.');
          return;
        }

        try {
          const permission = await Notification.requestPermission();
          if (permission !== 'granted') {
            alert('알림 권한이 허용되지 않았습니다. 브라우저 주소창 좌측의 설정에서 알림을 "허용"으로 변경해 주세요.');
            openSettings();
            return;
          }

          const next = clone(data);
          next.settings.desktopNotifications = true;
          if (commit(next)) {
            openSettings();
            toast('시스템 알림이 활성화되었습니다.');
            try {
              new Notification('일정관리', {
                body: '시스템 알림이 정상적으로 활성화되었습니다.',
                tag: 'calendar-test'
              });
            } catch (err) {
              console.warn('Notification error:', err);

          }
        } catch (e) {
          alert('알림 권한을 요청하는 중 오류가 발생했습니다: ' + e.message);
        }
      }

      function handleAction(e) {
        const b = e.target.closest('[data-action]');
        if (!b) return;
        const a = b.dataset.action;

        if (a === 'view') {
          setView(b.dataset.value);
        }
        else if (a === 'prev' || a === 'next') {
          const d = new Date(ui.year, ui.month + (a === 'next' ? 1 : -1), 1);
          ui.year = d.getFullYear(); ui.month = d.getMonth();
          const curSel = parseDate(ui.selected);
          if (curSel.getFullYear() !== ui.year || curSel.getMonth() !== ui.month) {
            ui.selected = `${ui.year}-${pad(ui.month + 1)}-01`;
            renderSide();
          }
          renderCalendar();
        }
        else if (a === 'select') {
          ui.selected = b.dataset.date;
          renderCalendar();
          renderSide();
        }
        else if (a === 'goToday') {
          const t = today();
          const d = parseDate(t);
          ui.year = d.getFullYear();
          ui.month = d.getMonth();
          ui.selected = t;
          render();
          updateClock();
        }
        else if (a === 'add') {
          openEditor();
        }
        else if (a === 'edit') {
          const taskId = b.dataset.id;
          const t = data.tasks.find(x => x.id === taskId);
          if (t) {
            if ($('detail').open) $('detail').close();
            openEditor(t);
          }
        }
        else if (a === 'editRecurringRule') {
          const ruleId = b.dataset.id;
          const r = (data.recurrings || []).find(x => x.id === ruleId);
          if (r) {
            if ($('detail').open) $('detail').close();
            openRecurringEditor(r);
          }
        }
        else if (a === 'toggle') {
          e.stopPropagation();
          const next = clone(data);
          const taskId = b.dataset.id;
          const t = next.tasks.find(x => x.id === taskId);
          if (t) {
            t.completed = !t.completed;
            t.completedDate = t.completed ? today() : '';
            if (commit(next)) {
              render();
              b.classList.toggle('checked', t.completed);
              b.innerHTML = t.completed ? icon('check') : '';
              const row = b.closest('.task-row');
              if (row) {
                const nameEl = row.querySelector('.task-name');
                if (nameEl) nameEl.classList.toggle('done', t.completed);
              }
            }
          }
        }
        else if (a === 'closeEditor') {
          $('editor').close();
        }
        else if (a === 'closeDetail') {
          $('detail').close();
        }
        else if (a === 'deleteTask') {
          if (confirm('일정을 삭제하시겠습니까?')) {
            const next = clone(data);
            const taskId = b.dataset.id;
            const t = next.tasks.find(x => x.id === taskId);
            if (t && t.recurringId && next.recurrings) {
              const rule = next.recurrings.find(r => r.id === t.recurringId);
              if (rule) {
                rule.deletedDates = rule.deletedDates || [];
                if (!rule.deletedDates.includes(t.dueDate)) {
                  rule.deletedDates.push(t.dueDate);
                }
              }
            }
            next.tasks = next.tasks.filter(x => x.id !== taskId);
            if (commit(next)) {
              if ($('editor').open) $('editor').close();
              ui.listSelectedTask = null;
              render();
              toast('삭제되었습니다.');
            }
          }
        }
        else if (a === 'deleteRecurringRule') {
          const ruleId = b.dataset.id;
          if (confirm('반복 일정을 해제(삭제)하시겠습니까?\n\n- 앞으로 새로운 반복 일정이 더 이상 생성되지 않습니다.\n- 이미 달력에 생성된 일정들은 그대로 유지됩니다.')) {
            const next = clone(data);
            if (next.recurrings) {
              next.recurrings = next.recurrings.filter(r => r.id !== ruleId);
            }
            if (commit(next)) {
              if ($('editor').open) $('editor').close();
              ui.listSelectedTask = null;
              render();
              toast('반복 일정이 해제되었습니다.');
            }
          }
        }
        else if (a === 'filterDday') {
          const val = b.dataset.value;
          ui.ddayFilter = (ui.ddayFilter === val) ? 'all' : val;
          renderList();
        }
        else if (a === 'toggleHideCompleted') {
          ui.hideCompleted = !ui.hideCompleted;
          renderCalendar();
          renderSide();
        }
        else if (a === 'openDayMore') {
          const dt = b.dataset.date;
          ui.selected = dt;
          renderCalendar();
          renderSide();
          const d = parseDate(dt);
          const dateTitle = `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEK[d.getDay()]}) 전체 일정`;
          let tasks = getTasksForDate(dt).sort(calendarTaskSort);
          if (ui.hideCompleted) {
            tasks = tasks.filter(t => !t.completed);
          }
          $('detail').innerHTML = `
            <div class="modal-frame">
              <div class="modal-head">
                <h2>${dateTitle}</h2>
                <button type="button" class="btn icon" data-action="closeDetail" aria-label="닫기">${icon('close')}</button>
              </div>
              <div class="modal-body" style="padding:10px 16px; max-height:450px; overflow-y:auto;">
                ${tasks.length ? tasks.map(t => taskRow(t, today())).join('') : '<div class="empty">등록된 일정이 없습니다.</div>'}
              </div>
              <div class="modal-foot">
                <div></div>
                <button type="button" class="btn" data-action="closeDetail">닫기</button>
              </div>
            </div>
          `;
          $('detail').showModal();
        }
        else if (a === 'prevMonthList') {
          let y = ui.filterYear === 'all' ? new Date().getFullYear() : parseInt(ui.filterYear, 10);
          let m = ui.filterMonth === 'all' ? new Date().getMonth() : parseInt(ui.filterMonth, 10);
          m--;
          if (m < 0) {
            m = 11;
            y--;
          }
          ui.filterYear = String(y);
          ui.filterMonth = String(m);
          renderList();
        }
        else if (a === 'nextMonthList') {
          let y = ui.filterYear === 'all' ? new Date().getFullYear() : parseInt(ui.filterYear, 10);
          let m = ui.filterMonth === 'all' ? new Date().getMonth() : parseInt(ui.filterMonth, 10);
          m++;
          if (m > 11) {
            m = 0;
            y++;
          }
          ui.filterYear = String(y);
          ui.filterMonth = String(m);
          renderList();
        }
        else if (a === 'selectListTask') {
          ui.listSelectedTask = b.dataset.id;
          const t = (data.tasks || []).find(x => x.id === b.dataset.id);
          if (t && t.dueDate) {
            ui.selected = t.dueDate;
          }
          renderSide();
          renderList();
          updateClock();
          if (window.innerWidth < 768) {
            const sideEl = document.querySelector('aside.panel');
            if (sideEl) sideEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
          if (document.activeElement && typeof document.activeElement.blur === 'function') {
            document.activeElement.blur();
          }
        }
        else if (a === 'notifications') {
          showNotifications();
        }
        else if (a === 'clearNotifications') {
          if (confirm('알림 기록을 모두 삭제하시겠습니까?')) {
            const next = clone(data);
            next.notifications = [];
            if (commit(next)) {
              showNotifications();
              toast('알림 기록이 삭제되었습니다.');
            }
          }
        }
        else if (a === 'cloudSync') {
          if (!currentUser) {
            openSettings();
          } else {
            toast('클라우드 동기화를 진행합니다...');
            pushToCloud(true);
          }
        }
        else if (a === 'cloudSyncNow') {
          if (!currentUser) {
            loginGoogle();
          } else {
            toast('클라우드 동기화를 진행합니다...');
            pushToCloud(true);
          }
        }
        else if (a === 'loginGoogle') {
          loginGoogle();
        }
        else if (a === 'logoutGoogle') {
          logoutGoogle();
        }
        else if (a === 'settings') {
          openSettings();
        }
        else if (a === 'closeSettings') {
          $('settings').close();
        }
        else if (a === 'toggleDesktop') {
          toggleDesktop();
        }
        else if (a === 'exportBackup') {
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const aTag = document.createElement('a');
          aTag.href = url;
          aTag.download = '일정관리_백업_' + today() + '.json';
          aTag.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          saveLastBackup();
          const nudgeEl = $('backupNudgeText');
          if (nudgeEl) nudgeEl.remove();
          render();
        }
        else if (a === 'importMerge' || a === 'importOverwrite') {
          const file = $('importFile').files[0];
          if (!file) return alert('파일을 선택하세요.');
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const inc = normalize(JSON.parse(reader.result));
              const next = clone(data);
              if (a === 'importOverwrite') {
                if (!confirm('기존 데이터를 모두 교체합니까?')) return;
                next.tasks = inc.tasks;
                next.recurrings = inc.recurrings || [];
                next.settings = inc.settings;
              } else {
                const map = new Map(next.tasks.map(t => [t.id, t]));
                inc.tasks.forEach(t => map.set(t.id, t));
                next.tasks = [...map.values()];
                const recMap = new Map((next.recurrings || []).map(r => [r.id, r]));
                (inc.recurrings || []).forEach(r => recMap.set(r.id, r));
                next.recurrings = [...recMap.values()];
              }
              if (commit(next)) {
                $('settings').close();
                render();
                toast('복원되었습니다.');
              }
            } catch (err) { alert('오류: ' + err.message); }
          };
          reader.readAsText(file);
        }
        else if (a === 'resetData') {
          if (confirm('모든 데이터를 삭제합니까? 되돌릴 수 없습니다.')) {
            commit(blank());
            $('settings').close();
            render();
            toast('데이터가 초기화되었습니다.');
          }
        }
        else if (a === 'ddayGroup') {
          const val = b.dataset.value;
          const base = today();
          const openTasks = getUpcomingTasks(base).filter(t => {
            const n = taskWorkdays(t, base);
            if (val === 'ddaythree') return n <= 3;
            if (val === 'ddayfive') return n >= 4 && n <= 5;
            if (val === 'ddayten') return n >= 6 && n <= 10;
            return n >= 11;
          }).sort(listTaskSort);

          const titles = { ddaythree: 'D-3', ddayfive: 'D-5', ddayten: 'D-10', rest: 'D-11~' };
          const titleText = titles[val] || '마감 일정';

          $('detail').innerHTML = `
            <div class="modal-frame">
              <div class="modal-head">
                <h2>${titleText}</h2>
                <button type="button" class="btn icon" data-action="closeDetail" aria-label="닫기">${icon('close')}</button>
              </div>
              <div class="modal-body" style="padding:10px 16px;">
                ${openTasks.length ? openTasks.map(t => taskRow(t, base)).join('') : '<div class="empty">해당 조건의 일정이 없습니다</div>'}
              </div>
            </div>
          `;
          $('detail').showModal();
        }
      }

      /* =====================================================================
       * FIREBASE CLOUD SYNC MODULE (Firestore & Google Auth)
       * ===================================================================== */
      const firebaseConfig = {
        apiKey: "AIzaSyCOvKiQdcSaYusFfOaHsogGyI49kSvBNEY",
        authDomain: "dday-todo-canlendar.firebaseapp.com",
        projectId: "dday-todo-canlendar",
        storageBucket: "dday-todo-canlendar.firebasestorage.app",
        messagingSenderId: "164960642918",
        appId: "1:164960642918:web:2240b769c16e1e9ed98aa7"
      };

      let firebaseApp = null;
      let firebaseAuth = null;
      let firestoreDb = null;
      let currentUser = null;
      let cloudUnsubscribe = null;
      let lastCloudSyncTime = null;
      let syncStatus = 'offline'; // 'offline' | 'unauthenticated' | 'synced' | 'syncing' | 'error'
      let pushDebounceTimer = null;

      function formatSyncTime(d) {
        if (!d) return '';
        const dt = new Date(d);
        return `${dt.getFullYear()}.${pad(dt.getMonth() + 1)}.${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}:${pad(dt.getSeconds())}`;
      }

      function updateSyncUI() {
        const dot = $('cloudSyncDot');
        const btn = $('settingsBtn') || $('cloudSyncBtn');
        if (!dot) return;

        dot.className = 'sync-dot';
        if (syncStatus === 'synced') {
          dot.classList.add('synced');
          if (btn) btn.title = `설정 및 동기화 (클라우드 연동: ${currentUser ? currentUser.email : ''})`;
        } else if (syncStatus === 'syncing') {
          dot.classList.add('syncing');
          if (btn) btn.title = '설정 및 동기화 (클라우드 저장 중...)';
        } else if (syncStatus === 'error') {
          dot.classList.add('error');
          if (btn) btn.title = '동기화 오류 (클릭하여 설정 확인)';
        } else {
          if (btn) btn.title = '설정 및 동기화 (오프라인 / 로그인 필요)';
        }
      }

      function initFirebase() {
        if (typeof firebase === 'undefined') {
          syncStatus = 'offline';
          updateSyncUI();
          return;
        }
        try {
          if (!firebase.apps || !firebase.apps.length) {
            firebaseApp = firebase.initializeApp(firebaseConfig);
          } else {
            firebaseApp = firebase.app();
          }
          firebaseAuth = firebase.auth();
          firestoreDb = firebase.firestore();

          firebaseAuth.onAuthStateChanged(user => {
            currentUser = user;
            if (user) {
              syncStatus = 'synced';
              startCloudListener(user.uid);
            } else {
              if (cloudUnsubscribe) {
                cloudUnsubscribe();
                cloudUnsubscribe = null;
              }
              syncStatus = 'unauthenticated';
            }
            updateSyncUI();
            if ($('settings') && $('settings').open) {
              openSettings();
            }
          });
        } catch (err) {
          console.warn('Firebase 초기화 오류:', err);
          syncStatus = 'error';
          updateSyncUI();
        }
      }

      function startCloudListener(uid) {
        if (!firestoreDb) return;
        if (cloudUnsubscribe) {
          cloudUnsubscribe();
          cloudUnsubscribe = null;
        }
        try {
          const docRef = firestoreDb.collection('users').doc(uid);
          cloudUnsubscribe = docRef.onSnapshot(doc => {
            if (!doc.exists) {
              pushToCloud(true);
              return;
            }
            if (doc.metadata && doc.metadata.hasPendingWrites) {
              return;
            }
            const remote = doc.data();
            if (!remote || !remote.payload) return;

            try {
              const cloudObj = normalize(JSON.parse(remote.payload));
              const localPayload = JSON.stringify(data);
              if (remote.payload !== localPayload) {
                if (!data.updatedAt || (cloudObj.updatedAt && cloudObj.updatedAt >= data.updatedAt)) {
                  data = cloudObj;
                  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
                  rebuildHolidays();
                  render();
                  lastCloudSyncTime = new Date();
                  syncStatus = 'synced';
                  updateSyncUI();
                  toast('클라우드에서 최신 일정을 동기화했습니다.');
                } else {
                  pushToCloud(true);
                }
              }
            } catch (err) {
              console.error('클라우드 데이터 반영 오류:', err);
            }
          }, err => {
            console.error('클라우드 리스너 오류:', err);
            syncStatus = 'error';
            updateSyncUI();
          });
        } catch (e) {
          console.error('startCloudListener 오류:', e);
        }
      }

      function pushToCloud(immediate = false) {
        if (!currentUser || !firestoreDb) return;
        if (pushDebounceTimer) clearTimeout(pushDebounceTimer);

        const doPush = async () => {
          try {
            syncStatus = 'syncing';
            updateSyncUI();
            const docRef = firestoreDb.collection('users').doc(currentUser.uid);
            await docRef.set({
              payload: JSON.stringify(data),
              updatedAt: data.updatedAt || iso(),
              email: currentUser.email || '',
              savedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            syncStatus = 'synced';
            lastCloudSyncTime = new Date();
            updateSyncUI();
          } catch (err) {
            console.error('클라우드 업로드 오류:', err);
            syncStatus = 'error';
            updateSyncUI();
          }
        };

        if (immediate) {
          doPush();
        } else {
          pushDebounceTimer = setTimeout(doPush, 1000);
        }
      }

      async function loginGoogle() {
        if (typeof firebase === 'undefined' || !firebaseAuth) {
          alert('Firebase 라이브러리를 불러오지 못했습니다. 네트워크 연결 상태를 확인해 주세요.');
          return;
        }
        if (window.location.protocol === 'file:') {
          alert('구글 로그인은 웹 보안 정책상 로컬 파일(file://)에서는 실행할 수 없습니다.\n\nGitHub Pages 등 웹 호스팅을 이용하거나 localhost 웹서버로 열어주세요.');
          return;
        }
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await firebaseAuth.signInWithPopup(provider);
          toast('구글 계정으로 로그인되었습니다.');
          if ($('settings').open) openSettings();
        } catch (err) {
          console.error('로그인 오류:', err);
          if (err.code === 'auth/popup-blocked') {
            alert('브라우저의 팝업 차단을 해제한 후 다시 시도해 주세요.');
          } else if (err.code === 'auth/unauthorized-domain') {
            alert('현재 접속 도메인이 Firebase 콘솔에 등록되지 않았습니다.\nFirebase 콘솔 > Authentication > Settings > 승인된 도메인에 현재 사이트 주소를 등록해 주세요.');
          } else {
            alert('로그인 실패: ' + err.message);
          }
        }
      }

      async function logoutGoogle() {
        if (!firebaseAuth) return;
        if (!confirm('구글 계정에서 로그아웃하시겠습니까?\n(로컬에 저장된 일정은 삭제되지 않습니다)')) return;
        try {
          if (cloudUnsubscribe) {
            cloudUnsubscribe();
            cloudUnsubscribe = null;
          }
          await firebaseAuth.signOut();
          currentUser = null;
          syncStatus = 'unauthenticated';
          updateSyncUI();
          toast('로그아웃되었습니다.');
          if ($('settings').open) openSettings();
        } catch (err) {
          alert('로그아웃 오류: ' + err.message);
        }
      }

      /* 외부 진단용 (콘솔에서 ScheduleApp.diagnostics() 로 상태 점검) */
      window.ScheduleApp = {
        version: 2,
        storageKey: KEY,
        getData: () => clone(data),
        scanNotifications,
        diagnostics() {
          return {
            tasks: data.tasks.length,
            recurrings: (data.recurrings || []).length,
            notifications: data.notifications.length,
            storageBlocked,
            backupNudgeDue: isBackupNudgeDue(),
            lastBackup: readLastBackup() || null
          };
        }
      };

      function init() {
        try {
          const raw = localStorage.getItem(KEY);
          if (raw) data = normalize(JSON.parse(raw));
        } catch (e) { console.error(e); }
        rebuildHolidays();
        syncRecurringInstances(today(), addDays(today(), 60));
        initFirebase();

        document.addEventListener('mousedown', e => {
          const isEditable = e.target.closest('input:not([type="checkbox"]):not([type="radio"]):not([type="button"]):not([type="submit"]), textarea, [contenteditable="true"]');
          if (!isEditable) {
            if (document.activeElement && document.activeElement !== document.body && !e.target.closest('button, select, [data-action]')) {
              document.activeElement.blur();
            }
            const sel = window.getSelection();
            if (sel && sel.removeAllRanges) sel.removeAllRanges();
          }
        });

        document.addEventListener('click', handleAction);

        /* 다른 탭/창에서 저장이 일어나면 즉시 반영 (오래된 화면이 최신 데이터를 덮어쓰는 것 방지) */
        window.addEventListener('storage', e => {
          if (e.key !== KEY || storageBlocked) return;
          try {
            data = e.newValue ? normalize(JSON.parse(e.newValue)) : blank();
            rebuildHolidays();
            render();
          } catch (err) { console.warn(err); }
        });

        $('yearSelect').addEventListener('change', e => {
          ui.year = +e.target.value;
          const curSel = parseDate(ui.selected);
          if (curSel.getFullYear() !== ui.year || curSel.getMonth() !== ui.month) {
            ui.selected = `${ui.year}-${pad(ui.month + 1)}-01`;
            renderSide();
          }
          renderCalendar();
        });
        $('monthSelect').addEventListener('change', e => {
          ui.month = +e.target.value;
          const curSel = parseDate(ui.selected);
          if (curSel.getFullYear() !== ui.year || curSel.getMonth() !== ui.month) {
            ui.selected = `${ui.year}-${pad(ui.month + 1)}-01`;
            renderSide();
          }
          renderCalendar();
        });

        $('searchInput').addEventListener('input', e => { ui.search = e.target.value; renderList(); });
        $('priorityFilter').addEventListener('change', e => { ui.priority = e.target.value; renderList(); });
        $('listYearFilter').addEventListener('change', e => { ui.filterYear = e.target.value; renderList(); });
        $('listMonthFilter').addEventListener('change', e => { ui.filterMonth = e.target.value; renderList(); });

        setInterval(updateClock, 1000);
        updateClock();
        scanNotifications();
        setView('calendar');
      }

      init();
    })();
  </script>

        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA ServiceWorker 등록 완료:', reg.scope))
          .catch(err => console.warn('PWA ServiceWorker 등록 실패:', err));
      });
    }
  </script>
