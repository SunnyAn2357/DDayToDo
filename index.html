          });
          draggedId = null;
          draggedPriority = null;
        });

        container.addEventListener('dragover', (e) => {
          const row = e.target.closest('.task-row');
          if (!row || !draggedId || row.dataset.id === draggedId) return;
          if (row.dataset.priority !== draggedPriority) return;

          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';

          const rect = row.getBoundingClientRect();
          const isTop = (e.clientY - rect.top) < (rect.height / 2);
          row.classList.toggle('drag-over-top', isTop);
          row.classList.toggle('drag-over-bottom', !isTop);
        });

        container.addEventListener('dragleave', (e) => {
          const row = e.target.closest('.task-row');
          if (row) {
            row.classList.remove('drag-over-top', 'drag-over-bottom');
          }
        });

        container.addEventListener('drop', (e) => {
          const row = e.target.closest('.task-row');
          if (!row || !draggedId || row.dataset.id === draggedId) return;
          if (row.dataset.priority !== draggedPriority) return;

          e.preventDefault();
          const rect = row.getBoundingClientRect();
          const isTop = (e.clientY - rect.top) < (rect.height / 2);
          const targetId = row.dataset.id;

          const selDate = ui.selected;
          const samePriTasks = (data.tasks || []).filter(t => {
            const matchDate = (t.dueDate === selDate || (t.startDate && t.dueDate && t.startDate <= selDate && selDate <= t.dueDate));
            return matchDate && isWork(t) && (t.priority || 'normal') === draggedPriority;
          }).sort((a, b) => (a.order ?? 9999) - (b.order ?? 9999));

          const draggedItem = (data.tasks || []).find(t => t.id === draggedId);
          const targetItem = (data.tasks || []).find(t => t.id === targetId);
          if (!draggedItem || !targetItem) return;

          const listWithout = samePriTasks.filter(t => t.id !== draggedId);
          const targetIdx = listWithout.findIndex(t => t.id === targetId);
          const insertIdx = isTop ? targetIdx : targetIdx + 1;
          listWithout.splice(insertIdx, 0, draggedItem);

          listWithout.forEach((item, idx) => {
            item.order = idx + 1;
          });

          commit(data);
          render();
        });

      function parseMemoForEditor(raw) {

        const BLOCK = /^(DIV|P|LI|UL|OL|BLOCKQUOTE|PRE|SECTION|ARTICLE)$/;
        const hasText = (str) => str.replace(/[\s\u00a0\u0001]/g, '') !== '';
        const wrap = (inner, pre, post) => hasText(inner) ? pre + inner + post : inner;
        const HILITE = /^rgb\(254,\s*240,\s*138\)$|^#fef08a$/i;

        const walk = (node) => {
          if (node.nodeType === 3) return node.nodeValue.replace(/\u200B/g, '').replace(/\u00a0/g, ' ');
          if (node.nodeType !== 1) return '';
          const tag = node.tagName;
          if (tag === 'BR') return '\n';
          let inner = '';
          node.childNodes.forEach(c => { inner += walk(c); });

          const css = node.style || {};
          const deco = String(css.textDecorationLine || css.textDecoration || '');
          let isBold = tag === 'B' || tag === 'STRONG' || /^(bold|bolder|[6-9]00)$/.test(String(css.fontWeight || ''));
          let isItalic = tag === 'I' || tag === 'EM' || css.fontStyle === 'italic';
          let isUnder = tag === 'U' || (tag !== 'A' && /underline/.test(deco));
          let isStrike = tag === 'S' || tag === 'STRIKE' || tag === 'DEL' || /line-through/.test(deco);
          let isMark = tag === 'MARK';
          const isCode = tag === 'CODE' || tag === 'KBD' || tag === 'SAMP' || tag === 'TT';
          const parts = [];
          if (tag !== 'MARK' && tag !== 'A' && !isCode) {
            if (tag === 'FONT' && node.getAttribute('color')) parts.push('color:' + node.getAttribute('color'));
            if (css.color) parts.push('color:' + css.color);
            const bg = css.backgroundColor;
            if (bg) {
              if (HILITE.test(bg.trim())) isMark = true;
              else parts.push('background-color:' + bg);
            }
          }
          const colorStyle = sanitizeMemoStyle(parts.join(';'));

          if (colorStyle) inner = wrap(inner, `<span style="${colorStyle}">`, '</span>');
          if (isCode) inner = wrap(inner, '`', '`');
          if (isMark) inner = wrap(inner, '==', '==');
          if (isStrike) inner = wrap(inner, '~~', '~~');
          if (isUnder) inner = wrap(inner, '<u>', '</u>');
          if (isItalic) inner = wrap(inner, '*', '*');
          if (isBold) inner = wrap(inner, '**', '**');
          if (tag === 'A') {
            const href = node.getAttribute('data-raw-href') || node.getAttribute('href') || '';
            if (href && hasText(inner)) inner = `[${inner}](${href})`;
          }

          const hm = tag.match(/^H([1-6])$/);
          if (hm) {
            const lvl = Math.min(3, +hm[1]);
            return BOUND + '#'.repeat(lvl) + ' ' + inner.replace(/\n+$/, '') + BOUND;
          }
          if (BLOCK.test(tag)) return BOUND + inner + BOUND;
          return inner;
        };

        let raw = '';
        root.childNodes.forEach(c => { raw += walk(c); });
        // 블록 경계 → 줄바꿈 (이미 줄 시작이면 추가하지 않음)
        let out = '';
        for (const ch of raw) {
          if (ch === BOUND) {
            if (out && !out.endsWith('\n')) out += '\n';
          } else {
            out += ch;
          }
        }
        return out.replace(/^\n+|\s+$/g, '');
      }

      function applyMarkdownWrap(textarea, before, after) {
        if (!textarea) return;
        textarea.focus();
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const val = textarea.value;
        const sel = val.slice(start, end);
        if (sel.length > 0) {
          const replaceText = `${before}${sel}${after}`;
          if (document.queryCommandSupported && document.queryCommandSupported('insertText')) {
            document.execCommand('insertText', false, replaceText);
          } else {
            textarea.setRangeText(replaceText, start, end, 'end');
            textarea.dispatchEvent(new Event('input', { bubbles: true }));
          }
        } else {
          const placeholder = '텍스트';
          const replaceText = `${before}${placeholder}${after}`;
          if (document.queryCommandSupported && document.queryCommandSupported('insertText')) {
            document.execCommand('insertText', false, replaceText);
            textarea.setSelectionRange(start + before.length, start + before.length + placeholder.length);
          } else {
            textarea.setRangeText(replaceText, start, end, 'end');
            textarea.setSelectionRange(start + before.length, start + before.length + placeholder.length);
            textarea.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }
      }

      function applyHeadingPrefix(textarea, prefix) {
        if (!textarea) return;
        textarea.focus();
        const start = textarea.selectionStart;
        const val = textarea.value;
        const lastNewline = val.lastIndexOf('\n', start - 1);
        const lineStart = lastNewline === -1 ? 0 : lastNewline + 1;
        const currentLine = val.slice(lineStart);
        const existingHMatch = currentLine.match(/^(#{1,3}\s*)/);
        if (existingHMatch) {
          textarea.setRangeText(prefix, lineStart, lineStart + existingHMatch[0].length, 'end');
        } else {
          textarea.setRangeText(prefix, lineStart, lineStart, 'end');
        }
        textarea.dispatchEvent(new Event('input', { bubbles: true }));
      }

      let lastActiveEditorRange = null;

      function applyLiveMarkdown(editorEl) {
        if (!editorEl || !editorEl.isContentEditable) return;
        const sel = window.getSelection();
        if (!sel || !sel.rangeCount) return;
        const range = sel.getRangeAt(0);
        const node = range.startContainer;
        if (node.nodeType !== Node.TEXT_NODE) return;

        const text = node.textContent;
        const offset = range.startOffset;
        const textBefore = text.slice(0, offset);

        // 1. Heading (# , ## , ### )
        const hMatch = textBefore.match(/^(#{1,3})\s$/);
        if (hMatch) {
          const lvl = hMatch[1].length;
          node.textContent = text.slice(offset);
          let block = node;
          while (block && block.parentNode !== editorEl) {
            block = block.parentNode;
          }
          const h = document.createElement('h' + lvl);
          const remText = (node.textContent || '').trim();
          h.innerHTML = remText ? remText : '<br>';
          if (block && block.parentNode === editorEl) {
            editorEl.replaceChild(h, block);
          } else {
            editorEl.appendChild(h);
          }
          const r = document.createRange();
          if (remText) {
            r.selectNodeContents(h);
            r.collapse(false);
          } else {
            r.setStart(h, 0);
            r.collapse(true);
          }
          sel.removeAllRanges();
          sel.addRange(r);
          lastActiveEditorRange = r.cloneRange();
          return;
        }

        // 2. Inline Markdown
        const patterns = [
          { regex: /`([^`]+)`\s$/, tag: 'code' },
          { regex: /\*\*([^*]+)\*\*\s$/, tag: 'strong' },
          { regex: /(?<!\*)\*([^*]+)\*\s$/, tag: 'em' },
          { regex: /~~([^~]+)~~\s$/, tag: 'del' },
          { regex: /==([^=]+)==\s$/, tag: 'mark' },
          { regex: /<u>(.*?)<\/u>\s$/, tag: 'u' },
          { regex: /__([^_]+)__\s$/, tag: 'u' }
        ];

        for (const p of patterns) {
          const m = textBefore.match(p.regex);
          if (m) {
            const matchStr = m[0];
            const innerText = m[1];
            const startIdx = offset - matchStr.length;
            const before = text.slice(0, startIdx);
            const after = text.slice(offset);

            const frag = document.createDocumentFragment();
            if (before) frag.appendChild(document.createTextNode(before));
            const styledEl = document.createElement(p.tag);
            styledEl.textContent = innerText;
            frag.appendChild(styledEl);
            const spaceNode = document.createTextNode('\u00A0');
            frag.appendChild(spaceNode);
            if (after) frag.appendChild(document.createTextNode(after));

            node.parentNode.replaceChild(frag, node);

            const newRange = document.createRange();
            newRange.setStart(spaceNode, 1);
            newRange.collapse(true);
            sel.removeAllRanges();
            sel.addRange(newRange);
            lastActiveEditorRange = newRange.cloneRange();
            return;
          }
        }

        // 3. Link: [text](url or path)
        const linkMatch = textBefore.match(/\[([^\]]+)\]\(([^)]+)\)\s$/);
        if (linkMatch) {
          const matchStr = linkMatch[0];
          const linkText = linkMatch[1];
          const linkUrl = normalizeSmartLinkUrl(linkMatch[2]);
          const startIdx = offset - matchStr.length;
          const before = text.slice(0, startIdx);
          const after = text.slice(offset);

          const frag = document.createDocumentFragment();
          if (before) frag.appendChild(document.createTextNode(before));
          const a = document.createElement('a');
          a.setAttribute('href', linkUrl);
          a.setAttribute('data-raw-href', linkUrl);
          a.title = linkUrl;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = linkText;
          frag.appendChild(a);
          const spaceNode = document.createTextNode('\u00A0');
          frag.appendChild(spaceNode);
          if (after) frag.appendChild(document.createTextNode(after));

          node.parentNode.replaceChild(frag, node);

          const newRange = document.createRange();
          newRange.setStart(spaceNode, 1);
          newRange.collapse(true);
          sel.removeAllRanges();
          sel.addRange(newRange);
          lastActiveEditorRange = newRange.cloneRange();
          return;
        }
      }

      function setupMemoMarkdownToolbar(prefix, editorEl) {
        if (!editorEl) return;
        const toolbar = $(`${prefix}memoMdToolbar`);
        if (!toolbar) return;

        lastActiveTextarea = editorEl;

        const hSelect = $(`${prefix}memoToolHeading`);
        // 현재 커서(또는 포커스 블록)의 태그(H1, H2, H3, DIV)를 감지하여 헤더 드롭다운 표시를 실시간 동기화
        const syncHeadingSelect = () => {
          if (!hSelect || document.activeElement === hSelect) return;
          const sel = window.getSelection();
          if (!sel || !sel.rangeCount || !editorEl.contains(sel.anchorNode)) return;
          let block = sel.anchorNode;
          if (block === editorEl) {
            block = editorEl.childNodes[Math.min(sel.anchorOffset, editorEl.childNodes.length - 1)] || editorEl.firstChild;
          } else {
            while (block && block.parentNode !== editorEl) {
              block = block.parentNode;
            }
          }
          const tag = (block && block.nodeType === Node.ELEMENT_NODE) ? block.tagName.toLowerCase() : 'div';
          if (['h1', 'h2', 'h3'].includes(tag)) {
            hSelect.value = tag;
          } else {
            hSelect.value = '';
          }
        };

        // 모달 열림 시마다 중복 바인딩되는 것을 방지 (단 1회만 이벤트 등록)
        if (editorEl._toolbarInitialized) {
          syncHeadingSelect();
          return;
        }
        editorEl._toolbarInitialized = true;

        const saveRange = () => {
          const sel = window.getSelection();
          if (sel && sel.rangeCount > 0 && editorEl.contains(sel.anchorNode)) {
            lastActiveEditorRange = sel.getRangeAt(0).cloneRange();
          }
        };

        const restoreRange = () => {
          if (lastActiveEditorRange) {
            try {
              const sel = window.getSelection();
              sel.removeAllRanges();
              sel.addRange(lastActiveEditorRange);
            } catch (err) {}
          }
        };

        // selectionchange 이벤트를 통해 블록 지정, 커서 이동 시 실시간으로 range를 백업하고 헤더 선택창 동기화
        const onSelChange = () => {
          const sel = window.getSelection();
          if (sel && sel.rangeCount > 0 && editorEl.contains(sel.anchorNode)) {
            lastActiveEditorRange = sel.getRangeAt(0).cloneRange();
            syncHeadingSelect();
          }
        };
        document.addEventListener('selectionchange', onSelChange);

        editorEl.onfocus = () => {
          lastActiveTextarea = editorEl;
          if (!lastActiveEditorRange || !editorEl.contains(lastActiveEditorRange.commonAncestorContainer)) {
            saveRange();
          }
          syncHeadingSelect();
        };
        editorEl.onmouseup = () => {
          saveRange();
          syncHeadingSelect();
        };
        editorEl.onkeyup = (e) => {
          saveRange();
          if (e.isComposing) return;
          if (e.key === ' ' || e.key === 'Spacebar') {
            applyLiveMarkdown(editorEl);
          }
          syncHeadingSelect();
        };

        // 글자를 모두 지웠을 때 잔여 H1, span style, strong 태그를 완전히 제거하고 깨끗한 <div><br></div>로 초기화
        // 단, 한글 조합(IME) 중이거나, 사용자가 의도적으로 만든 빈 제목(H1/H2/H3) 블록은 강제로 div로 덮어쓰지 않고 유지!
        editorEl.addEventListener('input', (e) => {
          if (e.isComposing) return;
          const text = (editorEl.textContent || '').replace(/\u200B/g, '').trim();
          if (text === '' && !editorEl.querySelector('img, a')) {
            const first = editorEl.firstElementChild;
            if (editorEl.children.length === 1 && first && ['DIV', 'H1', 'H2', 'H3'].includes(first.tagName) && (!first.textContent || !first.textContent.trim())) {
              saveRange();
              syncHeadingSelect();
              return;
            }
            if (editorEl.children.length !== 1 || first?.tagName !== 'DIV' || first?.innerHTML !== '<br>') {
              editorEl.innerHTML = '<div><br></div>';
              const r = document.createRange();
              r.setStart(editorEl.firstElementChild, 0);
              r.collapse(true);
              const sel = window.getSelection();
              if (sel) {
                sel.removeAllRanges();
                sel.addRange(r);
              }
              saveRange();
            }
          } else {
            saveRange();
          }
          syncHeadingSelect();
        });

        // 커서 또는 선택 영역이 속한 줄(블록)을 안전하게 Heading / Div로 전환하는 함수
        const applyHeadingToCurrentLine = (level) => {
          restoreRange();
          const sel = window.getSelection();
          if (!sel || !sel.rangeCount) return;
          const range = sel.getRangeAt(0);

          let block = range.startContainer;
          if (block === editorEl) {
            block = editorEl.childNodes[Math.min(range.startOffset, editorEl.childNodes.length - 1)] || editorEl.firstChild;
          } else {
            while (block && block.parentNode !== editorEl) {
              block = block.parentNode;
            }
          }

          const targetTag = level ? level.toLowerCase() : 'div';
          if (!block) {
            const newEl = document.createElement(targetTag);
            newEl.innerHTML = '<br>';
            editorEl.appendChild(newEl);
            const r = document.createRange();
            r.setStart(newEl, 0);
            r.collapse(true);
            sel.removeAllRanges();
            sel.addRange(r);
            saveRange();
            return;
          }

          if (block.tagName?.toLowerCase() !== targetTag) {
            const newEl = document.createElement(targetTag);
            const content = (block.nodeType === Node.TEXT_NODE ? block.textContent : block.innerHTML) || '<br>';
            newEl.innerHTML = content.trim() ? content : '<br>';
            editorEl.replaceChild(newEl, block);
            const r = document.createRange();
            if (newEl.innerHTML === '<br>') {
              r.setStart(newEl, 0);
              r.collapse(true);
            } else {
              r.selectNodeContents(newEl);
              r.collapse(false);
            }
            sel.removeAllRanges();
            sel.addRange(r);
            saveRange();
          }
        };

        if (hSelect) {
          hSelect.onmousedown = () => saveRange();
          hSelect.onfocus = () => saveRange();
          hSelect.onchange = () => {
            const val = hSelect.value;
            if (editorEl.isContentEditable) {
              applyHeadingToCurrentLine(val);
            } else {
              applyHeadingPrefix(editorEl, val ? (val === 'h1' ? '# ' : val === 'h2' ? '## ' : '### ') : '');
            }
            syncHeadingSelect();
            editorEl.dispatchEvent(new Event('input', { bubbles: true }));
          };
        }

        // 모든 툴바 버튼 mousedown e.preventDefault() & saveRange() -> 블록 선택(Selection) 해제 방지!
        toolbar.querySelectorAll('.memo-tool-btn').forEach(btn => {
          btn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            saveRange();
          });
        });

        toolbar.querySelectorAll('[data-md]').forEach(btn => {
          btn.onclick = (e) => {
            e.preventDefault();
            restoreRange();
            const type = btn.dataset.md;
            if (editorEl.isContentEditable) {
              if (type === 'bold') document.execCommand('bold', false, null);
              else if (type === 'italic') document.execCommand('italic', false, null);
              else if (type === 'underline') document.execCommand('underline', false, null);
              else if (type === 'strike') document.execCommand('strikeThrough', false, null);
              else if (type === 'highlight') document.execCommand('hiliteColor', false, '#fef08a');
              else if (type === 'link') {
                const sel = window.getSelection();
                const selText = sel ? sel.toString().trim() : '';
                const linkRange = (sel && sel.rangeCount) ? sel.getRangeAt(0).cloneRange() : null;
                openLinkInputModal(editorEl, selText, linkRange, saveRange);
                return;
              } else if (type === 'clear') {
                // [서식지우기] 블록 선택 여부에 관계없이 모든 마크다운/인라인 스타일 제거 및 본문 복귀
                const sel = window.getSelection();
                if (sel && sel.rangeCount) {
                  if (!sel.isCollapsed) {
                    // 1. 선택된 블록이 있는 경우
                    document.execCommand('removeFormat', false, null);
                    document.execCommand('unlink', false, null);
                    const range = sel.getRangeAt(0);
                    const container = range.commonAncestorContainer;
                    const parentEl = container.nodeType === Node.ELEMENT_NODE ? container : container.parentElement;
                    if (parentEl && editorEl.contains(parentEl)) {
                      parentEl.querySelectorAll('mark, u, del, s, span, a').forEach(el => {
                        if (range.intersectsNode(el)) {
                          const p = el.parentNode;
                          while (el.firstChild) p.insertBefore(el.firstChild, el);
                          p.removeChild(el);
                        }
                      });
                    }
                  } else {
                    // 2. 커서만 깜빡이는 경우: 현재 커서를 감싸고 있는 인라인 서식 태그 unwrap
                    const range = sel.getRangeAt(0);
                    let curr = range.startContainer;
                    if (curr.nodeType === Node.TEXT_NODE) curr = curr.parentElement;
                    while (curr && curr !== editorEl && !/^(DIV|P|H1|H2|H3)$/i.test(curr.tagName)) {
                      const nextP = curr.parentElement;
                      if (/^(STRONG|B|EM|I|U|DEL|S|MARK|SPAN|A)$/i.test(curr.tagName)) {
                        while (curr.firstChild) nextP.insertBefore(curr.firstChild, curr);
                        nextP.removeChild(curr);
                      }
                      curr = nextP;
                    }
                  }

                  // 3. 현재 줄이 H1~H3라면 일반 본문 div로 복귀
                  let lineBlock = sel.anchorNode;
                  while (lineBlock && lineBlock.parentNode !== editorEl) {

                  }

                    const newDiv = document.createElement('div');
                    newDiv.innerHTML = lineBlock.innerHTML || '<br>';
                    editorEl.replaceChild(newDiv, lineBlock);

                    r.selectNodeContents(newDiv);
                    r.collapse(false);

                    sel.addRange(r);
                  }
                }
              }
              saveRange();
              editorEl.dispatchEvent(new Event('input', { bubbles: true }));
            } else {
              if (type === 'bold') applyMarkdownWrap(editorEl, '**', '**');
              else if (type === 'italic') applyMarkdownWrap(editorEl, '*', '*');
              else if (type === 'underline') applyMarkdownWrap(editorEl, '<u>', '</u>');
              else if (type === 'strike') applyMarkdownWrap(editorEl, '~~', '~~');
              else if (type === 'highlight') applyMarkdownWrap(editorEl, '==', '==');

            }

        });

        const textColorBtn = $(`${prefix}memoTextColorBtn`);
        const textColorPop = $(`${prefix}memoTextColorPop`);
        const bgColorBtn = $(`${prefix}memoBgColorBtn`);
        const bgColorPop = $(`${prefix}memoBgColorPop`);

        if (textColorBtn && textColorPop) {
          textColorBtn.addEventListener('mousedown', (e) => {

            e.preventDefault();
            saveRange();
          });

            e.stopPropagation();

              e.preventDefault();
            });

              e.preventDefault();
              e.stopPropagation();
              restoreRange();

                saveRange();
                editorEl.dispatchEvent(new Event('input', { bubbles: true }));
              } else {
                applyMarkdownWrap(editorEl, `<span style="background-color:${bg}">`, `</span>`);
              }
              bgColorPop.classList.remove('open');
            };
          });
        }

        const specId = prefix ? prefix + 'OpenSpecialCharsBtn' : 'openSpecialCharsBtn';
        const specBtn = $(specId);
        if (specBtn) {
          specBtn.onclick = () => {
            lastActiveTextarea = editorEl;
            saveRange();
            setupSpecialChars();
            $('specialCharModal').showModal();
            safePushModalState('specialCharModal');
          };
        }

        editorEl.onkeydown = (e) => {
          if (e.key === 'Tab') {
            e.preventDefault();
            e.stopPropagation();
            if (e.shiftKey) {
              const prevEl = prefix ? $('recModalTitle') : $('modalLocation');
              if (prevEl) prevEl.focus();
            } else {
              const nextEl = prefix ? $('recModalTags') : $('modalTags');
              if (nextEl) nextEl.focus();
            }
            return;
          }

          if (e.key === 'Backspace' && editorEl.isContentEditable) {
            const sel = window.getSelection();
            if (sel && sel.rangeCount) {
              const range = sel.getRangeAt(0);
              if (range.collapsed) {
                let block = range.startContainer;
                while (block && block.parentNode !== editorEl) {
                  block = block.parentNode;
                }
                // 빈 제목 태그(H1, H2, H3)에서 백스페이스를 누르면 본문 div로 안전하게 복귀
                if (block && /^(H1|H2|H3)$/i.test(block.tagName) && !(block.textContent || '').trim()) {
                  e.preventDefault();
                  const div = document.createElement('div');
                  div.innerHTML = '<br>';
                  editorEl.replaceChild(div, block);
                  const r = document.createRange();
                  r.setStart(div, 0);
                  r.collapse(true);
                  sel.removeAllRanges();
                  sel.addRange(r);
                  saveRange();
                  syncHeadingSelect();
                  editorEl.dispatchEvent(new Event('input', { bubbles: true }));
                  return;
                }
              }
            }
          }

          // [V1.5.3] 내용 입력란에서 Shift+Enter는 즉시 저장, 일반 Enter는 줄바꿈
          if (e.key === 'Enter' && e.shiftKey) {
            e.preventDefault();
            e.stopPropagation();
            if (prefix === 'rec') {
              $('recurringForm')?.requestSubmit();
            } else if (typeof window.__doSaveTask === 'function') {
              window.__doSaveTask();
            }
            return;
          }

          // [핵심] 엔터 줄바꿈 시 이전 줄의 스타일(span, strong, h태그) 상속을 원천 차단하고 깨끗한 새 div 생성!
          if (e.key === 'Enter' && !e.shiftKey && editorEl.isContentEditable) {
            if (e.isComposing) return;
            e.preventDefault();
            e.stopPropagation();
            const sel = window.getSelection();
            if (!sel || !sel.rangeCount) return;
            const range = sel.getRangeAt(0);

            // 현재 커서가 속한 직계 블록 찾기
            let block = range.startContainer;
            while (block && block.parentNode !== editorEl) {
              block = block.parentNode;
            }

            // 0. 빈 제목(H1~H3)에서 엔터를 치면 새 줄 추가 대신 일반 본문(div)으로 변환
            if (block && /^(H1|H2|H3)$/i.test(block.tagName) && !(block.textContent || '').trim()) {
              const div = document.createElement('div');
              div.innerHTML = '<br>';
              editorEl.replaceChild(div, block);
              const r = document.createRange();
              r.setStart(div, 0);
              r.collapse(true);
              sel.removeAllRanges();
              sel.addRange(r);
              saveRange();
              syncHeadingSelect();
              editorEl.dispatchEvent(new Event('input', { bubbles: true }));
              return;
            }

            // 1. 현재 줄이 '# 제목'으로 작성된 상태에서 엔터를 칠 때: 즉시 H 태그로 변환 후 다음 줄은 본문(div)
            if (block && (block.tagName === 'DIV' || block.nodeType === Node.TEXT_NODE)) {
              const lineText = block.textContent || '';
              const hLeadMatch = lineText.match(/^(#{1,3})\s+(.*)$/);
              if (hLeadMatch) {
                const lvl = hLeadMatch[1].length;
                const titleText = hLeadMatch[2];
                const h = document.createElement('h' + lvl);
                h.textContent = titleText || '\u00A0';
                editorEl.replaceChild(h, block);

                const nextDiv = document.createElement('div');
                nextDiv.innerHTML = '<br>';
                h.after(nextDiv);

                const r = document.createRange();
                r.setStart(nextDiv, 0);
                r.collapse(true);
                sel.removeAllRanges();
                sel.addRange(r);
                saveRange();
                syncHeadingSelect();
                editorEl.dispatchEvent(new Event('input', { bubbles: true }));
                return;
              }
            }

            // 2. 일반 엔터 처리: 이전 줄의 서식을 절대 상속하지 않고 깨끗한 새 div 생성
            if (!block || block === editorEl) {
              const newDiv = document.createElement('div');
              newDiv.innerHTML = '<br>';
              editorEl.appendChild(newDiv);
              const r = document.createRange();
              r.setStart(newDiv, 0);
              r.collapse(true);
              sel.removeAllRanges();
              sel.addRange(r);
              saveRange();
              editorEl.dispatchEvent(new Event('input', { bubbles: true }));
              return;
            }

            // 커서 뒷부분 내용 분리
            const afterRange = document.createRange();
            afterRange.setStart(range.endContainer, range.endOffset);
            afterRange.setEnd(block, block.childNodes.length);
            const afterContent = afterRange.extractContents();

            // 만약 현재 블록 앞부분이 비었으면 <br> 넣어주기
            if (!block.textContent && !block.querySelector('img, a, br')) {
              block.innerHTML = '<br>';
            }

            // 새 줄 생성 (H 태그였든, 스타일 span이 있었든 다음 줄은 무조건 일반 div!)
            const nextDiv = document.createElement('div');
            if (afterContent.textContent || afterContent.querySelector('img, a')) {
              nextDiv.appendChild(afterContent);
            } else {
              nextDiv.innerHTML = '<br>';
            }

            block.after(nextDiv);

            const newRange = document.createRange();
            newRange.setStart(nextDiv, 0);
            newRange.collapse(true);
            sel.removeAllRanges();
            sel.addRange(newRange);
            saveRange();
            editorEl.dispatchEvent(new Event('input', { bubbles: true }));
            return;
          }
        };
      }

      function dateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
      function parseDate(s) { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); }
      function validDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && +s.slice(0, 4) >= 1900 && dateStr(parseDate(s)) === s; }
      function today() { return dateStr(new Date()); }
      function iso() { return new Date().toISOString(); }
      function uid() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
      /* 'YYYY-MM-DD' 두 날짜 사이의 일수 (a -> b). 모든 날짜 연산은 parseDate(정오 기준)를 통해 DST/UTC 오차를 피한다 */
      function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
      function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStr(d); }
      function dayDistance(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
      function isWeekday(s) { const n = parseDate(s).getDay(); return n !== 0 && n !== 6; }
      function isWork(t) { return !t.isHoliday || t.holidayHasTask; }

      function makeTask(date) { return { id: uid(), recurringId: null, recurrenceType: null, title: '', memo: '', time: '', location: '', startDate: date, dueDate: date, ddayMode: 'workday', dueTime: '', priority: 'normal', tags: [], completed: false, completedAt: null, completedDate: '', recurrence: 'none', isLunar: false, reminders: [0], hourReminders: [120, 60], isHoliday: false, holidayHasTask: false, createdAt: iso(), updatedAt: iso() }; }
      function blank() { return { version: 2, tasks: [], recurrings: [], notifications: [], settings: { holidays: [], firedReminders: [], importMode: 'merge', desktopNotifications: false }, updatedAt: iso() }; }
      function completionDate(t) { if (validDate(t.completedDate)) return t.completedDate; if (validDate(t.completedAt)) return t.completedAt; if (t.completedAt && typeof t.completedAt === 'string') { const d = new Date(t.completedAt); if (!isNaN(d)) return dateStr(d); } return ''; }

      function normalize(raw) {
        if (!raw || typeof raw !== 'object' || !Array.isArray(raw.tasks)) throw new Error('올바르지 않은 데이터 형식');
        const out = Object.assign(blank(), raw), ids = new Set();

        out.recurrings = Array.isArray(raw.recurrings) ? raw.recurrings.map(r => ({
          id: typeof r.id === 'string' && r.id ? r.id : uid(),
          title: String(r.title || '제목 없는 반복 일정'),
          time: String(r.time || ''),
          location: String(r.location || ''),
          memo: String(r.memo || ''),
          tags: Array.isArray(r.tags) ? r.tags.map(String) : [],
          startDate: validDate(r.startDate) ? r.startDate : (validDate(r.dueDate) ? r.dueDate : today()),
          dueDate: validDate(r.dueDate) ? r.dueDate : (validDate(r.startDate) ? r.startDate : today()),
          endDate: validDate(r.endDate) ? r.endDate : '',
          dueTime: String(r.dueTime || ''),
          ddayMode: r.ddayMode === 'calendar' ? 'calendar' : 'workday',
          priority: Object.hasOwn(PRIORITY, r.priority) ? r.priority : 'normal',
          recurrence: (['weekly', 'monthly', 'yearly'].includes(r.recurrence) || (!isNaN(Number(r.recurrence)) && Number(r.recurrence) > 0)) ? r.recurrence : 'weekly',
          isLunar: !!r.isLunar,
          reminders: Array.isArray(r.reminders) ? [...new Set([0, ...r.reminders.map(Number)])].filter(n => !isNaN(n) && n >= 0).sort((a, b) => a - b) : [0, 3],
          hourReminders: Array.isArray(r.hourReminders) ? [...new Set(r.hourReminders.map(Number))].filter(n => !isNaN(n) && n > 0).sort((a, b) => b - a) : [120, 60],
          isHoliday: !!r.isHoliday,
          holidayHasTask: !!r.holidayHasTask,
          deletedDates: Array.isArray(r.deletedDates) ? [...new Set(r.deletedDates.map(String))].filter(validDate) : [],
          createdAt: r.createdAt || iso(),
          updatedAt: r.updatedAt || iso()
        })) : [];

        // Legacy migration: if any raw task has recurrence and not yet in recurrings
        raw.tasks.forEach(r => {
          if (r && r.recurrence && r.recurrence !== 'none' && !r.recurringId) {
            let found = out.recurrings.find(x => x.title === r.title && x.recurrence === r.recurrence);
            if (!found) {
              found = {
                id: uid(),
                title: String(r.title || '반복 일정'),
                memo: String(r.memo || ''),
                tags: Array.isArray(r.tags) ? r.tags.map(String) : [],
                startDate: validDate(r.startDate) ? r.startDate : (validDate(r.dueDate) ? r.dueDate : today()),
                dueDate: validDate(r.dueDate) ? r.dueDate : today(),
                endDate: '',
                dueTime: String(r.dueTime || ''),
                ddayMode: r.ddayMode === 'calendar' ? 'calendar' : 'workday',
                priority: Object.hasOwn(PRIORITY, r.priority) ? r.priority : 'normal',
                recurrence: ['weekly', 'monthly', 'yearly'].includes(r.recurrence) ? r.recurrence : 'weekly',
                isLunar: !!r.isLunar,
                reminders: Array.isArray(r.reminders) ? [...new Set([0, ...r.reminders.map(Number)])].filter(n => !isNaN(n) && n >= 0).sort((a, b) => a - b) : [0, 3],
          hourReminders: Array.isArray(r.hourReminders) ? [...new Set(r.hourReminders.map(Number))].filter(n => !isNaN(n) && n > 0).sort((a, b) => b - a) : [120, 60],
                isHoliday: !!r.isHoliday,
                holidayHasTask: !!r.holidayHasTask,
                deletedDates: [],
                createdAt: r.createdAt || iso(),
                updatedAt: iso()
              };
              out.recurrings.push(found);
            }
            r.recurringId = found.id;
            r.recurrenceType = r.recurrence;
            r.recurrence = 'none';
          }
        });

        out.tasks = raw.tasks.map((r) => {
          if (!r || !validDate(r.dueDate)) throw new Error('마감일 오류');
          const t = Object.assign(makeTask(r.dueDate), r);
          t.id = typeof r.id === 'string' && r.id ? r.id : uid();
          if (ids.has(t.id)) throw new Error('중복 ID'); ids.add(t.id);
          t.recurringId = typeof r.recurringId === 'string' ? r.recurringId : null;
          t.recurrenceType = typeof r.recurrenceType === 'string' ? r.recurrenceType : (r.recurrence && r.recurrence !== 'none' ? r.recurrence : null);
          t.title = String(r.title || '제목 없는 일정'); t.time = String(r.time || ''); t.location = String(r.location || ''); t.memo = String(r.memo || ''); t.tags = Array.isArray(r.tags) ? r.tags.map(String) : [];
          t.startDate = validDate(r.startDate) ? r.startDate : t.dueDate;
          t.ddayMode = r.ddayMode === 'calendar' ? 'calendar' : 'workday';
          t.isLunar = !!r.isLunar;
          t.dueTime = String(r.dueTime || ''); t.priority = Object.hasOwn(PRIORITY, r.priority) ? r.priority : 'normal';
          t.recurrence = 'none';
          const rem = r.reminders === undefined ? [0, 3] : r.reminders;
          t.reminders = [...new Set([0, ...rem.map(Number)])].filter(n => !isNaN(n) && n >= 0).sort((a, b) => a - b);
          t.hourReminders = Array.isArray(r.hourReminders) ? [...new Set(r.hourReminders.map(Number))].filter(n => !isNaN(n) && n > 0).sort((a, b) => b - a) : [120, 60];
          t.completed = !!r.completed; t.completedDate = t.completed ? completionDate(r) : ''; t.completedAt = t.completed ? (r.completedAt || null) : null;
          t.isHoliday = !!r.isHoliday; t.holidayHasTask = t.isHoliday && !!r.holidayHasTask;
          return t;
        });
        out.settings = Object.assign(blank().settings, raw.settings && typeof raw.settings === 'object' ? raw.settings : {});
        out.settings.holidays = [...new Set(out.settings.holidays)]; out.settings.firedReminders = Array.isArray(out.settings.firedReminders) ? out.settings.firedReminders : [];
        out.notifications = Array.isArray(raw.notifications) ? raw.notifications : []; out.version = 2; return out;
      }

      /* 반복 일정 날짜 계산 */
      function getDatesForRule(rule, startStr, endStr) {
        const results = [];
        const rec = rule.recurrence;
        const start = rule.startDate || rule.dueDate;
        if (!start) return results;

        const ruleEnd = rule.endDate || '';
        const limitEnd = (ruleEnd && ruleEnd < endStr) ? ruleEnd : endStr;

        const effectiveStart = start > startStr ? start : startStr;
        if (effectiveStart > limitEnd) return results;

        // 음력 반복 계산
        if (rule.isLunar && lunarConverter) {
          const sObj = parseDate(start);
          lunarConverter.setSolarDate(sObj.getFullYear(), sObj.getMonth() + 1, sObj.getDate());
          const lCal = lunarConverter.getLunarCalendar();
          const targetLM = lCal.month;
          const targetLD = lCal.day;
          const isInter = !!lCal.intercalation;

          const sYear = parseDate(effectiveStart).getFullYear();
          const eYear = parseDate(limitEnd).getFullYear();

          if (rec === 'yearly') {
            for (let ly = sYear - 1; ly <= eYear + 1; ly++) {
              let ok = lunarConverter.setLunarDate(ly, targetLM, targetLD, isInter);
              if (!ok && targetLD === 30) {
                ok = lunarConverter.setLunarDate(ly, targetLM, 29, isInter);
              }
              if (ok) {
                const sol = lunarConverter.getSolarCalendar();
                const cur = `${sol.year}-${pad(sol.month)}-${pad(sol.day)}`;
                if (cur >= start && cur >= startStr && cur <= limitEnd) {
                  results.push(cur);
                }
              }
            }
            return results;
          } else if (rec === 'monthly') {
            for (let ly = sYear - 1; ly <= eYear + 1; ly++) {
              for (let lm = 1; lm <= 12; lm++) {
                let ok = lunarConverter.setLunarDate(ly, lm, targetLD, false);
                if (!ok && targetLD === 30) {
                  ok = lunarConverter.setLunarDate(ly, lm, 29, false);
                }
                if (ok) {
                  const sol = lunarConverter.getSolarCalendar();
                  const cur = `${sol.year}-${pad(sol.month)}-${pad(sol.day)}`;
                  if (cur >= start && cur >= startStr && cur <= limitEnd) {
                    results.push(cur);
                  }
                }
              }
            }
            return results;
          }
        }

        if (rec === 'daily') {
          let cur = effectiveStart;
          while (cur <= limitEnd) {
            results.push(cur);
            cur = addDays(cur, 1);
          }
        } else if (rec === 'weekly') {
          const targetDay = parseDate(start).getDay();
          let cur = effectiveStart;
          while (parseDate(cur).getDay() !== targetDay) {
            cur = addDays(cur, 1);
          }
          while (cur <= limitEnd) {
            if (cur >= start) results.push(cur);
            cur = addDays(cur, 7);
          }
        } else if (rec === 'monthly') {
          const anchorDay = parseDate(start).getDate();
          const sDate = parseDate(effectiveStart);
          const eDate = parseDate(limitEnd);
          let y = sDate.getFullYear();
          let m = sDate.getMonth();
          const endY = eDate.getFullYear();
          const endM = eDate.getMonth();

          while (y < endY || (y === endY && m <= endM)) {
            const lastDayInMonth = new Date(y, m + 1, 0).getDate();
            const actualDay = Math.min(anchorDay, lastDayInMonth);
            const cur = `${y}-${pad(m + 1)}-${pad(actualDay)}`;
            if (cur >= start && cur >= startStr && cur <= limitEnd) {
              results.push(cur);
            }
            m++;
            if (m > 11) { m = 0; y++; }
          }
        } else if (rec === 'yearly') {
          const dObj = parseDate(start);
          const targetM = dObj.getMonth();
          const targetD = dObj.getDate();
          const sYear = parseDate(effectiveStart).getFullYear();
          const eYear = parseDate(limitEnd).getFullYear();

          for (let y = sYear; y <= eYear; y++) {
            const lastDayInMonth = new Date(y, targetM + 1, 0).getDate();
            const actualDay = Math.min(targetD, lastDayInMonth);
            const cur = `${y}-${pad(targetM + 1)}-${pad(actualDay)}`;
            if (cur >= start && cur >= startStr && cur <= limitEnd) {
              results.push(cur);
            }
          }
        } else if (!isNaN(Number(rec)) && Number(rec) > 0) {
          const step = Math.floor(Number(rec));
          let cur = start;
          while (cur < effectiveStart) {
            cur = addDays(cur, step);
          }
          while (cur <= limitEnd) {
            if (cur >= start && cur >= startStr) results.push(cur);
            cur = addDays(cur, step);
          }
        }
        return results;
      }

      /* 반복 일정 데이터를 바탕으로 해당 기간의 개별 신규 일정 자동 생성 및 저장 */
      function syncRecurringInstances(startStr, endStr) {
        if (!data.recurrings || !data.recurrings.length) return false;
        let changed = false;
        const existingKeys = new Set();
        for (const t of data.tasks) {
          if (t.recurringId) existingKeys.add(`${t.recurringId}_${t.dueDate}`);
        }

        for (const rule of data.recurrings) {
          const dates = getDatesForRule(rule, startStr, endStr);
          const deleted = new Set(rule.deletedDates || []);
          const span = Math.max(0, dayDistance(rule.startDate || rule.dueDate, rule.dueDate || rule.startDate));
          for (const dStr of dates) {
            if (deleted.has(dStr)) continue;
            const targetDue = span > 0 ? addDays(dStr, span) : dStr;
            const key = `${rule.id}_${targetDue}`;
            if (!existingKeys.has(key)) {
              data.tasks.push({
                id: uid(),
                recurringId: rule.id,
                recurrenceType: rule.recurrence,
                recurrence: 'none',
                title: rule.title,
                memo: rule.memo,
                startDate: dStr,
                dueDate: targetDue,
                dueTime: rule.dueTime || '',
                ddayMode: rule.ddayMode || 'workday',
                priority: rule.priority,
                tags: [...(rule.tags || [])],
                completed: false,
                completedAt: null,
                completedDate: '',
                isLunar: !!rule.isLunar,
                reminders: [...(rule.reminders || [0])],
                isHoliday: !!rule.isHoliday,
                holidayHasTask: !!rule.holidayHasTask,
                createdAt: iso(),
                updatedAt: iso()
              });
              existingKeys.add(key);
              changed = true;
            }
          }
        }
        if (changed) commit(data, true);
        return changed;
      }

      function getTasksForDate(targetDate) {
        return data.tasks.filter(t => {
          const start = t.startDate || t.dueDate;
          const end = t.dueDate;
          return targetDate >= start && targetDate <= end;
        });
      }

      function getUpcomingTasks(base = today()) {
        return data.tasks.filter(t => isWork(t) && !t.completed && (t.dueDate >= base || overdue(t, base)));
      }

      let data = blank(), storageBlocked = false, holidayCache = new Set();
      const initial = new Date();
      const ui = {
        year: initial.getFullYear(), month: initial.getMonth(), selected: dateStr(initial),
        view: 'calendar', search: '', priority: 'all',
        filterYear: String(initial.getFullYear()), filterMonth: String(initial.getMonth()),
        ddayFilter: 'all', listSelectedTask: null, hideCompleted: false
      };

      function rebuildHolidays() { holidayCache = new Set([...Object.keys(BUILTIN_HOLIDAYS), ...data.settings.holidays, ...data.tasks.filter(t => t.isHoliday).map(t => t.dueDate)]); }

      function workdays(a, b, holidays = holidayCache) {
        if (a === b) return 0; if (a > b) return -workdays(b, a, holidays);
        const total = dayDistance(a, b), weeks = Math.floor(total / 7); let count = weeks * 5;
        for (let i = 1; i <= total % 7; i++) { if (isWeekday(addDays(a, weeks * 7 + i))) count++; }
        for (const h of holidays) { if (h > a && h <= b && isWeekday(h)) count--; }
        return count;
      }

      /* 개별 일정 마감일 계산: 공휴일에 잡힌 일정은 해당 일정에 한해 그날을 평일로 간주하여 계산 */
      function taskWorkdays(t, base = today(), holidays = holidayCache) {
        if (t && typeof t === 'object' && t.ddayMode === 'calendar') {
          return dayDistance(base, t.dueDate);
        }
        const due = typeof t === 'string' ? t : t.dueDate;
        if (base === due) return 0;
        if (base > due) {
          const total = dayDistance(due, base), weeks = Math.floor(total / 7);
          let count = weeks * 5;
          for (let i = 1; i <= total % 7; i++) { if (isWeekday(addDays(due, weeks * 7 + i))) count++; }
          for (const h of holidays) { if (h > due && h <= base && isWeekday(h)) count--; }
          return -count;
        } else {
          const total = dayDistance(base, due), weeks = Math.floor(total / 7);
          let count = weeks * 5;
          for (let i = 1; i <= total % 7; i++) { if (isWeekday(addDays(base, weeks * 7 + i))) count++; }
          if (!isWeekday(due)) count++;
          /* 공휴일 당일 업무 일정은 해당 일정에 한해 평일로 인정: due 당일의 공휴일은 차감하지 않고 이전 공휴일(h < due)만 차감 */
          for (const h of holidays) { if (h > base && h < due && isWeekday(h)) count--; }
          return count;
        }
      }

      function reminderDate(due, n, holidays = holidayCache) {
        let d = due;
        for (let count = 0; count < n;) {
          d = addDays(d, -1);
          if (isWeekday(d) && !holidays.has(d)) count++;
        }
        return d;
      }

      function overdue(t, base = today()) { return t.dueDate < base; }

      /* UNIFIED D-DAY GROUPING FUNCTION: ddaythree / ddayfive / ddayten / rest / done / holiday */
      function group(t, base = today()) {
        if (!isWork(t)) return 'holiday';
        if (t.completed) return 'done';
        const n = taskWorkdays(t, base);
        if (n <= 3) return 'ddaythree';
        if (n <= 5) return 'ddayfive';
        if (n <= 10) return 'ddayten';
        return 'rest';
      }

      function ddayBadgeText(t, base = today()) {
        if (!isWork(t)) return '공휴일';
        if (t.completed) return '완료';
        const n = taskWorkdays(t, base);
        if (n < 0) return `지연 D+${Math.abs(n)}`;
        if (n === 0) return 'D-Day';
        return `D-${n}`;
      }

      function calendarTaskSort(a, b) {
        return Number(isWork(a)) - Number(isWork(b)) ||
          Number(a.completed) - Number(b.completed) ||
          RANK[a.priority] - RANK[b.priority] ||
          ((a.order ?? 9999) - (b.order ?? 9999)) ||
          a.dueDate.localeCompare(b.dueDate) ||
          a.title.localeCompare(b.title, 'ko');
      }

      function listTaskSort(a, b) {
        const base = today();
        const nA = isWork(a) ? taskWorkdays(a, base) : 999999;
        const nB = isWork(b) ? taskWorkdays(b, base) : 999999;
        return Number(isWork(a)) - Number(isWork(b)) ||
          Number(a.completed) - Number(b.completed) ||
          nA - nB ||
          RANK[a.priority] - RANK[b.priority] ||
          ((a.order ?? 9999) - (b.order ?? 9999)) ||
          a.dueDate.localeCompare(b.dueDate) ||
          a.title.localeCompare(b.title, 'ko');
      }

      /* ----- 백업 넛지: 일정 5건 이상 & 마지막 JSON 백업 7일 경과 ----- */
      const BACKUP_KEY = 'todoCalendar.lastBackupDate';
      function readLastBackup() { try { const v = storageGet(BACKUP_KEY); return validDate(v) ? v : ''; } catch (e) { return ''; } }
      function saveLastBackup() { try { storageSet(BACKUP_KEY, today()); } catch (e) { console.warn(e); } }
      function isBackupNudgeDue() {
        if ((data.tasks || []).length < 5) return false;
        const last = readLastBackup();
        return !last || daysBetween(last, today()) >= 7;
      }

      
      /* [V1.7.0] Zen 커스텀 모달 다이얼로그 시스템 (브라우저 기본 confirm/alert 완전 대체) */
      function appConfirm({ title = 'MY 일정관리', message = '', confirmText = '확인', cancelText = '취소', isDanger = false } = {}) {

            modal.style.maxWidth = '90vw';

          }
          modal.innerHTML = `

              <div class="modal-head" style="padding:14px 18px 12px; display:flex; align-items:center; gap:8px; border-bottom:1px solid #f1f5f9; background:#ffffff;">
                <div style="width:26px; height:26px; border-radius:7px; background:#eef2ff; display:flex; align-items:center; justify-content:center; color:#4f46e5; flex-shrink:0;">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <h3 style="margin:0; font-size:14px; font-weight:700; color:#0f172a; flex:1;">${esc(title)}</h3>

                <button type="button" id="appConfirmOkBtn" class="btn" style="height:32px; padding:0 18px; font-size:12.5px; font-weight:700; background:${isDanger ? '#ef4444' : '#4f46e5'}; border:1px solid ${isDanger ? '#dc2626' : '#4338ca'}; color:#ffffff; border-radius:10px; box-shadow:0 2px 6px rgba(79,70,229,0.28); cursor:pointer;">${esc(confirmText)}</button>

      }

      function appAlert(message, title = 'MY 일정관리') {
        toast(typeof message === 'string' ? message.replace(/<[^>]*>/g, '') : String(message));
      }

      function toast(message) {
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><polyline points="20 6 9 17 4 12"/></svg><span>${esc(message)}</span>`;
        $('toasts').append(el);
        setTimeout(() => {
          el.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
          el.style.opacity = '0';
          el.style.transform = 'scale(0.95)';
          setTimeout(() => el.remove(), 250);
        }, 3200);
      }

      function commit(next, silent = false) {
        next.updatedAt = iso();
        const key = getCurrentKey();
        data = next;
        rebuildHolidays();
        storageSet(key, JSON.stringify(next));
        if (!silent && typeof markLocalCloudModified === 'function') {
          markLocalCloudModified();
        }
        return true;
      }

      function getHolidayOrFestivalInfo(s) {
        if (!s) return null;
        let hol = BUILTIN_HOLIDAYS[s];
        if (hol) return { name: hol.replace(/대체공휴일\(/g, '대체('), isHoliday: true };
        const customHol = (data.tasks || []).find(t => t.dueDate === s && t.isHoliday);
        if (customHol) return { name: (customHol.title || '공휴일').replace(/대체공휴일\(/g, '대체('), isHoliday: true };
        if (lunarConverter) {
          try {
            const d = parseDate(s);
            lunarConverter.setSolarDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
            const lDate = lunarConverter.getLunarCalendar();
            if (!lDate.intercalation) {
              const lm = lDate.month;
              const ld = lDate.day;
              if (lm === 1 && ld === 15) return { name: '정월대보름', isHoliday: false };
              if (lm === 3 && ld === 3) return { name: '삼짇날', isHoliday: false };
              if (lm === 5 && ld === 5) return { name: '단오', isHoliday: false };
              if (lm === 6 && ld === 15) return { name: '유두', isHoliday: false };
              if (lm === 7 && ld === 7) return { name: '칠석', isHoliday: false };
              if (lm === 7 && ld === 15) return { name: '백중', isHoliday: false };
              if (lm === 9 && ld === 9) return { name: '중양절', isHoliday: false };
            }
          } catch (e) { }
        }
        return null;
      }

      function getHolidayOrFestivalName(s) {
        const info = getHolidayOrFestivalInfo(s);
        return info ? info.name : '';
      }

      function updateClock() {
        const d = new Date();
        const curToday = today();
        const datePart = `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}.(${WEEK[d.getDay()]})`;
        const timePart = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
        const info = getHolidayOrFestivalInfo(curToday);

        const el = $('clockText');
        if (el) {
          let tagSpan = '';
          if (info) {
            const cls = info.isHoliday ? 'clock-holiday' : 'clock-lunar';
            tagSpan = ` <span class="${cls}">${esc(info.name)}</span>`;
          }
          el.innerHTML = `<span class="clock-date">${datePart}</span> <span class="clock-time">${timePart}</span>${tagSpan}`;
        }
      }

      function scanNotifications() {
        if (storageBlocked) return;
        const date = today();
        const fired = new Set(data.settings.firedReminders || []);
        const found = [];
        const keys = [];

        for (const t of data.tasks) {
          if (!isWork(t) || t.completed) continue;
          for (const n of t.reminders) {
            if (reminderDate(t.dueDate, n) === date) {
              const key = ['rem', t.id, t.dueDate, n, date].join('|');
              if (!fired.has(key)) {
                keys.push(key);
                found.push({ task: t, desc: n === 0 ? '당일 마감' : `${n}일 전 알림` });
              }
            }
          }
          if (overdue(t)) {
            const key = ['late', t.id, t.dueDate].join('|'); // 일정당 단 1회
            if (!fired.has(key)) {
              keys.push(key);
              found.push({ task: t, desc: '기한 지남' });
            }
          }
        }

        if (!keys.length) return;

        const next = clone(data);
        next.settings.firedReminders = [...next.settings.firedReminders, ...keys].slice(-2000);

        const count = found.length;
        const title = `확인할 일정 ${count}건`;
        const message = found.slice(0, 3).map(f => `${f.task.title} (${f.desc})`).join(', ') + (count > 3 ? ` 외 ${count - 3}건` : '');

        next.notifications.push({
          id: uid(),
          title,
          message,
          taskIds: found.map(f => f.task.id),
          createdAt: iso(),
          read: false
        });
        next.notifications = next.notifications.slice(-100);

        if (commit(next, true)) {
          $('notificationCount').textContent = next.notifications.filter(n => !n.read).length;
          toast(`알림: ${title}`);

        }
      }

      function renderTaskPrefixTags(t) {
        if (!isWork(t)) return '';
        let tags = '';
        if (t.priority === 'high') {
          tags += '<span class="tag-high">[H]</span>';
        }
        const isMulti = t.startDate && t.dueDate && t.startDate < t.dueDate;
        if (isMulti) {
          const parts = t.dueDate.split('-');
          const m = parseInt(parts[1], 10);
          const d = parseInt(parts[2], 10);
          tags += `<span class="tag-period">[${m}/${d}]</span>`;
        }
        const recType = t.recurrenceType || (t.recurrence && t.recurrence !== 'none' ? t.recurrence : '');
        if (recType) {
          const rLabel = t.isLunar ? (recType === 'yearly' ? '음력 매년' : `음력 ${RECURRENCE[recType] || (recType + '일마다')}`) : (RECURRENCE[recType] || (recType + '일마다'));
          tags += `<span class="tag-recurring">[${rLabel}]</span>`;
        }
        return tags;
      }

      function insertCharIntoTextarea(textarea, ch) {
        if (!textarea) return;
        textarea.focus();
        if (textarea.isContentEditable) {
          const sel = window.getSelection();
          if (lastActiveEditorRange) {
            try {
              sel.removeAllRanges();
              sel.addRange(lastActiveEditorRange);
            } catch (err) {}
          }
          if (sel && sel.rangeCount > 0 && textarea.contains(sel.anchorNode)) {
            const range = sel.getRangeAt(0);
            range.deleteContents();
            const tn = document.createTextNode(ch);
            range.insertNode(tn);
            range.setStartAfter(tn);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
            lastActiveEditorRange = range.cloneRange();
          } else {
            const tn = document.createTextNode(ch);
            textarea.appendChild(tn);
            const r = document.createRange();
            r.setStartAfter(tn);
            r.collapse(true);
            sel.removeAllRanges();
            sel.addRange(r);
            lastActiveEditorRange = r.cloneRange();
          }
          textarea.dispatchEvent(new Event('input', { bubbles: true }));
          return;
        }
        const start = textarea.selectionStart || 0;
        const end = textarea.selectionEnd || 0;
        const val = textarea.value;
        textarea.value = val.substring(0, start) + ch + val.substring(end);
        textarea.selectionStart = textarea.selectionEnd = start + ch.length;
        textarea.dispatchEvent(new Event('input'));
      }

      function setupTextareaDragResizer(handleEl, textareaEl) {
        if (!handleEl || !textareaEl) return;
        let isDragging = false;
        let startY = 0;
        let startH = 0;

        handleEl.onmousedown = (e) => {
          isDragging = true;
          startY = e.clientY;
          startH = textareaEl.offsetHeight;
          document.body.style.cursor = 'ns-resize';
          document.body.style.userSelect = 'none';
          e.preventDefault();
        };

        const onMouseMove = (e) => {
          if (!isDragging) return;
          const diff = e.clientY - startY;
          const newH = Math.max(48, startH + diff);
          textareaEl.style.height = newH + 'px';
        };

        const onMouseUp = () => {
          if (!isDragging) return;
          isDragging = false;
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        };

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      }

      function renderCalendar() {
        updateClock();

        const years = new Set([initial.getFullYear(), ui.year, ...data.tasks.map(t => +t.dueDate.slice(0, 4))]);
        for (let y = ui.year - 5; y <= ui.year + 5; y++) years.add(y);
        $('yearSelect').innerHTML = [...years].sort((a, b) => a - b).map(y => `<option value="${y}" ${y === ui.year ? 'selected' : ''}>${y}년</option>`).join('');
        $('monthSelect').innerHTML = Array.from({ length: 12 }, (_, i) => `<option value="${i}" ${i === ui.month ? 'selected' : ''}>${i + 1}월</option>`).join('');

        const first = new Date(ui.year, ui.month, 1, 12);
        first.setDate(1 - first.getDay());
        const lastCellDate = new Date(first);
        lastCellDate.setDate(first.getDate() + 41);
        const startRange = dateStr(first), endRange = dateStr(lastCellDate);

        // 해당 캘린더 화면(42개 셀)의 반복 일정 인스턴스 자동 생성 및 저장
        syncRecurringInstances(startRange, endRange);

        const byDate = new Map();
        for (const t of data.tasks) {
          if (ui.hideCompleted && t.completed) continue;
          const tStart = t.startDate || t.dueDate;
          const tEnd = t.dueDate;
          if (tStart <= endRange && tEnd >= startRange) {
            const curStart = tStart < startRange ? startRange : tStart;
            const curEnd = tEnd > endRange ? endRange : tEnd;
            let cur = curStart;
            while (cur <= curEnd) {
              if (!byDate.has(cur)) byDate.set(cur, []);
              byDate.get(cur).push(t);
              cur = addDays(cur, 1);
            }
          }
        }

        let html = '';
        for (let i = 0; i < 42; i++) {
          const d = new Date(first);
          d.setDate(first.getDate() + i);
          const s = dateStr(d);
          const tasks = (byDate.get(s) || []).sort(calendarTaskSort);
          const dayOfWeek = d.getDay();
          const isSunday = dayOfWeek === 0;
          const isSaturday = dayOfWeek === 6;
          const isHoliday = holidayCache.has(s);
          // holiday-day class: makes non-Sunday holidays show red date number via CSS
          const holidayDayClass = (isHoliday && !isSunday) ? 'holiday-day' : '';

          let extraHeaderText = '';
          const builtinHolidayName = BUILTIN_HOLIDAYS[s];
          if (builtinHolidayName) {
            extraHeaderText = `<span class="holiday-name-text" title="${builtinHolidayName}">${builtinHolidayName}</span>`;
          } else if (lunarConverter) {
            try {
              lunarConverter.setSolarDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
              const lDate = lunarConverter.getLunarCalendar();
              const isInter = !!lDate.intercalation;
              const lm = lDate.month;
              const ld = lDate.day;

              let traditionalFestival = '';
              if (!isInter) {
                if (lm === 1 && ld === 15) traditionalFestival = '정월대보름';
                else if (lm === 3 && ld === 3) traditionalFestival = '삼짇날';
                else if (lm === 5 && ld === 5) traditionalFestival = '단오';
                else if (lm === 6 && ld === 15) traditionalFestival = '유두';
                else if (lm === 7 && ld === 7) traditionalFestival = '칠석';
                else if (lm === 7 && ld === 15) traditionalFestival = '백중';
                else if (lm === 9 && ld === 9) traditionalFestival = '중양절';
              }

              if (traditionalFestival) {
                extraHeaderText = `<span class="lunar-text" title="${traditionalFestival}">${traditionalFestival}</span>`;
              } else if (isSunday) {
                extraHeaderText = `<span class="lunar-text">${lDate.month}. ${lDate.day}</span>`;
              }
            } catch (e) { }
          }

          html += `<div class="day ${d.getMonth() !== ui.month ? 'outside' : ''} ${s === today() ? 'today' : ''} ${s === ui.selected ? 'selected' : ''} ${isSunday || isHoliday ? 'sunday' : ''} ${isSaturday ? 'saturday' : ''} ${holidayDayClass}" data-date="${s}" data-action="select">
            <div class="day-header">
              <div class="day-number">${d.getDate()}</div>
              ${extraHeaderText}
            </div>`;
          /* [V1.1.2] 기간 일정 2px 슬림 연속 실선(박스 배경 제거) + 단일 일정 분리 렌더링 */
          const multiList = tasks.filter(t => t.startDate && t.dueDate && t.startDate < t.dueDate);
          const singleList = tasks.filter(t => !t.startDate || !t.dueDate || t.startDate >= t.dueDate);

          const multiTasksInScope = data.tasks.filter(t => t.startDate && t.dueDate && t.startDate < t.dueDate);
          multiList.sort((a, b) => multiTasksInScope.indexOf(a) - multiTasksInScope.indexOf(b));

          let renderedCount = 0;
          const maxCellItems = 4;

          // 1. 기간 일정: 2px 슬림 연속 실선 렌더링 (박스 없음, 텍스트는 초일/말일만)
          multiList.forEach(t => {
            if (renderedCount >= maxCellItems) return;
            const colorIdx = multiTasksInScope.indexOf(t);
            const color = PERIOD_PALETTE[colorIdx >= 0 ? (colorIdx % PERIOD_PALETTE.length) : 0];
            const isStart = (s === t.startDate);
            const isEnd = (s === t.dueDate);
            const checkPrefix = t.completed ? '✓ ' : '';

            if (isStart && isEnd) {
              html += `<div class="period-track-row" title="${esc(t.title)} (${t.startDate}~${t.dueDate})">
                <span class="period-track-arrow" style="color:${color.line};">&lt;</span>
                <span class="period-track-text" style="color:${color.line};">${checkPrefix}${esc(t.title)}</span>
                <span class="period-track-arrow" style="color:${color.line};">&gt;</span>
              </div>`;
            } else if (isStart) {
              // 초일: < + 제목 + 오른쪽 셀로 이어지는 2px 실선
              html += `<div class="period-track-row start" title="${esc(t.title)} (${t.startDate}~${t.dueDate})">
                <span class="period-track-arrow" style="color:${color.line};">&lt;</span>
                <span class="period-track-text" style="color:${color.line};">${checkPrefix}[${t.dueDate.slice(5)}] ${esc(t.title)}</span>
                <div class="period-track-line" style="background:${color.line};"></div>
              </div>`;
            } else if (isEnd) {
              // 말일: 왼쪽 셀에서 이어지는 2px 실선 + 제목 + >
              html += `<div class="period-track-row end" title="${esc(t.title)} (${t.startDate}~${t.dueDate})">
                <div class="period-track-line" style="background:${color.line};"></div>
                <span class="period-track-text" style="color:${color.line};">${checkPrefix}${esc(t.title)}</span>
                <span class="period-track-arrow" style="color:${color.line};">&gt;</span>
              </div>`;
            } else {
              // 중간일: 텍스트 없이 셀 전체를 꽉 채워 다음 셀과 딱 붙는 2px 실선만!
              html += `<div class="period-track-row mid" title="${esc(t.title)} (${t.startDate}~${t.dueDate})">
                <div class="period-track-line" style="background:${color.line};"></div>
              </div>`;
            }
            renderedCount++;
          });

          // 2. 단일 일정 칩 렌더링
          singleList.forEach(t => {
            if (renderedCount >= maxCellItems) return;
            const isHol = !isWork(t);
            const priClass = isHol ? 'pri-holiday' : `pri-${t.priority || 'normal'}`;
            const checkPrefix = t.completed ? '✓ ' : '';
            const prefixTags = renderTaskPrefixTags(t);
            html += `<div class="chip ${priClass} ${t.completed ? 'done' : ''}" data-action="edit" data-id="${t.id}" title="${esc(t.title)}" style="${t.titleColor ? `color:${t.titleColor} !important;` : ''}">${checkPrefix}${prefixTags}${esc(t.title)}</div>`;
            renderedCount++;
          });

          if (tasks.length > maxCellItems) {
            html += `<div class="more" data-action="openDayMore" data-date="${s}">+${tasks.length - maxCellItems}개 더보기</div>`;
          }
          html += `</div>`;
        }
        $('calendar').innerHTML = html;
      }

      /* 기간 일정 진척도 계산 및 미니 프로그레스 바 렌더링 */
      function getTaskPeriodProgress(t, base = today()) {
        if (!t || !t.startDate || !t.dueDate || t.startDate >= t.dueDate) return null;
        const s = new Date(t.startDate + 'T00:00:00');
        const e = new Date(t.dueDate + 'T00:00:00');
        const b = new Date(base + 'T00:00:00');
        const totalDays = Math.round((e - s) / 86400000) + 1;
        if (totalDays <= 1) return null;

        if (t.completed) {
          return { percent: 100, text: '완료됨', status: 'done', totalDays, elapsedDays: totalDays };
        }

        if (b < s) {
          const waitDays = Math.round((s - b) / 86400000);
          return { percent: 0, text: `대기 (시작 D-${waitDays})`, status: 'waiting', totalDays, elapsedDays: 0 };
        } else if (b > e) {
          const overDays = Math.round((b - e) / 86400000);
          return { percent: 100, text: `기간종료 (${overDays}일 지연)`, status: 'overdue', totalDays, elapsedDays: totalDays + overDays };
        } else {
          const elapsedDays = Math.round((b - s) / 86400000) + 1;
          const pct = Math.min(100, Math.max(1, Math.round((elapsedDays / totalDays) * 100)));
          return { percent: pct, text: `${pct}% 진행 (${elapsedDays}/${totalDays}일)`, status: 'ongoing', totalDays, elapsedDays };
        }
      }

      function renderPeriodProgressBar(t, base = today()) {
        const prog = getTaskPeriodProgress(t, base);
        if (!prog) return '';
        return `<div class="period-progress-wrap" title="전체 ${prog.totalDays}일 중 ${prog.elapsedDays}일차 (${prog.percent}%)">
          <div class="period-progress-bar">
            <div class="period-progress-fill ${prog.status}" style="width: ${prog.percent}%;"></div>
          </div>
          <span class="period-progress-text ${prog.status}">${prog.text}</span>
        </div>`;
      }

      function taskRow(t, base = today(), inList = false) {
        const g = group(t, base);
        const dText = ddayBadgeText(t, base);
        const isHol = !isWork(t);
        const priClass = isHol ? 'pri-holiday' : `pri-${t.priority || 'normal'}`;
        const isSelected = inList && ui.listSelectedTask === t.id;
        const priShort = { high: 'High', normal: 'Normal', low: 'Low' }[t.priority] || 'Normal';
        const isMulti = t.startDate && t.dueDate && t.startDate < t.dueDate;
        const dateRangeStr = isMulti ? `${t.startDate.slice(5)}~${t.dueDate.slice(5)}` : '';
        const listDateStr = isMulti
          ? `${t.startDate.slice(5).replace('-', '.')}~${t.dueDate.slice(5).replace('-', '.')}`
          : (t.dueDate || t.startDate || '').slice(5).replace('-', '.');
        const prefixTags = renderTaskPrefixTags(t);
        const progBar = isMulti && isWork(t) ? renderPeriodProgressBar(t, base) : '';
        const canDrag = !inList && isWork(t) && !t.completed;
        return `<div class="task-row ${g}" draggable="${canDrag ? 'true' : 'false'}" data-priority="${t.priority || 'normal'}" data-id="${t.id}" ${inList ? `data-action="selectListTask" style="cursor:pointer; background:${isSelected ? '#f1f5f9' : 'transparent'};"` : ''}>
          ${!isWork(t) ? '' : `<button type="button" class="check-small ${t.completed ? 'checked' : ''}" data-action="toggle" data-id="${t.id}" data-date="${t.dueDate}" aria-label="완료 토글">${t.completed ? icon('check') : ''}</button>`}
          <div class="task-open" ${!inList ? `data-action="viewDetailReport" data-id="${t.id}" style="cursor:pointer;"` : ''}>
            <div class="task-name ${priClass} ${t.completed ? 'done' : ''}" style="${t.titleColor ? `color:${t.titleColor} !important;` : ''}">${prefixTags}${esc(t.title)}</div>
            <div class="task-meta">
              ${inList && listDateStr ? `<span class="task-date-prefix" style="font-weight:700; color:#475569; font-size:11px; letter-spacing:-0.02em; margin-right:1px;">${listDateStr}</span>` : ''}
              <span class="dday-badge ${g}">${dText}</span>
              ${!isWork(t) ? '' : `${(!inList && dateRangeStr) ? `<span>${dateRangeStr}</span>` : ''}<span>${priShort}</span>`}
            </div>
            ${progBar}
          </div>
        </div>`;
      }

      function recurringRuleRow(rule, inList = true) {
        const isSelected = inList && ui.listSelectedTask === rule.id;
        const recurText = `${rule.isLunar ? '음력 ' : ''}${RECURRENCE[rule.recurrence] || (rule.recurrence + '일 마다')}`;
        const priClass = `pri-${rule.priority || 'normal'}`;
        const priHighTag = rule.priority === 'high' ? '<span class="tag-high">[H]</span>' : '';
        return `<div class="task-row rest" data-action="selectListTask" data-id="${rule.id}" style="cursor:pointer; background:${isSelected ? '#f1f5f9' : 'transparent'};">
          <div class="task-open" ${!inList ? `data-action="editRecurringRule" data-id="${rule.id}"` : ''}>
            <div class="task-name ${priClass}" style="${rule.titleColor ? `color:${rule.titleColor} !important;` : ''}">${priHighTag}<span class="tag-recurring">[${recurText}]</span>${esc(rule.title)}</div>
            <div class="task-meta">
              <span class="dday-badge rest">${recurText}</span>
              <span>시작일 ${rule.startDate || rule.dueDate}</span>
              <span>${PRIORITY[rule.priority] || 'Normal'}</span>
            </div>
          </div>
        </div>`;
      }

      function renderList() {
        const curY = new Date().getFullYear();
        const yearsSet = new Set([curY, initial.getFullYear()]);
        (data.tasks || []).forEach(t => {
          if (t && t.dueDate) {
            const y = parseInt(t.dueDate.slice(0, 4), 10);
            if (!isNaN(y)) yearsSet.add(y);
          }
        });
        for (let y = curY - 3; y <= curY + 3; y++) yearsSet.add(y);
        const years = [...yearsSet].sort((a, b) => b - a);

        if (!ui.filterYear) ui.filterYear = String(curY);
        if (ui.filterMonth === undefined || ui.filterMonth === null || ui.filterMonth === '') {
          ui.filterMonth = String(new Date().getMonth());
        }

        $('listYearFilter').innerHTML = '<option value="all">전체 연도</option>' + years.map(y => `<option value="${y}" ${String(y) === String(ui.filterYear) ? 'selected' : ''}>${y}년</option>`).join('');
        $('listYearFilter').value = ui.filterYear;
        $('listMonthFilter').value = ui.filterMonth;
        $('priorityFilter').value = ui.priority;

        const ddayCounts = { ddaythree: 0, ddayfive: 0, ddayten: 0, rest: 0 };
        (data.tasks || []).forEach(t => {
          if (t.completed || !isWork(t)) return;
          const g = group(t);
          if (ddayCounts[g] !== undefined) ddayCounts[g]++;
        });

        document.querySelectorAll('.dday-btn').forEach(btn => {
          const val = btn.dataset.value;
          btn.classList.toggle('active', val === ui.ddayFilter);
          btn.classList.toggle('is-zero', !ddayCounts[val]);
        });

        const query = ui.search.trim().toLowerCase();

        /* 반복 관리 뷰: 마스터 반복 규칙 목록 표시 */
        if (ui.priority === 'recurring') {
          const list = (data.recurrings || []).filter(rule => {
            if (query && query.length >= 2) {
              const text = [rule.title, rule.memo, ...(rule.tags || [])].join(' ').toLowerCase();
              if (!text.includes(query)) return false;
            }
            return true;
          });
          if (!list.some(r => r.id === ui.listSelectedTask)) {
            ui.listSelectedTask = list.length ? list[0].id : null;
          }
          $('listContent').innerHTML = list.length ? list.map(r => recurringRuleRow(r, true)).join('') : `<div class="empty">등록된 반복 일정이 없습니다</div>`;
          $('notificationCount').textContent = data.notifications.filter(n => !n.read).length;
          renderSide();
          return;
        }

        let list = data.tasks.filter(t => {
          /* Pure holidays are never displayed in the todo list view */
          if (!isWork(t)) return false;

          if (query && query.length >= 2) {
            const text = [t.title, t.memo, ...t.tags].join(' ').toLowerCase();
            if (!text.includes(query)) return false;
          }

          if (ui.priority !== 'all' && t.priority !== ui.priority) return false;
          const startStr = t.startDate || t.dueDate;
          const dueStr = t.dueDate;
          // [V1.6.1] 해당월로부터 2달간의 일정 표시 (예: 10월 선택 시 11월말까지 2개월 연속 표출)
          if (ui.filterMonth === 'all') {
            if (ui.filterYear !== 'all') {
              const yStr = String(ui.filterYear);
              if (dueStr.slice(0, 4) < yStr || startStr.slice(0, 4) > yStr) return false;
            }
          } else {
            if (ui.filterYear !== 'all') {
              const y1 = parseInt(ui.filterYear, 10);
              const m1 = parseInt(ui.filterMonth, 10);
              const startDateObj = new Date(y1, m1, 1);
              const endDateObj = new Date(y1, m1 + 2, 0);
              const startRange = dateStr(startDateObj);
              const endRange = dateStr(endDateObj);
              if (dueStr < startRange || startStr > endRange) return false;
            } else {
              const fm1 = parseInt(ui.filterMonth, 10);
              const fm2 = (fm1 + 1) % 12;
              const sm = parseInt(startStr.slice(5, 7), 10) - 1;
              const dm = parseInt(dueStr.slice(5, 7), 10) - 1;
              const taskMonths = [];
              if (sm <= dm) {
                for (let m = sm; m <= dm; m++) taskMonths.push(m);
              } else {
                for (let m = sm; m <= 11; m++) taskMonths.push(m);
                for (let m = 0; m <= dm; m++) taskMonths.push(m);
              }
              if (!taskMonths.includes(fm1) && !taskMonths.includes(fm2)) return false;
            }
          }

          /* SINGLE-SELECT D-DAY FILTER */
          if (ui.ddayFilter !== 'all') {
            if (group(t) !== ui.ddayFilter) return false;
          }

          return true;
        }).sort(listTaskSort);

        if (!list.some(t => t.id === ui.listSelectedTask)) {
          ui.listSelectedTask = list.length ? list[0].id : null;
        }

        $('listContent').innerHTML = list.length ? list.map(t => taskRow(t, today(), true)).join('') : `<div class="empty">조건에 맞는 일정이 없습니다</div>`;
        $('notificationCount').textContent = data.notifications.filter(n => !n.read).length;
        renderSide();
      }

          if (!el.value) return;
          const parts = el.value.split('-');
